name: Add card effects
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add editable effects to both cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths=[Path('abe/index.html'),Path('ritan-denshi-meishi/index.html')]
          marker='/* CARD_EFFECTS_V1 */'
          inject=r'''/* CARD_EFFECTS_V1 */
function ensureEffectStyles(){if(document.getElementById('cardEffectStyles'))return;let s=document.createElement('style');s.id='cardEffectStyles';s.textContent=`
.av.fx-gold::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 70%,rgba(255,255,255,.15) 76%,#fff4b0 82%,#ffd45d 87%,#fff 90%,transparent 96%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));animation:goldSweep 4.8s linear infinite;filter:drop-shadow(0 0 5px #ffd45d) drop-shadow(0 0 10px #fff0a0)}
@keyframes goldSweep{0%,68%{transform:rotate(0deg);opacity:0}72%{opacity:1}90%{transform:rotate(360deg);opacity:1}96%,100%{transform:rotate(390deg);opacity:0}}
#cardFallFx{position:fixed;inset:0;z-index:25;pointer-events:none;overflow:hidden}.cardFallItem{position:absolute;top:-12vh;animation:cardFall linear infinite;will-change:transform,opacity;filter:drop-shadow(0 2px 3px rgba(0,0,0,.08))}@keyframes cardFall{0%{transform:translate3d(0,-10vh,0) rotate(0deg)}100%{transform:translate3d(var(--drift),115vh,0) rotate(var(--rot))}}
.fxPreview{height:110px;border-radius:16px;background:linear-gradient(180deg,#f8fbff,#eef7ff);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px;color:#668}.fxPreview .miniAv{width:70px;height:70px;border-radius:50%;background:#dcecf7;border:4px solid #fff;box-shadow:0 0 0 2px #d8b66f;position:relative}.fxPreview .miniAv::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid #ffd45d;box-shadow:0 0 12px #ffd45d}
`;document.head.appendChild(s)}
function effectDefaults(){return{effectGoldRing:true,effectType:'none',effectAmount:10,effectSpeed:10,effectOpacity:.6}}
function applyCardEffects(){ensureEffectStyles();let d=effectDefaults();for(let k in d)if(P[k]===undefined)P[k]=d[k];let av=document.querySelector('.av');if(av)av.classList.toggle('fx-gold',!!P.effectGoldRing);document.querySelectorAll('.fx .star,.fx .petal').forEach(el=>el.style.display='none');let layer=document.getElementById('cardFallFx');if(!layer){layer=document.createElement('div');layer.id='cardFallFx';document.body.appendChild(layer)}layer.innerHTML='';let map={snow:['❄️','❅','✦'],sakura:['🌸','🌸','✿'],sparkle:['✨','✦','✧'],music:['♪','♫','♩'],heart:['♡','♥','♡'],food:['🍴','✦','🍽️']};let arr=map[P.effectType];if(!arr||P.effectType==='none')return;let n=Math.max(2,Math.min(30,+P.effectAmount||10)),base=Math.max(4,Math.min(20,+P.effectSpeed||10)),op=Math.max(.1,Math.min(1,+P.effectOpacity||.6));for(let i=0;i<n;i++){let e=document.createElement('span');e.className='cardFallItem';e.textContent=arr[i%arr.length];let size=12+Math.random()*13,dur=base*(.75+Math.random()*.7),delay=-Math.random()*dur;e.style.left=(Math.random()*100)+'vw';e.style.fontSize=size+'px';e.style.opacity=String(op*(.65+Math.random()*.35));e.style.animationDuration=dur+'s';e.style.animationDelay=delay+'s';e.style.setProperty('--drift',(-7+Math.random()*14)+'vw');e.style.setProperty('--rot',(-260+Math.random()*520)+'deg');layer.appendChild(e)}}
const __renderWithFx=render;render=function(){__renderWithFx();applyCardEffects()};
const __menuWithFx=menu;menu=function(){__menuWithFx();let m=B.querySelector('.menu');if(m&&!document.getElementById('fxEdit')){let b=document.createElement('button');b.className='choice wide';b.id='fxEdit';b.innerHTML='<span>✨</span>エフェクト編集<small>金色リング・雪・桜・キラキラ・音符・ハート・食事</small>';m.appendChild(b);b.onclick=effectsEdit}}
function effectsEdit(){let d=effectDefaults();for(let k in d)if(P[k]===undefined)P[k]=d[k];B.innerHTML=`<button class="btn dark" id="back">← 戻る</button><h2>✨ エフェクト編集</h2><div class="group"><b>⭕ プロフィール円の光</b><label class="toggle"><span>金色の光が一瞬、円周を走る</span><input id="goldfx" type="checkbox" ${P.effectGoldRing?'checked':''}></label><p class="hint">数秒おきに一瞬だけ光る、控えめなゴールド演出です。</p></div><div class="group"><b>🌸 上から降るエフェクト</b><label>種類</label><select id="etype"><option value="none">なし</option><option value="snow">❄️ 雪</option><option value="sakura">🌸 桜</option><option value="sparkle">✨ キラキラ</option><option value="music">♩ 音符</option><option value="heart">♡ ハート</option><option value="food">🍴 食事</option></select><div class="range"><span>量</span><input id="eamount" type="range" min="2" max="30" step="1" value="${P.effectAmount}"><b id="eamountv">${P.effectAmount}</b></div><div class="range"><span>速度</span><input id="espeed" type="range" min="4" max="20" step="1" value="${P.effectSpeed}"><b id="espeedv">${P.effectSpeed}s</b></div><div class="range"><span>透明度</span><input id="eopacity" type="range" min=".1" max="1" step=".05" value="${P.effectOpacity}"><b id="eopacityv">${Math.round(P.effectOpacity*100)}%</b></div><div class="fxPreview"><div class="miniAv"></div></div></div><button class="btn" id="fxsave">☁️ エフェクトを保存</button>`;$('back').onclick=menu;$('etype').value=P.effectType||'none';let preview=()=>{P.effectGoldRing=$('goldfx').checked;P.effectType=$('etype').value;P.effectAmount=+$('eamount').value;P.effectSpeed=+$('espeed').value;P.effectOpacity=+$('eopacity').value;$('eamountv').textContent=P.effectAmount;$('espeedv').textContent=P.effectSpeed+'s';$('eopacityv').textContent=Math.round(P.effectOpacity*100)+'%';applyCardEffects()};['goldfx','etype','eamount','espeed','eopacity'].forEach(id=>$(id).oninput=preview);$('fxsave').onclick=async()=>{try{preview();await save();toast('エフェクトを保存しました');menu()}catch(e){alert(e.message)}}}
'''
          for p in paths:
              t=p.read_text()
              if marker in t:
                  print('already patched',p);continue
              needle='load();</script>'
              if needle not in t:
                  raise SystemExit(f'load marker not found: {p}')
              t=t.replace(needle,inject+'\n'+needle,1)
              p.write_text(t)
              print('patched',p)
          PY
          if git diff --quiet -- abe/index.html ritan-denshi-meishi/index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- abe/index.html ritan-denshi-meishi/index.html
          git commit -m "Add editable card effects"
          git push origin main
