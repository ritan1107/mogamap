name: Add typography editor
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add typography editor to both cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths=[Path('abe/index.html'),Path('ritan-denshi-meishi/index.html')]
          marker='__cardTypographyV1'
          inject=r'''let typeDefaults=function(){return{nameSize:32,nameColor:'',nameWeight:900,nameAlign:'center',headingSize:17,headingColor:'',headingWeight:800,headingAlign:'left',bodySize:13,bodyColor:'',bodyWeight:400,bodyAlign:'left',bodyLineHeight:1.9,buttonSize:12,buttonColor:'',buttonWeight:900,buttonAlign:'center'}};function initType(){let d=typeDefaults();for(let k in d)if(P[k]===undefined)P[k]=d[k]}function applyType(){initType();let root=document.documentElement.style;root.setProperty('--ty-name-size',P.nameSize+'px');root.setProperty('--ty-name-color',P.nameColor||'inherit');root.setProperty('--ty-name-weight',P.nameWeight);root.setProperty('--ty-name-align',P.nameAlign);root.setProperty('--ty-heading-size',P.headingSize+'px');root.setProperty('--ty-heading-color',P.headingColor||'inherit');root.setProperty('--ty-heading-weight',P.headingWeight);root.setProperty('--ty-heading-align',P.headingAlign);root.setProperty('--ty-body-size',P.bodySize+'px');root.setProperty('--ty-body-color',P.bodyColor||'inherit');root.setProperty('--ty-body-weight',P.bodyWeight);root.setProperty('--ty-body-align',P.bodyAlign);root.setProperty('--ty-body-line',P.bodyLineHeight);root.setProperty('--ty-button-size',P.buttonSize+'px');root.setProperty('--ty-button-color',P.buttonColor||'inherit');root.setProperty('--ty-button-weight',P.buttonWeight);root.setProperty('--ty-button-align',P.buttonAlign);if(!document.getElementById('cardTypographyCss')){let s=document.createElement('style');s.id='cardTypographyCss';s.textContent='.hero h1{font-size:var(--ty-name-size)!important;color:var(--ty-name-color)!important;font-weight:var(--ty-name-weight)!important;text-align:var(--ty-name-align)!important}.title{font-size:var(--ty-heading-size)!important;color:var(--ty-heading-color)!important;font-weight:var(--ty-heading-weight)!important;text-align:var(--ty-heading-align)!important}.story p,.role,.hint,.person .p,.service,.cap{font-size:var(--ty-body-size)!important;color:var(--ty-body-color)!important;font-weight:var(--ty-body-weight)!important;text-align:var(--ty-body-align)!important;line-height:var(--ty-body-line)!important}.gem,.link,.share button,.nav button,.btn,.choice{font-size:var(--ty-button-size)!important;color:var(--ty-button-color)!important;font-weight:var(--ty-button-weight)!important;text-align:var(--ty-button-align)!important}';document.head.appendChild(s)}}let oldRenderType=render;render=function(){oldRenderType();applyType()};let menuWithType=menu;menu=function(){menuWithType();let m=B.querySelector('.menu');if(m&&!document.getElementById('typeEditBtn')){let b=document.createElement('button');b.id='typeEditBtn';b.className='choice wide';b.innerHTML='<span>🔤</span>文字デザイン<small>名前・見出し・本文・ボタンの大きさ／色／太さ／配置</small>';m.appendChild(b);b.onclick=typeEditor}};function typeEditor(){initType();let colorInput=(id,label,val)=>'<label>'+label+'</label><div style="display:grid;grid-template-columns:1fr 54px;gap:8px"><input id="'+id+'Text" value="'+(val||'')+'" placeholder="空欄＝元の色"><input id="'+id+'" type="color" value="'+(val||'#29414b')+'"></div>';let select=(id,val)=>'<select id="'+id+'"><option value="left">左</option><option value="center">中央</option><option value="right">右</option></select>';B.innerHTML='<button class="btn dark" id="tyback">← 戻る</button><h2>🔤 文字デザイン編集</h2><p class="hint">変更するとその場でプレビューできます。空欄の色は元のデザイン色を使います。</p><div class="group"><b>👤 名前</b><div class="range"><span>大きさ</span><input id="nameSize" type="range" min="20" max="52" value="'+P.nameSize+'"><b id="nameSizeV">'+P.nameSize+'px</b></div>'+colorInput('nameColor','文字色',P.nameColor)+'<label>太さ</label><select id="nameWeight"><option value="400">標準</option><option value="700">太字</option><option value="900">極太</option></select><label>配置</label>'+select('nameAlign',P.nameAlign)+'</div><div class="group"><b>🏷️ 見出し</b><div class="range"><span>大きさ</span><input id="headingSize" type="range" min="12" max="32" value="'+P.headingSize+'"><b id="headingSizeV">'+P.headingSize+'px</b></div>'+colorInput('headingColor','文字色',P.headingColor)+'<label>太さ</label><select id="headingWeight"><option value="400">標準</option><option value="700">太字</option><option value="900">極太</option></select><label>配置</label>'+select('headingAlign',P.headingAlign)+'</div><div class="group"><b>📖 本文</b><div class="range"><span>大きさ</span><input id="bodySize" type="range" min="10" max="24" value="'+P.bodySize+'"><b id="bodySizeV">'+P.bodySize+'px</b></div>'+colorInput('bodyColor','文字色',P.bodyColor)+'<label>太さ</label><select id="bodyWeight"><option value="400">標準</option><option value="600">少し太字</option><option value="700">太字</option></select><label>配置</label>'+select('bodyAlign',P.bodyAlign)+'<div class="range"><span>行間</span><input id="bodyLineHeight" type="range" min="1.2" max="2.6" step=".1" value="'+P.bodyLineHeight+'"><b id="bodyLineV">'+P.bodyLineHeight+'</b></div></div><div class="group"><b>🔘 ボタン文字</b><div class="range"><span>大きさ</span><input id="buttonSize" type="range" min="9" max="22" value="'+P.buttonSize+'"><b id="buttonSizeV">'+P.buttonSize+'px</b></div>'+colorInput('buttonColor','文字色',P.buttonColor)+'<label>太さ</label><select id="buttonWeight"><option value="400">標準</option><option value="700">太字</option><option value="900">極太</option></select><label>配置</label>'+select('buttonAlign',P.buttonAlign)+'</div><button class="btn" id="typesave">☁️ 文字デザインを保存</button>';$('tyback').onclick=menu;['nameWeight','headingWeight','bodyWeight','buttonWeight'].forEach(id=>$(id).value=String(P[id]));['nameAlign','headingAlign','bodyAlign','buttonAlign'].forEach(id=>$(id).value=P[id]);let preview=function(){['name','heading','body','button'].forEach(k=>{P[k+'Size']=+$(k+'Size').value;P[k+'Color']=$(k+'ColorText').value.trim();P[k+'Weight']=+$(k+'Weight').value;P[k+'Align']=$(k+'Align').value});P.bodyLineHeight=+$('bodyLineHeight').value;$('nameSizeV').textContent=P.nameSize+'px';$('headingSizeV').textContent=P.headingSize+'px';$('bodySizeV').textContent=P.bodySize+'px';$('buttonSizeV').textContent=P.buttonSize+'px';$('bodyLineV').textContent=P.bodyLineHeight;applyType()};['nameSize','nameWeight','nameAlign','headingSize','headingWeight','headingAlign','bodySize','bodyWeight','bodyAlign','bodyLineHeight','buttonSize','buttonWeight','buttonAlign'].forEach(id=>$(id).oninput=preview);['nameColor','headingColor','bodyColor','buttonColor'].forEach(id=>{$(id).oninput=e=>{$(id+'Text').value=e.target.value;preview()};$(id+'Text').oninput=preview});$('typesave').onclick=async function(){try{preview();await save();toast('文字デザインを保存しました');menu()}catch(e){alert(e.message)}}}applyType();window.__cardTypographyV1=true;'''
          for p in paths:
              t=p.read_text()
              if marker in t:
                  print('already patched',p);continue
              needle="apply()}let f=document.getElementById('card')"
              if needle not in t:
                  raise SystemExit(f'patch point not found: {p}')
              t=t.replace(needle,inject+"apply()}let f=document.getElementById('card')",1)
              p.write_text(t)
              print('patched',p)
          PY
          if git diff --quiet -- abe/index.html ritan-denshi-meishi/index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- abe/index.html ritan-denshi-meishi/index.html
          git commit -m "Add typography editor to digital cards"
          git push origin main
