name: Apply Hokkaido creator info
on:
  push:
    paths:
      - '.creator-info-deploy-trigger'
      - '.github/workflows/apply-hokkaido-creator-info.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='<link rel="stylesheet" href="./hokkaido-creator-info-v1.css?v=1">\n'
          js='<script src="./hokkaido-creator-info-v1.js?v=1"></script>\n'
          if css not in s:
              s=s.replace('</head>',css+'</head>')
          if js not in s:
              s=s.replace('</body>',js+'</body>')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Enable creator info panel'
          git push