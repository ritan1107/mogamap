name: Apply Hokkaido map policy v3
on:
  push:
    paths:
      - '.github/workflows/apply-hokkaido-map-policy-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="./hokkaido-map-policy-v3.js"></script>'
          if tag not in s:
              s=s.replace('</body></html>',tag+'\n</body></html>')
              p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "MOGU Map Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Apply Japan-only map and Google/community routing"
          git push
