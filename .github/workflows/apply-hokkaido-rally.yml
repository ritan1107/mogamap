name: Apply Hokkaido rally patch
on:
  push:
    paths:
      - 'trigger-hokkaido-rally.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("s.status==='fulfilled'&&s.value?.length===36", "s.status==='fulfilled'&&Array.isArray(s.value)&&s.value.length>0")
          s=s.replace('36店舗をピン表示','店舗ピンを表示')
          css='<link rel="stylesheet" href="./hokkaido-rally-ui-v2.css">'
          js='<script src="./hokkaido-rally-ui-v2.js"></script>'
          if css not in s: s=s.replace('</head>',css+'\n</head>')
          if js not in s: s=s.replace('</body>',js+'\n</body>')
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "MOGU Map Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Show all Hokkaido shops and highlight rally stores"
          git push
