name: Apply simple navigation
on:
  push:
    paths:
      - '.github/workflows/apply-simple-nav.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect four-action navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='<link rel="stylesheet" href="mogumap-simple-nav-v1.css?v=1">'
          js='<script src="mogumap-simple-nav-v1.js?v=1"></script>'
          if css not in s:
              s=s.replace('</head>', css+'\n</head>')
          if js not in s:
              s=s.replace('</body>', js+'\n</body>')
          p.write_text(s)
          PY
      - name: Commit public app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Connect four-action navigation to public app"
          git push
