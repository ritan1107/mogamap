name: Patch Hokkaido rally UI

on:
  push:
    paths:
      - '.github/workflows/patch-hokkaido-rally.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect simplified navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="mogumap-simple-nav-v1.css?v=1">'
          js = '<script src="mogumap-simple-nav-v1.js?v=1"></script>'
          if css not in s:
              s = s.replace('</head>', css + '\n</head>')
          if js not in s:
              s = s.replace('</body>', js + '\n</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "MOGU Map Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Connect four-action navigation to public app"
          git push
