name: Patch story editor safely
on:
  push:
    paths:
      - '.github/workflows/patch-story-editor.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only story UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('ritan-denshi-meishi/index.html')
          s=p.read_text(encoding='utf-8')
          original=s
          if 'id="storyText"' not in s:
              s,n=re.subn(r'<section class="panel story" id="story">.*?</section><section class="panel" id="service">','<section class="panel story" id="story"><h2 class="title">My Story ～子育ては、現在進行形。～</h2><div id="storyText"></div></section><section class="panel" id="service">',s,count=1,flags=re.S)
              assert n==1, f'story section patch count={n}'
          if 'storyText:' not in s:
              s,n=re.subn(r'galleryPhotos:\[\]\};',"galleryPhotos:[],storyText:''};",s,count=1)
              assert n==1, f'default story field patch count={n}'
          if "$('storyText').innerHTML" not in s:
              pat=r"(\$\('hobbyGrid'\)\.innerHTML=.*?\.join\(''\);)gallery\(\)\}"
              add=r"\1let st=(P.storyText||'').trim();$('storyText').innerHTML=st?st.split(/\n\s*\n/).map(x=>`<p>${esc(x).replace(/\n/g,'<br>')}</p>`).join(''):'<p>ストーリーを準備中です。</p>';gallery()}"
              s,n=re.subn(pat,add,s,count=1)
              assert n==1, f'render patch count={n}'
          if 'id="storyEditBtn"' not in s:
              pat=r'(<button class="choice wide" id="cnt"><span>🌷</span>コンテンツ編集<small>.*?</small></button>)'
              s,n=re.subn(pat,'<button class="choice wide" id="storyEditBtn"><span>📖</span>ストーリー編集<small>My Story の文章を編集</small></button>'+r'\1',s,count=1)
              assert n==1, f'menu button patch count={n}'
              s,n=re.subn(r"(\$\('des'\)\.onclick=design;)(\$\('cnt'\)\.onclick=content\})",r"\1$('storyEditBtn').onclick=storyEdit;\2",s,count=1)
              assert n==1, f'menu handler patch count={n}'
          if 'function storyEdit(){' not in s:
              fn="function storyEdit(){B.innerHTML=`<button class=\"btn dark\" id=\"back\">← 戻る</button><h2>📖 ストーリー編集</h2><div class=\"group\"><b>My Story</b><p style=\"font-size:10.5px;color:#6a8189\">段落を空行で区切ると、読みやすく表示されます。</p><textarea id=\"storyEditor\" style=\"min-height:420px\">${esc(P.storyText||'')}</textarea></div><button class=\"btn\" id=\"saveStory\">☁️ ストーリーを保存</button>`;$('back').onclick=menu;$('saveStory').onclick=async()=>{try{let v=$('storyEditor').value.trim();if(!v)throw Error('ストーリー本文を入力してください');P.storyText=v;await save();toast('ストーリーを保存しました');menu()}catch(e){alert(e.message)}}}"
              s,n=s.replace('function content(){',fn+'function content(){',1),1
          assert '0201' not in s, 'PIN leaked into public HTML'
          assert 'id="storyText"' in s and 'function storyEdit(){' in s and 'id="storyEditBtn"' in s
          if s!=original:p.write_text(s,encoding='utf-8')
          PY
      - name: Commit story-only changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ritan-denshi-meishi/index.html
          git commit -m 'Add editable cloud-backed story section'
          git push