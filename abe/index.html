<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5ab6e8"><title>阿部英明｜電子名刺</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071c43}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent}</style></head><body><iframe id="card" src="base.html" allow="autoplay; clipboard-write; web-share"></iframe><script>function installEffects(){if(window.__cardEffectsV2)return;window.__cardEffectsV2=true;function defaults(){return{effectGoldRing:true,effectType:location.pathname.includes('ritan-denshi-meishi')?'sakura':'sparkle',effectAmount:7,effectSpeed:5,effectOpacity:.45}}function initDefaults(){let d=defaults();for(let k in d)if(P[k]===undefined)P[k]=d[k]}function styles(){if(document.getElementById('cardEffectsCss'))return;let s=document.createElement('style');s.id='cardEffectsCss';s.textContent='.av.fxGold::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:9;background:conic-gradient(from 0deg,transparent 0 72%,rgba(255,255,255,.15) 77%,#fff7c7 82%,#ffd45c 87%,#fff 91%,transparent 97%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));filter:drop-shadow(0 0 5px #ffd35a) drop-shadow(0 0 11px #fff0a0);animation:fxGoldSweep 5.2s linear infinite}@keyframes fxGoldSweep{0%,67%{transform:rotate(0);opacity:0}72%{opacity:1}90%{transform:rotate(360deg);opacity:1}96%,100%{transform:rotate(390deg);opacity:0}}#fallFxLayer{position:fixed;inset:0;z-index:25;pointer-events:none;overflow:hidden}.fallFxItem{position:absolute;top:-12vh;animation:fxFall linear infinite;will-change:transform;filter:drop-shadow(0 2px 3px rgba(0,0,0,.08))}@keyframes fxFall{from{transform:translate3d(0,-10vh,0) rotate(0deg)}to{transform:translate3d(var(--drift),115vh,0) rotate(var(--rot))}}';document.head.appendChild(s)}function apply(){initDefaults();styles();let av=document.querySelector('.av');if(av)av.classList.toggle('fxGold',!!P.effectGoldRing);document.querySelectorAll('.fx .star,.fx .petal').forEach(e=>e.style.display='none');let layer=document.getElementById('fallFxLayer');if(!layer){layer=document.createElement('div');layer.id='fallFxLayer';document.body.appendChild(layer)}layer.innerHTML='';let map={snow:['❄️','❅','❄️'],sakura:['🌸','🌸','✿'],sparkle:['✨','✦','✧'],music:['♩','♪','♫'],heart:['♡','♥','♡'],food:['🍴','🍴','✦']};let a=map[P.effectType];if(!a||P.effectType==='none')return;let n=Math.max(3,Math.min(20,+P.effectAmount||7)),sp=Math.max(1,Math.min(10,+P.effectSpeed||5)),op=Math.max(.2,Math.min(1,+P.effectOpacity||.45)),base=16-sp;for(let i=0;i<n;i++){let e=document.createElement('span');e.className='fallFxItem';e.textContent=a[i%a.length];let dur=base*(.8+Math.random()*.55);e.style.left=(Math.random()*100)+'vw';e.style.fontSize=(12+Math.random()*11)+'px';e.style.opacity=String(op*(.7+Math.random()*.3));e.style.animationDuration=dur+'s';e.style.animationDelay=(-Math.random()*dur)+'s';e.style.setProperty('--drift',(-8+Math.random()*16)+'vw');e.style.setProperty('--rot',(-280+Math.random()*560)+'deg');layer.appendChild(e)}}let oldRender=render;render=function(){oldRender();apply()};let oldMenu=menu;menu=function(){oldMenu();let m=B.querySelector('.menu');if(m&&!document.getElementById('effectEditBtn')){let b=document.createElement('button');b.id='effectEditBtn';b.className='choice wide';b.innerHTML='<span>✨</span>エフェクト編集<small>金色リング・雪・桜・キラキラ・音符・ハート・🍴</small>';m.appendChild(b);b.onclick=effectEditor}};function effectEditor(){initDefaults();B.innerHTML='<button class="btn dark" id="fxback">← 戻る</button><h2>✨ エフェクト編集</h2><div class="group"><b>⭕ プロフィール円</b><label class="toggle">金色の光が一瞬、円に沿って走る<input id="fxgold" type="checkbox" '+(P.effectGoldRing?'checked':'')+'></label><p class="hint">常に光るのではなく、数秒おきに一瞬だけ光ります。</p></div><div class="group"><b>🌸 上から少し降るエフェクト</b><label>種類</label><select id="fxtype"><option value="none">なし</option><option value="snow">❄️ 雪</option><option value="sakura">🌸 桜</option><option value="sparkle">✨ キラキラ</option><option value="music">♩ 音符</option><option value="heart">♡ ハート</option><option value="food">🍴 食事</option></select><div class="range"><span>量</span><input id="fxamount" type="range" min="3" max="20" value="'+P.effectAmount+'"><b id="fxamountv">'+P.effectAmount+'</b></div><div class="range"><span>速さ</span><input id="fxspeed" type="range" min="1" max="10" value="'+P.effectSpeed+'"><b id="fxspeedv">'+P.effectSpeed+'</b></div><div class="range"><span>透明度</span><input id="fxopacity" type="range" min=".2" max="1" step=".05" value="'+P.effectOpacity+'"><b id="fxopacityv">'+Math.round(P.effectOpacity*100)+'%</b></div></div><button class="btn" id="fxsave">☁️ エフェクトを保存</button>';$('fxtype').value=P.effectType||'none';$('fxback').onclick=menu;let preview=function(){P.effectGoldRing=$('fxgold').checked;P.effectType=$('fxtype').value;P.effectAmount=+$('fxamount').value;P.effectSpeed=+$('fxspeed').value;P.effectOpacity=+$('fxopacity').value;$('fxamountv').textContent=P.effectAmount;$('fxspeedv').textContent=P.effectSpeed;$('fxopacityv').textContent=Math.round(P.effectOpacity*100)+'%';apply()};['fxgold','fxtype','fxamount','fxspeed','fxopacity'].forEach(id=>$(id).oninput=preview);$('fxsave').onclick=async function(){try{preview();await save();toast('エフェクトを保存しました');menu()}catch(e){alert(e.message)}}}apply()}let f=document.getElementById('card');f.addEventListener('load',()=>{try{f.contentWindow.eval('('+installEffects.toString()+')()')}catch(e){console.error(e)}});</script></body></html>
