<style>:root{--o:#f28b25;--g:#278668;--bg:#fffaf2;--ink:#292722;--muted:#756f68;--line:#eadfd2;--shadow:0 7px 22px #5b3b1812}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;padding-bottom:78px}button,input{font:inherit}header{position:sticky;top:0;z-index:900;background:#fffaf2f2;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.head{max-width:980px;margin:auto;padding:11px 14px}.brand{font-size:20px;font-weight:950;color:var(--o)}.count{font-size:12px;color:var(--muted);font-weight:800}.search{display:flex;margin-top:9px;border:1px solid var(--line);background:#fff;border-radius:999px;overflow:hidden}.search input{width:100%;border:0;outline:0;padding:12px 15px;background:transparent}.search button{border:0;background:#fff;padding:0 15px}.filters{display:flex;gap:7px;overflow:auto;padding:10px 0 2px}.filter{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font-weight:850}.filter.on{background:var(--o);color:#fff;border-color:var(--o)}main{max-width:980px;margin:auto;padding:12px}.view{display:none}.view.on{display:block}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.panelPad{padding:17px}.mapMeta{display:flex;justify-content:space-between;align-items:center;padding:10px 13px;font-size:12px;color:var(--muted)}#map{height:min(48vh,430px);min-height:310px}.heading{display:flex;justify-content:space-between;align-items:end;margin:18px 2px 10px}.heading h2{margin:0;font-size:19px}.resultCount{font-weight:900;color:var(--g)}.shopList{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.shop{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}.cat{font-size:12px;font-weight:900;color:var(--g)}.shop h3{margin:5px 0;font-size:17px}.muted{color:var(--muted);font-size:13px;line-height:1.55}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:900;background:var(--o);color:#fff;text-decoration:none;display:inline-block}.btn.green{background:var(--g)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.small{padding:8px 10px;font-size:12px}.bottom{position:fixed;z-index:1000;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fffffff2;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.tab{border:0;background:transparent;padding:9px 2px 7px;color:#6e6961;font-size:11px;font-weight:850}.tab b{display:block;font-size:21px}.tab.on{color:var(--o)}.modal{position:fixed;z-index:1500;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center}.modal.on{display:flex}.sheet{width:min(700px,100%);max-height:91vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:19px}.close{float:right;border:0;border-radius:50%;width:36px;height:36px;font-size:20px}.progress{height:14px;background:#eee5da;border-radius:99px;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,var(--o),#ffc35b)}.stampGrid{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.stampGrid.open{display:grid}.stamp{aspect-ratio:1;border:2px dashed #dacdbc;border-radius:50%;display:grid;place-items:center;text-align:center;padding:6px;font-size:10px;color:#91877b}.stamp.got{border-style:solid;border-color:var(--o);background:#fff2df;color:#d76d00;font-weight:900}.complete{text-align:center;background:linear-gradient(145deg,#fff1d8,#eefbf5);padding:24px;border-radius:20px}.complete h1{color:var(--o);font-size:25px}.code{font-size:20px;font-weight:950;letter-spacing:1px;border:2px dashed var(--o);padding:12px;border-radius:13px;background:#fff}.reward{margin-top:15px;background:#fff;padding:17px;border-radius:16px}.reward img{max-width:100%;border-radius:13px}.job{border-left:5px solid var(--g)}.empty{text-align:center;color:var(--muted);padding:25px}.notice{background:#fff5d5;border:1px solid #edd899;border-radius:12px;padding:10px;font-size:12px}.leaflet-popup-content{margin:12px}.cluster-note{font-size:11px}.confetti{font-size:30px}.organizer{margin-top:24px;border-top:1px solid var(--line);padding-top:16px}@media(max-width:640px){.shopList{grid-template-columns:1fr}.head{padding:9px 12px}.shop{border-radius:14px}#map{height:39vh;min-height:285px}.sheet{padding:17px}.heading{margin-top:14px}}@media(min-width:900px){.stampGrid{grid-template-columns:repeat(6,1fr)}}</style></head><body>
<header><div class="head"><div class="brand">📍 もがマップ北海道</div><div class="count" id="topCount">店舗データ読込中…</div><div class="search"><input id="search" placeholder="🔎 店名・地域・キーワードで検索"><button id="searchBtn">検索</button></div><div class="filters" id="filters"><button class="filter on" data-filter="all">すべて</button><button class="filter" data-filter="food">飲食</button><button class="filter" data-filter="beauty">美容</button><button class="filter" data-filter="shopping">買物</button><button class="filter" data-filter="other">その他</button></div></div></header>
<main><section class="view on" id="mapView"><div class="panel"><div id="map"></div><div class="mapMeta"><span id="mapStatus">36店舗をピン表示</span><span>※一部は地域の概算位置</span></div></div><div class="heading"><h2>近くのお店・検索結果</h2><span class="resultCount" id="resultCount">0件</span></div><div class="shopList" id="shopList"></div></section>

const H={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},EXACT=new Set('32dd32f1-eadd-4c92-a8cb-bab2ad8ef3a8,644ff87b-36d2-4543-ac6a-5f36cf65a04b,a7bc79fc-10fc-4844-a438-0187bbc014f2,c2bd3ade-afb2-4938-8464-be6285916a63,5426f456-1fb9-4d75-a58d-39a28a68aa86,9ab9d21e-8826-477f-a379-0f632bd50e0c,b9d82e0f-fec2-4ddb-bcff-159b78b189cb'.split(','));
let shops=[],settings={},filter='all',map,clusters,participant=loadParticipant(),progress=null,stampIds=new Set();
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=v=>/^https?:\/\//i.test(String(v||''))?String(v):''; const area=a=>String(a||'').replace(/^北海道/,'').replace(/([市区町村]).*$/,'$1');

const icon=c=>({food:'🍽️',izakaya:'🍺',seafood:'🐟',cafe:'☕',beauty:'✂️',shopping:'🛍️',other:'📌'}[c]||'📌');
async function api(path,opt={}){const r=await fetch(SB+'/rest/v1/'+path,{...opt,headers:{...H,...(opt.headers||{})}});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
function loadParticipant(){try{return JSON.parse(localStorage.getItem('mogaParticipantV3')||'null')}catch{return null}} function saveParticipant(p){participant=p;localStorage.setItem('mogaParticipantV3',JSON.stringify(p))}
async function init(){const [s,r]=await Promise.allSettled([api('shop_public?select=*&is_published=eq.true&order=name.asc'),api('rally_settings_public?select=*&limit=1')]);shops=s.status==='fulfilled'?s.value:[];settings=r.status==='fulfilled'?(r.value[0]||{}):{};document.getElementById('topCount').textContent=shops.length+'店舗掲載';initMap();renderAll();if(participant)await refreshProgress()}
function initMap(){map=L.map('map',{zoomControl:true}).setView([43.2,141.6],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);clusters=L.markerClusterGroup({showCoverageOnHover:false});map.addLayer(clusters)}
function filtered(){const q=document.getElementById('search').value.trim().toLowerCase();return shops.filter(s=>(filter==='all'||group(s.category)===filter)&&(`${s.name} ${s.address} ${s.description}`).toLowerCase().includes(q))}
function renderAll(){renderShops();renderJobs();renderRally()}
function renderShops(){const list=filtered();document.getElementById('resultCount').textContent=list.length+'件';document.getElementById('shopList').innerHTML=list.length?list.map(s=>`<article class="shop" onclick="openDetail('${s.id}')"><div class="cat">${icon(s.category)} ${esc(s.category)}</div><h3>${esc(s.name)}</h3><div class="muted">📍 ${esc(area(s.address))}</div><div class="muted">${esc(s.description||'')}</div><div class="actions"><button class="btn small" onclick="event.stopPropagation();openDetail('${s.id}')">詳しく見る</button><button class="btn green small" onclick="event.stopPropagation();navigateShop('${s.id}')">経路</button></div></article>`).join(''):'<div class="empty">該当する店舗がありません</div>';clusters.clearLayers();list.forEach(s=>{if(!Number.isFinite(+s.latitude)||!Number.isFinite(+s.longitude))return;const m=L.marker([+s.latitude,+s.longitude]);m.bindPopup(`<b>${icon(s.category)} ${esc(s.name)}</b><br><small>${esc(area(s.address))}</small><br><small>${esc(s.description||'')}</small><div class="actions"><button class="btn small" onclick="openDetail('${s.id}')">店舗を見る</button><button class="btn green small" onclick="navigateShop('${s.id}')">経路</button></div>${EXACT.has(s.id)?'':'<div class="cluster-note">※地域の概算位置</div>'}`);clusters.addLayer(m)});if(clusters.getLayers().length){const b=clusters.getBounds();if(b.isValid())map.fitBounds(b,{padding:[25,25],maxZoom:11})}}
function navigateShop(id){const s=shops.find(x=>x.id===id);if(s)window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(`${s.name} ${s.address}`),'_blank')}
const link=(u,l)=>safe(u)?`<a class="btn ghost small" target="_blank" rel="noopener" href="${esc(u)}">${l}</a>`:`<span class="btn ghost small" aria-disabled="true">${l}：準備中</span>`;
function openDetail(id){const s=shops.find(x=>x.id===id);if(!s)return;document.getElementById('detail').innerHTML=`<div class="cat">${icon(s.category)} ${esc(s.category)}</div><h2>${esc(s.name)}</h2><p>📍 ${esc(s.address)}</p><p>${esc(s.description||'')}</p><div class="notice">地図位置：${EXACT.has(s.id)?'住所検索結果':'地域の概算位置。経路ボタンは店名と住所で検索します。'}</div><div class="actions"><button class="btn green" onclick="navigateShop('${s.id}')">ここまでナビ</button>${link(s.website_url,'ホームページ')}${link(s.point_purchase_url,'ポイント')}${link(s.community_url,'コミュニティ')}${link(s.instagram_url,'Instagram')}${link(s.facebook_url,'Facebook')}${link(s.x_url,'X')}${link(s.line_url,'LINE')}</div><hr><h3>🎫 スタンプラリー</h3><p>${s.stamp_rally_enabled?'対象店舗です':'現在は対象外です'}</p>${s.stamp_rally_enabled?`<button class="btn" onclick="claimStamp('${s.id}')">店舗スタッフとスタンプを押す</button>`:''}<hr><h3>💼 スポットバイト</h3>${s.spot_job_enabled?jobHtml(s):'<p class="muted">現在募集はありません。</p>'}<div class="organizer"><button class="btn ghost small" onclick="shopAdmin('${s.id}')">店舗管理</button></div>`;document.getElementById('detailModal').classList.add('on')}
function closeModal(id){document.getElementById(id).classList.remove('on')}
function jobHtml(s){return `<article class="shop job"><h3>${esc(s.spot_job_title||'スタッフ募集')}</h3><p>${esc(s.spot_job_description||'')}</p><div class="muted">💰 ${s.spot_job_hourly_wage?esc(s.spot_job_hourly_wage)+'円':'応相談'}<br>🗓 ${esc(s.spot_job_schedule||'')}<br>応募：${esc(s.spot_job_contact||'店舗へお問い合わせください')}</div></article>`}
function renderJobs(){const j=shops.filter(s=>s.spot_job_enabled);document.getElementById('jobList').innerHTML=j.length?j.map(jobHtml).join(''):'<div class="empty">現在募集はありません。</div>'}
async function startRally(){const n=document.getElementById('nickname').value.trim();if(!n)return alert('ニックネームを入力してください');try{const d=await api('rpc/start_rally',{method:'POST',body:JSON.stringify({p_nickname:n})});const x=d[0];saveParticipant({id:x.participant_id,token:x.participant_token,nickname:x.nickname});await refreshProgress()}catch(e){alert('参加登録できませんでした') }}
async function refreshProgress(){if(!participant)return renderRally();try{const [p,ids]=await Promise.all([api('rpc/get_rally_progress',{method:'POST',body:JSON.stringify({p_participant_id:participant.id,p_participant_token:participant.token})}),api('rpc/get_participant_stamp_ids',{method:'POST',body:JSON.stringify({p_participant_id:participant.id,p_participant_token:participant.token})})]);progress=p[0];stampIds=new Set(ids.map(x=>x.shop_id));renderRally()}catch(e){localStorage.removeItem('mogaParticipantV3');participant=null;renderRally()}}
function renderRally(){const a=document.getElementById('rallyArea');if(!participant){a.innerHTML=`<h2>🎫 ${esc(settings.rally_title||'北海道スタンプラリー')}</h2><p>参加する名前を入力してください<br><span class="muted">※本名でなくてもOKです</span></p><input id="nickname" style="width:100%;padding:13px;border:1px solid var(--line);border-radius:12px" placeholder="ニックネーム入力"><div class="actions"><button class="btn" onclick="startRally()">参加する</button></div>`;return}if(progress?.completed){a.innerHTML=completeHtml();return}const got=progress?.stamp_count||stampIds.size,total=progress?.total_shops||shops.filter(s=>s.stamp_rally_enabled).length||36,left=Math.max(total-got,0);a.innerHTML=`<h2>🎫 ${esc(participant.nickname)}さんのスタンプラリー</h2><h3>${got} / ${total}店舗</h3><p>あと${left}店舗！</p><div class="progress"><div style="width:${total?got/total*100:0}%"></div></div><div class="actions"><button class="btn ghost" onclick="document.getElementById('stampGrid').classList.toggle('open')">スタンプ帳を見る</button></div><div class="stampGrid" id="stampGrid">${shops.filter(s=>s.stamp_rally_enabled).map(s=>`<div class="stamp ${stampIds.has(s.id)?'got':''}">${stampIds.has(s.id)?'✓ ':''}${esc(s.name)}</div>`).join('')}</div>`}
function completeHtml(){const mail=settings.contact_email?'mailto:'+encodeURIComponent(settings.contact_email)+'?subject='+encodeURIComponent('もがマップ 36店舗クリア報告')+'&body='+encodeURIComponent(`${participant.nickname}さんが全店舗を達成しました。\n達成番号：${progress.completion_code}`):'';return `<div class="complete"><div class="confetti">🎉✨🎊</div><h1>CONGRATULATIONS!</h1><h2>${esc(settings.completion_title||'全36店舗クリア！')}</h2><h3>${esc(participant.nickname)}さん<br>スタンプラリー完全制覇<br>ありがとうございます！</h3><p>${esc(settings.completion_message||'たくさんのお店を巡っていただき、本当にありがとうございました。')}</p><div class="code">達成番号<br>${esc(progress.completion_code||'発行中')}</div><div class="reward"><h2>🎁 ${esc(settings.reward_title||'コンプリート特典')}</h2>${safe(settings.reward_image_url)?`<img src="${esc(settings.reward_image_url)}" alt="特典画像">`:''}<p>${esc(settings.reward_description||'この画面を主催者・スタッフへお見せください。')}</p>${settings.show_email_button&&mail?`<a class="btn" href="${mail}">📩 主催者へメールする</a>`:''}<p class="muted">${esc(settings.reward_instructions||'特典の受け取り方法・期限・条件は主催者の案内をご確認ください。')}</p>${settings.valid_until?`<p>有効期限：${esc(settings.valid_until)}</p>`:''}</div></div>`}
async function claimStamp(shopId){if(!participant){switchView('stampView');return alert('先にスタンプラリーへ参加してください')}const pin=prompt('店舗スタッフが店舗PINを入力してください');if(pin===null)return;try{const d=await api('rpc/claim_participant_stamp',{method:'POST',body:JSON.stringify({p_participant_id:participant.id,p_participant_token:participant.token,p_shop_id:shopId,p_shop_pin:pin})});if(!d[0]?.success)return alert('店舗PINが違います');alert('🎉 スタンプを獲得しました！');closeModal('detailModal');await refreshProgress();switchView('stampView')}catch(e){alert('スタンプを取得できませんでした')}}
async function shopAdmin(id){const s=shops.find(x=>x.id===id),pin=prompt('店舗PINを入力してください');if(pin===null)return;const val=(label,v)=>prompt(label,v||'');const body={p_name:s.name,p_pin:pin,p_stamp_rally_enabled:confirm('スタンプラリー対象店にしますか？'),p_community_url:val('コミュニティURL',s.community_url),p_point_purchase_url:val('ポイントURL',s.point_purchase_url),p_spot_job_enabled:confirm('スポットバイトを募集中にしますか？'),p_spot_job_title:val('募集タイトル',s.spot_job_title),p_spot_job_description:val('仕事内容',s.spot_job_description),p_spot_job_hourly_wage:Number(val('時給（数字）',s.spot_job_hourly_wage)||0)||null,p_spot_job_schedule:val('勤務時間',s.spot_job_schedule),p_spot_job_payment_method:val('支払方法',s.spot_job_payment_method),p_spot_job_contact:val('連絡先',s.spot_job_contact),p_website_url:val('ホームページURL',s.website_url),p_instagram_url:val('Instagram URL',s.instagram_url),p_facebook_url:val('Facebook URL',s.facebook_url),p_x_url:val('X URL',s.x_url),p_line_url:val('LINE URL',s.line_url)};if(Object.values(body).some(v=>typeof v==='string'&&v.includes('://')&&!safe(v)))return alert('URL形式を確認してください');try{await api('rpc/update_shop_by_pin',{method:'POST',body:JSON.stringify(body)});alert('保存しました');location.reload()}catch(e){alert('保存できませんでした。PINを確認してください')}}
async function openOrganizer(){const pin=prompt('主催者PINを入力してください');if(pin===null)return;const v=(l,x)=>prompt(l,x||'');const body={p_pin:pin,p_rally_title:v('ラリー名',settings.rally_title),p_participant_name_label:v('参加者名ラベル',settings.participant_name_label),p_participant_name_help:v('参加者名の説明',settings.participant_name_help),p_completion_title:v('クリア時タイトル',settings.completion_title),p_completion_message:v('お礼メッセージ',settings.completion_message),p_reward_title:v('特典タイトル',settings.reward_title),p_reward_description:v('特典内容・受取方法',settings.reward_description),p_reward_instructions:v('注意事項',settings.reward_instructions),p_reward_image_url:v('特典画像URL',settings.reward_image_url),p_contact_email:v('主催者メール',settings.contact_email),p_show_email_button:confirm('メール報告ボタンを表示しますか？'),p_show_present_screen:confirm('画面提示案内を表示しますか？'),p_valid_until:v('有効期限 YYYY-MM-DD',settings.valid_until)||null};try{await api('rpc/update_rally_settings_by_pin',{method:'POST',body:JSON.stringify(body)});alert('主催者設定を保存しました');location.reload()}catch(e){alert('保存できませんでした。主催者PINを確認してください')}}
async function checkReward(){const code=prompt('達成番号を入力してください');if(!code)return;const pin=prompt('主催者PINを入力してください');if(!pin)return;try{const ok=await api('rpc/mark_reward_claimed_by_pin',{method:'POST',body:JSON.stringify({p_pin:pin,p_completion_code:code})});alert(ok?'特典受取済みにしました':'達成番号が見つかりません')}catch(e){alert('確認できませんでした')}}
function switchView(id){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.view===id));if(id==='mapView')setTimeout(()=>map.invalidateSize(),80);if(id==='stampView'&&participant)refreshProgress();window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchView(b.dataset.view));document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('on',x===b));renderShops()});document.getElementById('search').oninput=renderShops;document.getElementById('searchBtn').onclick=renderShops;document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)closeModal(m.id)});init();
</script></body></html>
