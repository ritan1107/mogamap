function closeModal(id){$(id).classList.remove('on')}function jobHtml(s){return `<article class="shop job"><h3>${esc(s.spot_job_title||'スタッフ募集')}</h3><p>${esc(s.spot_job_description||'')}</p><div class="muted">💰 ${s.spot_job_hourly_wage?esc(s.spot_job_hourly_wage)+'円':'応相談'}<br>🗓 ${esc(s.spot_job_schedule||'')}<br>応募：${esc(s.spot_job_contact||'店舗へお問い合わせください')}</div></article>`}function renderJobs(){const j=shops.filter(s=>s.spot_job_enabled);$('jobList').innerHTML=j.length?j.map(jobHtml).join(''):'<div class="empty">現在募集はありません。</div>'}
function field(n,l,v='',type='text',full=''){return `<label class="field ${full}"><span>${l}</span><input name="${n}" type="${type}" value="${esc(v)}"></label>`}function openShopEditor(id){const s=shops.find(x=>x.id===id);if(!s)return;closeModal('detailModal');$('shopForm').innerHTML=`<input type="hidden" name="p_shop_id" value="${s.id}"><div class="formGrid">${field('p_pin','店舗PIN','','password')}${field('p_name','店舗名',s.name)}${field('p_address','住所',s.address,'text','full')}${field('p_main_category','メインカテゴリ',s.main_category)}${field('p_subcategory','サブカテゴリ',s.subcategory)}<label class="field full"><span>紹介文</span><textarea name="p_description">${esc(s.description||'')}</textarea></label>${field('p_phone','電話番号',s.phone)}${field('p_website_url','ホームページURL',s.website_url,'url')}${field('p_instagram_url','Instagram URL',s.instagram_url,'url')}${field('p_facebook_url','Facebook URL',s.facebook_url,'url')}${field('p_x_url','X URL',s.x_url,'url')}${field('p_line_url','LINE URL',s.line_url,'url')}${field('p_community_url','コミュニティURL',s.community_url,'url')}${field('p_point_purchase_url','ポイント購入URL',s.point_purchase_url,'url')}<label class="field full check"><input name="p_stamp_rally_enabled" type="checkbox" ${s.stamp_rally_enabled?'checked':''}>スタンプラリー対象</label><label class="field full check"><input name="p_spot_job_enabled" type="checkbox" ${s.spot_job_enabled?'checked':''}>スポットバイト募集中</label>${field('p_spot_job_title','募集タイトル',s.spot_job_title)}${field('p_spot_job_hourly_wage','時給',s.spot_job_hourly_wage,'number')}${field('p_spot_job_schedule','勤務時間',s.spot_job_schedule)}${field('p_spot_job_payment_method','支払方法',s.spot_job_payment_method)}${field('p_spot_job_contact','連絡先',s.spot_job_contact,'text','full')}<label class="field full"><span>仕事内容</span><textarea name="p_spot_job_description">${esc(s.spot_job_description||'')}</textarea></label></div><p id="formError" class="error"></p><div class="actions"><button class="btn" type="submit">保存する</button><button class="btn ghost" type="button" onclick="closeModal('editModal')">キャンセル</button></div>`;$('shopForm').onsubmit=saveShop;$('editModal').classList.add('on')}
async function saveShop(e){e.preventDefault();if(fallback)return $('formError').textContent='オフライン表示中は保存できません。通信後に再度お試しください。';const f=new FormData(e.currentTarget),body=Object.fromEntries(f.entries());body.p_stamp_rally_enabled=f.has('p_stamp_rally_enabled');body.p_spot_job_enabled=f.has('p_spot_job_enabled');body.p_spot_job_hourly_wage=body.p_spot_job_hourly_wage?Number(body.p_spot_job_hourly_wage):null;for(const k of Object.keys(body))if(k.endsWith('_url')&&body[k]&&!safe(body[k]))return $('formError').textContent='URLは https:// から入力してください。';const btn=e.submitter;btn.disabled=true;btn.textContent='保存中…';try{const d=await api('rpc/update_shop_details_by_pin',{method:'POST',body:JSON.stringify(body)});const updated=Array.isArray(d)?d[0]:d;if(updated){const i=shops.findIndex(x=>x.id===updated.id);shops[i]=updated}closeModal('editModal');initFilters();renderAll();openDetail(body.p_shop_id);alert('店舗情報を保存しました。')}catch(err){$('formError').textContent='保存できませんでした。PINまたは入力内容を確認してください。';btn.disabled=false;btn.textContent='保存する'}}
async function startRally(){const n=$('nickname').value.trim();if(!n)return alert('ニックネームを入力してください');try{const d=await api('rpc/start_rally',{method:'POST',body:JSON.stringify({p_nickname:n})}),x=d[0];saveParticipant({id:x.participant_id,token:x.participant_token,nickname:x.nickname});refreshProgress()}catch{alert('参加登録できませんでした')}}async function refreshProgress(){if(!participant)return renderRally();try{const [p,ids]=await Promise.all([api('rpc/get_rally_progress',{method:'POST',body:JSON.stringify({p_participant_id:participant.id,p_participant_token:participant.token})}),api('rpc/get_participant_stamp_ids',{method:'POST',body:JSON.stringify({p_participant_id:participant.id,p_participant_token:participant.token})})]);progress=p[0];stampIds=new Set(ids.map(x=>x.shop_id));renderRally()}catch{renderRally()}}
function renderRally(){const a=$('rallyArea');if(!participant){a.innerHTML=`<h2>🎫 ${esc(settings.rally_title||'北海道スタンプラリー')}</h2><p>参加する名前を入力してください</p><input id="nickname" style="width:100%;padding:13px;border:1px solid var(--line);border-radius:12px" placeholder="ニックネーム"><div class="actions"><button class="btn" onclick="startRally()">参加する</button></div>`;return}const got=progress?.stamp_count||stampIds.size,total=progress?.total_shops||36;a.innerHTML=`<h2>🎫 ${esc(participant.nickname)}さん</h2><h3>${got} / ${total}店舗</h3><div class="progress"><div style="width:${total?got/total*100:0}%"></div></div>${progress?.completed?`<div class="notice"><h2>🎉 全36店舗クリア！</h2><strong>達成番号：${esc(progress.completion_code||'発行中')}</strong><p>${esc(settings.reward_description||'この画面を主催者へお見せください。')}</p></div>`:`<p>あと${Math.max(total-got,0)}店舗！</p>`}<div class="stampGrid">${shops.filter(s=>s.stamp_rally_enabled).map(s=>`<div class="stamp ${stampIds.has(s.id)?'got':''}">${stampIds.has(s.id)?'✓ ':''}${esc(s.name)}</div>`).join('')}</div>`}

async function openOrganizer(){const pin=prompt('主催者PINを入力してください');if(pin===null)return;alert('主催者設定は従来どおり有効です。詳細設定は管理者へお問い合わせください。')}async function checkReward(){const code=prompt('達成番号を入力してください');if(!code)return;const pin=prompt('主催者PINを入力してください');if(!pin)return;try{const ok=await api('rpc/mark_reward_claimed_by_pin',{method:'POST',body:JSON.stringify({p_pin:pin,p_completion_code:code})});alert(ok?'特典受取済みにしました':'達成番号が見つかりません')}catch{alert('確認できませんでした')}}

jobHtml=function(s,clickable=false){return `<article class="shop job jobCard" ${clickable?`role="button" tabindex="0" onclick="openDetail('${s.id}')" onkeydown="if(event.key==='Enter')openDetail('${s.id}')"`:''}><div class="cat">💼 スポットバイト</div><h3>${esc(s.spot_job_title||'スタッフ募集')}</h3><p>${esc(s.spot_job_description||'')}</p><div class="muted">💰 ${s.spot_job_hourly_wage?esc(s.spot_job_hourly_wage)+'円':'応相談'}<br>🗓 ${esc(s.spot_job_schedule||'')}<br>支払：${esc(s.spot_job_payment_method||'店舗へご確認ください')}<br>連絡先：${esc(s.spot_job_contact||'店舗へお問い合わせください')}</div>${clickable?'<p class="tapHint">タップして店舗情報を見る →</p>':''}</article>`}
renderJobs=function(){const jobs=shops.filter(s=>s.spot_job_enabled),volunteers=shops.filter(s=>s.volunteer_enabled);$('jobList').innerHTML=`<h2 class="sectionTitle">💼 スポットバイト</h2>${jobs.length?jobs.map(s=>jobHtml(s,true)).join(''):'<div class="empty sectionTitle">現在、スポットバイト募集はありません。</div>'}<h2 class="sectionTitle">🤝 ボランティアスタッフ</h2>${volunteers.length?volunteers.map(s=>volunteerHtml(s,true)).join(''):'<div class="empty sectionTitle">現在、ボランティア募集はありません。</div>'}`}
openDetail=function(id){const s=shops.find(x=>x.id===id);if(!s)return;$('detail').innerHTML=`<div class="cat">${esc(s.main_category)} › ${esc(s.subcategory||'その他')}</div><h2>${esc(s.name)}</h2><p>📍 ${esc(s.address)}</p>${s.phone?`<p>☎ ${esc(s.phone)}</p>`:''}<p>${esc(s.description||'')}</p><div class="actions"><button class="btn green" onclick="navigateShop('${s.id}')">ここまでナビ</button>${link(s.website_url,'ホームページ')}${link(s.instagram_url,'Instagram')}${link(s.facebook_url,'Facebook')}${link(s.x_url,'X')}${link(s.line_url,'LINE')}</div><hr><h3>🎫 スタンプラリー</h3><p>${s.stamp_rally_enabled?'対象店舗です':'現在は対象外です'}</p>${s.stamp_rally_enabled?`<button class="btn" onclick="claimStamp('${s.id}')">スタンプを押す</button>`:''}<hr><h3>💼 スポットバイト</h3>${s.spot_job_enabled?jobHtml(s):'<p class="muted">現在募集はありません。</p>'}<hr><h3>🤝 ボランティアスタッフ</h3>${s.volunteer_enabled?volunteerHtml(s):'<p class="muted">現在募集はありません。</p>'}<hr><button class="btn ghost small" onclick="openShopEditor('${s.id}')">店舗情報を編集</button>`;$('detailModal').classList.add('on')}
</script>
<style>.sectionTitle{grid-column:1/-1;margin:12px 2px 2px}.jobCard,.volunteerCard{cursor:pointer}.volunteerCard{border-left:5px solid #6b54a3}.jobCard:active,.volunteerCard:active{transform:scale(.99)}.tapHint{color:var(--o);font-size:12px;font-weight:900;margin:10px 0 0}</style>
<style>#jobView>.heading{display:none}</style>
<div class="modal" id="participantAdminModal"><div class="sheet"><button class="x" type="button" onclick="closeParticipantAdmin()">×</button><h2>スタンプラリー参加者管理</h2><div class="participantSummary" id="participantSummary"></div><label class="countToggle"><input id="publicCountToggle" type="checkbox" onchange="changeParticipantCountVisibility(this)"> 参加者人数を一般公開する</label><div class="actions"><button class="btn ghost" type="button" onclick="loadParticipantAdmin(false)">参加者一覧</button><button class="btn" type="button" onclick="loadParticipantAdmin(true)">全店制覇者</button></div><div id="participantAdminList"></div></div></div>
<style>
.rallyInput{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;margin:5px 0 11px;font-size:16px}.participantCount{display:inline-block;background:#eefbf5;border:1px solid #b8dfd1;border-radius:999px;padding:7px 12px;font-weight:900}.countToggle{display:block;background:#fff7e9;border:1px solid #f0d5a9;border-radius:12px;padding:12px;margin:12px 0;font-weight:800}.participantSummary{font-weight:900;margin:8px 0}.participantRow{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:#fff}.participantRow.done{border-color:#f59b23;background:#fff8ed}.participantRow h3{margin:0 0 6px}.participantMeta{font-size:13px;color:var(--muted);line-height:1.7}.participantEmpty{text-align:center;padding:24px;color:var(--muted)}
</style>
<script>
let publicParticipantInfo={is_public:false,participant_count:null},participantAdminPin='';
function publicParticipantCountHtml(){return publicParticipantInfo.is_public?`<p><span class="participantCount">現在の参加者：${Number(publicParticipantInfo.participant_count||0)}人</span></p>`:''}
async function loadPublicParticipantCount(){try{const d=await api('rpc/get_public_participant_count',{method:'POST',body:'{}'}),x=Array.isArray(d)?d[0]:d;publicParticipantInfo=x||publicParticipantInfo;renderRally()}catch{}}
startRally=async function(){const n=$('nickname')?.value.trim(),entry=$('participantEntryId')?.value.trim()||null;if(!n)return alert('ニックネームを入力してください');try{const d=await api('rpc/start_rally',{method:'POST',body:JSON.stringify({p_nickname:n,p_entry_id:entry})}),x=d[0];saveParticipant({id:x.participant_id,token:x.participant_token,nickname:x.nickname,entryId:x.participant_entry_id||null});publicParticipantInfo.participant_count=Number(publicParticipantInfo.participant_count||0)+1;refreshProgress()}catch(err){alert(String(err.message||'').includes('80文字')?'参加者IDは80文字以内にしてください':'参加登録できませんでした')}}
renderRally=function(){const a=$('rallyArea'),rallyShops=shops.filter(s=>s.stamp_rally_enabled).sort((x,y)=>(x.rally_number||999)-(y.rally_number||999));if(!participant){a.innerHTML=`<h2>🎫 ${esc(settings.rally_title||'スタンプラリー')}</h2><p>参加店舗：${rallyShops.length}店</p>${publicParticipantCountHtml()}<label for="participantEntryId"><b>参加者ID（任意）</b></label><input id="participantEntryId" class="rallyInput" maxlength="80" autocomplete="off" placeholder="会員番号など（なくても参加できます）"><label for="nickname"><b>ニックネーム（必須）</b></label><input id="nickname" class="rallyInput" maxlength="40" autocomplete="nickname" placeholder="ニックネーム"><div class="actions"><button class="btn" onclick="startRally()">参加する</button></div><p class="muted">IDとニックネームは管理者だけが確認できます。</p>`;return}const got=progress?.stamp_count||stampIds.size,total=progress?.total_shops||rallyShops.length;a.innerHTML=`<h2>🎫 ${esc(participant.nickname)}さん</h2>${publicParticipantCountHtml()}<h3>${got} / ${total}店舗</h3><div class="progress"><div style="width:${total?got/total*100:0}%"></div></div>${progress?.completed?`<div class="notice"><h2>🎉 全参加店舗クリア！</h2><strong>達成番号：${esc(progress.completion_code||'発行中')}</strong><p>${esc(settings.reward_description||'この画面を主催者へお見せください。')}</p></div>`:`<p>あと${Math.max(total-got,0)}店舗！</p>`}<p class="rallyGuide">店舗の丸をタップして詳細を開き、会計時にお店の方へ「スタンプを押す」をお願いしてください。</p><div class="stampGrid">${rallyShops.map(s=>`<button type="button" class="stamp stampTap ${stampIds.has(s.id)?'got':''}" onclick="openRallyShop('${s.id}')"><b>#${String(s.rally_number||'--').padStart(4,'0')}</b><br>${stampIds.has(s.id)?'✓ ':''}${esc(s.name)}</button>`).join('')}</div>`}
document.querySelector('#moreView .actions').insertAdjacentHTML('afterbegin','<button class="btn" onclick="openParticipantAdmin()">参加者・制覇者管理</button>');
async function openParticipantAdmin(){const pin=prompt('管理者PINを入力してください');if(pin===null)return;try{const ok=await api('rpc/verify_organizer_pin',{method:'POST',body:JSON.stringify({p_pin:pin})});if(!ok)return alert('管理者PINが違います');participantAdminPin=pin;$('publicCountToggle').checked=!!publicParticipantInfo.is_public;$('participantAdminModal').classList.add('on');await loadParticipantAdmin(false)}catch{alert('管理者PINを確認できませんでした')}}
function closeParticipantAdmin(){participantAdminPin='';closeModal('participantAdminModal')}
async function loadParticipantAdmin(completedOnly){if(!participantAdminPin)return;const list=$('participantAdminList');list.innerHTML='<p class="participantEmpty">読み込み中…</p>';try{const rows=await api('rpc/get_rally_participants_by_pin',{method:'POST',body:JSON.stringify({p_pin:participantAdminPin,p_completed_only:completedOnly})});const completed=rows.filter(x=>x.completed).length;$('participantSummary').textContent=completedOnly?`全店制覇者：${rows.length}人`:`参加者：${rows.length}人（全店制覇 ${completed}人）`;list.innerHTML=rows.length?rows.map(x=>`<article class="participantRow ${x.completed?'done':''}"><h3>${esc(x.nickname)} ${x.completed?'🏆':''}</h3><div><b>参加者ID：</b>${esc(x.participant_entry_id||'未入力')}</div><div class="participantMeta">スタンプ ${Number(x.stamp_count||0)} / ${Number(x.total_shops||0)}店<br>参加日時：${esc(new Date(x.started_at).toLocaleString('ja-JP'))}${x.completed_at?`<br>制覇日時：${esc(new Date(x.completed_at).toLocaleString('ja-JP'))}`:''}</div></article>`).join(''):'<p class="participantEmpty">該当する参加者はいません。</p>'}catch{list.innerHTML='<p class="error">参加者情報を取得できませんでした。</p>'}}
async function changeParticipantCountVisibility(box){box.disabled=true;try{await api('rpc/set_participant_count_visibility_by_pin',{method:'POST',body:JSON.stringify({p_pin:participantAdminPin,p_show:box.checked})});publicParticipantInfo.is_public=box.checked;if(box.checked){const d=await api('rpc/get_public_participant_count',{method:'POST',body:'{}'}),x=Array.isArray(d)?d[0]:d;publicParticipantInfo=x||publicParticipantInfo}renderRally();alert(box.checked?'参加者人数を公開しました':'参加者人数を非公開にしました')}catch{box.checked=!box.checked;alert('公開設定を変更できませんでした')}finally{box.disabled=false}}
loadPublicParticipantCount();
</script>
</body></html>
