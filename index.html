<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>もがマップ｜北海道のお店</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
:root{
  --orange:#f58a24;
  --green:#198754;
  --bg:#fffaf2;
  --card:#ffffff;
  --text:#292722;
  --sub:#777168;
  --line:#eadfce;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

body{
  padding-bottom:90px;
}

/* ===== ヘッダー ===== */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,250,242,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);
}

.header-inner{
  max-width:1100px;
  margin:auto;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  font-size:21px;
  font-weight:900;
  color:var(--orange);
  white-space:nowrap;
}

.search{
  flex:1;
  display:flex;
  background:#fff;
  border:1px solid var(--line);
  border-radius:999px;
  overflow:hidden;
}

.search input{
  width:100%;
  border:0;
  outline:0;
  padding:13px 16px;
  font-size:16px;
  background:transparent;
}

.search button{
  border:0;
  background:transparent;
  padding:0 16px;
  font-size:20px;
}

/* ===== メイン ===== */

main{
  max-width:1100px;
  margin:auto;
  padding:22px 15px 40px;
}

.hero{
  margin-bottom:20px;
}

.hero h1{
  margin:0 0 6px;
  font-size:27px;
  line-height:1.35;
}

.hero p{
  margin:0;
  color:var(--sub);
  font-weight:600;
  line-height:1.6;
}

.status{
  display:inline-block;
  margin-top:10px;
  padding:7px 12px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:999px;
  font-size:13px;
  font-weight:800;
}

/* ===== MAP ===== */

.map-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 5px 18px rgba(0,0,0,.04);
}

.map-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 16px;
}

.map-title{
  font-size:20px;
  font-weight:900;
}

.map-sub{
  font-size:13px;
  color:var(--sub);
  margin-top:3px;
}

.map-btn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:13px;
  padding:9px 12px;
  font-weight:800;
  cursor:pointer;
}

#map{
  width:100%;
  height:460px;
  background:#eee;
}

.map-note{
  padding:12px 15px;
  color:var(--sub);
  font-size:13px;
  line-height:1.6;
  font-weight:600;
}

/* ===== 店舗 ===== */

.shop-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:28px 2px 14px;
}

.shop-heading h2{
  margin:0;
  font-size:24px;
}

.shop-count{
  color:var(--green);
  font-weight:900;
}

#shopList{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.shop{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  box-shadow:0 4px 14px rgba(0,0,0,.035);
}

.shop-category{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  background:#fff3e5;
  color:#d96f08;
  font-size:12px;
  font-weight:900;
  margin-bottom:8px;
}

.shop h3{
  margin:0 0 7px;
  font-size:19px;
}

.address{
  color:var(--sub);
  font-size:14px;
  line-height:1.5;
}

.memo{
  margin-top:9px;
  font-size:14px;
  line-height:1.6;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.actions a{
  flex:1;
  text-align:center;
  text-decoration:none;
  border-radius:11px;
  padding:10px 7px;
  font-size:13px;
  font-weight:900;
}

.detail{
  color:#fff;
  background:var(--orange);
}

.navi{
  color:#fff;
  background:var(--green);
}

/* ===== 空データ ===== */

.empty{
  grid-column:1/-1;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:28px 18px;
  text-align:center;
  color:var(--sub);
  line-height:1.8;
}

/* ===== 下メニュー ===== */

.bottom-nav{
  position:fixed;
  z-index:1100;
  bottom:0;
  left:0;
  right:0;
  background:rgba(255,255,255,.96);
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom);
}

.bottom-nav button{
  border:0;
  background:transparent;
  padding:10px 2px 8px;
  font-weight:800;
  color:#6d685f;
  font-size:12px;
}

.bottom-nav span{
  display:block;
  font-size:21px;
  margin-bottom:2px;
}

.bottom-nav .active{
  color:var(--orange);
}

/* ===== スマホ ===== */

@media(max-width:700px){

  .header-inner{
    padding:11px 12px;
  }

  .logo{
    font-size:17px;
  }

  .search input{
    font-size:14px;
    padding:11px 12px;
  }

  main{
    padding:18px 12px 30px;
  }

  .hero h1{
    font-size:23px;
  }

  #map{
    height:420px;
  }

  #shopList{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      📍 もがマップ
    </div>

    <div class="search">
      <input
        id="searchInput"
        type="search"
        placeholder="店名・地域・キーワードで検索"
      >
      <button onclick="searchStores()">🔎</button>
    </div>

  </div>
</header>


<main>

  <section class="hero">

    <h1>
      北海道のお店を、すぐ見つける。
    </h1>

    <p>
      地図で集まりを確認 → 気になるお店をチェック。
    </p>

    <div class="status" id="status">
      店舗データ読込中…
    </div>

  </section>


  <section class="map-card">

    <div class="map-head">

      <div>
        <div class="map-title">
          🗺️ お店マップ
        </div>

        <div class="map-sub">
          マーカーを押すと店舗情報が表示されます
        </div>
      </div>

      <button
        class="map-btn"
        onclick="showAllStores()"
      >
        全体表示
      </button>

    </div>

    <div id="map"></div>

    <div class="map-note">
      🟠 店舗位置は登録住所をもとに表示しています。
      正確な経路は「ナビ」をご利用ください。
    </div>

  </section>


  <div class="shop-heading">

    <h2>
      お店
    </h2>

    <div
      class="shop-count"
      id="shopCount"
    >
      0店舗
    </div>

  </div>

  <section id="shopList">

    <div class="empty">
      店舗情報を読み込んでいます…
    </div>

  </section>

</main>


<nav class="bottom-nav">

  <button class="active">
    <span>🗺️</span>
    地図・お店
  </button>

  <button>
    <span>🎟️</span>
    スタンプ
  </button>

  <button>
    <span>💼</span>
    バイト
  </button>

  <button>
    <span>☰</span>
    その他
  </button>

</nav>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================
   MAP
===================================== */

const map = L.map("map").setView(
  [43.30,142.70],
  6
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"© OpenStreetMap"
  }
).addTo(map);


/* =====================================
   VARIABLES
===================================== */

let stores = [];
let markers = [];
let markerGroup = L.featureGroup().addTo(map);


/* =====================================
   データの項目名の違いにも対応
===================================== */

function value(obj,names){

  for(const name of names){

    if(
      obj[name] !== undefined &&
      obj[name] !== null &&
      obj[name] !== ""
    ){
      return obj[name];
    }

  }

  return "";
}


function getName(store){

  return value(
    store,
    [
      "name",
      "store",
      "storeName",
      "shop",
      "shopName",
      "店名",
      "店舗名"
    ]
  );

}


function getAddress(store){

  return value(
    store,
    [
      "address",
      "addr",
      "住所",
      "所在地"
    ]
  );

}


function getCategory(store){

  return value(
    store,
    [
      "category",
      "type",
      "genre",
      "カテゴリ",
      "カテゴリー",
      "ジャンル"
    ]
  );

}


function getMemo(store){

  return value(
    store,
    [
      "memo",
      "description",
      "note",
      "comment",
      "紹介",
      "説明",
      "メモ"
    ]
  );

}


function getLat(store){

  return Number(
    value(
      store,
      [
        "lat",
        "latitude",
        "緯度"
      ]
    )
  );

}


function getLng(store){

  return Number(
    value(
      store,
      [
        "lng",
        "lon",
        "longitude",
        "経度"
      ]
    )
  );

}


/* =====================================
   stores.json 読込
===================================== */

async function loadStores(){

  const status =
    document.getElementById("status");

  try{

    /*
      GitHub Pagesでは
      index.html と同じ場所にある
      stores.json を読み込みます
    */

    const response =
      await fetch(
        "./stores.json?v=" + Date.now()
      );

    if(!response.ok){

      throw new Error(
        "stores.jsonを読み込めません"
      );

    }

    const json =
      await response.json();


    /*
      JSONが

      [ ... ]

      の場合と

      {
        "stores":[ ... ]
      }

      の両方に対応
    */

    if(Array.isArray(json)){

      stores = json;

    }else if(
      json &&
      Array.isArray(json.stores)
    ){

      stores = json.stores;

    }else if(
      json &&
      Array.isArray(json.data)
    ){

      stores = json.data;

    }else{

      stores = [];

    }


    status.textContent =
      "✅ " +
      stores.length +
      "店舗 読込完了";


    renderStores(stores);


  }catch(error){

    console.error(error);

    status.textContent =
      "⚠️ 店舗データを読み込めません";

    document.getElementById(
      "shopList"
    ).innerHTML = `

      <div class="empty">

        <strong>
          stores.json の読み込みに失敗しました。
        </strong>

        <br><br>

        GitHub Pagesからページを開いているか、
        stores.json が index.html と同じ場所に
        あるか確認してください。

      </div>

    `;

  }

}


/* =====================================
   店舗表示
===================================== */

function renderStores(list){

  const container =
    document.getElementById("shopList");

  const count =
    document.getElementById("shopCount");


  container.innerHTML = "";

  count.textContent =
    list.length + "店舗";


  markerGroup.clearLayers();

  markers = [];


  if(list.length === 0){

    container.innerHTML = `

      <div class="empty">
        該当するお店がありません。
      </div>

    `;

    return;

  }


  list.forEach((store,index)=>{

    const name =
      getName(store) ||
      "名称未登録";

    const address =
      getAddress(store);

    const category =
      getCategory(store);

    const memo =
      getMemo(store);

    const lat =
      getLat(store);

    const lng =
      getLng(store);


    /* ===== 店舗カード ===== */

    const card =
      document.createElement("article");

    card.className = "shop";


    const query =
      encodeURIComponent(
        address || name
      );


    card.innerHTML = `

      ${
        category
        ?
        `<div class="shop-category">
          ${escapeHTML(category)}
        </div>`
        :
        ""
      }

      <h3>
        ${escapeHTML(name)}
      </h3>

      ${
        address
        ?
        `<div class="address">
          📍 ${escapeHTML(address)}
        </div>`
        :
        ""
      }

      ${
        memo
        ?
        `<div class="memo">
          ${escapeHTML(memo)}
        </div>`
        :
        ""
      }

      <div class="actions">

        ${
          Number.isFinite(lat) &&
          Number.isFinite(lng) &&
          lat !== 0 &&
          lng !== 0
          ?

          `<a
            href="#map"
            class="detail"
            onclick="focusStore(${lat},${lng});return false;"
          >
            地図で見る
          </a>`

          :

          `<a
            href="#map"
            class="detail"
          >
            お店を見る
          </a>`
        }

        <a
          class="navi"
          target="_blank"
          rel="noopener"
          href="https://www.google.com/maps/search/?api=1&query=${query}"
        >
          ナビ
        </a>

      </div>

    `;


    container.appendChild(card);


    /* ===== 地図マーカー ===== */

    if(
      Number.isFinite(lat) &&
      Number.isFinite(lng) &&
      lat !== 0 &&
      lng !== 0
    ){

      const marker =
        L.marker(
          [lat,lng]
        );


      marker.bindPopup(`

        <div style="
          min-width:180px;
          font-family:
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        ">

          <strong
            style="font-size:16px"
          >
            ${escapeHTML(name)}
          </strong>

          ${
            address
            ?
            `<div
              style="
                margin-top:6px;
                font-size:13px;
              "
            >
              ${escapeHTML(address)}
            </div>`
            :
            ""
          }

          <a
            target="_blank"
            rel="noopener"
            href="https://www.google.com/maps/search/?api=1&query=${query}"
            style="
              display:block;
              margin-top:9px;
              color:#198754;
              font-weight:bold;
            "
          >
            Googleマップで開く
          </a>

        </div>

      `);


      marker.addTo(markerGroup);

      markers.push(marker);

    }

  });


  /* ===== 全店舗が入るよう地図調整 ===== */

  if(markers.length > 0){

    const bounds =
      markerGroup.getBounds();

    if(bounds.isValid()){

      map.fitBounds(
        bounds,
        {
          padding:[35,35],
          maxZoom:13
        }
      );

    }

  }

}


/* =====================================
   検索
===================================== */

function searchStores(){

  const keyword =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  if(!keyword){

    renderStores(stores);

    return;

  }


  const result =
    stores.filter(store=>{

      const text = [

        getName(store),
        getAddress(store),
        getCategory(store),
        getMemo(store)

      ]
      .join(" ")
      .toLowerCase();


      return text.includes(keyword);

    });


  renderStores(result);

}


/* Enterでも検索 */

document
.getElementById("searchInput")
.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      searchStores();

    }

  }
);


/* 入力を消したら全部戻す */

document
.getElementById("searchInput")
.addEventListener(
  "input",
  function(){

    if(this.value.trim() === ""){

      renderStores(stores);

    }

  }
);


/* =====================================
   MAP操作
===================================== */

function focusStore(lat,lng){

  map.setView(
    [lat,lng],
    16
  );

  window.scrollTo({
    top:
      document
      .getElementById("map")
      .offsetTop - 120,

    behavior:"smooth"
  });

}


function showAllStores(){

  if(markers.length === 0){

    map.setView(
      [43.30,142.70],
      6
    );

    return;

  }


  const bounds =
    markerGroup.getBounds();


  if(bounds.isValid()){

    map.fitBounds(
      bounds,
      {
        padding:[35,35],
        maxZoom:13
      }
    );

  }

}


/* =====================================
   HTML安全処理
===================================== */

function escapeHTML(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================
   START
===================================== */

loadStores();


/*
  Safariなどで地図サイズが
  正しく計算されない場合の対策
*/

window.addEventListener(
  "load",
  function(){

    setTimeout(
      ()=>map.invalidateSize(),
      300
    );

  }
);

</script>

</body>
</html>
