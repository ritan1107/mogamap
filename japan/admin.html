<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全国モグマップ 管理</title><style>:root{--bg:#f6f5f2;--card:#fff;--ink:#222;--muted:#6f6b64;--line:#ddd8cf;--o:#f28b25;--red:#c83b3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:var(--ink)}main{max-width:980px;margin:auto;padding:18px 14px 60px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top a{color:var(--o);font-weight:800;text-decoration:none}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:800}input,textarea,select,button{font:inherit}input,textarea,select{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}textarea{min-height:150px}.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--o);color:#fff;font-weight:900}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.red{background:var(--red)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{color:var(--muted);font-size:12px}.hidden{display:none}.preview{overflow:auto}.preview table{border-collapse:collapse;width:100%;font-size:12px}.preview th,.preview td{border-bottom:1px solid var(--line);padding:8px;text-align:left;white-space:nowrap}.ok{color:#17734d}.bad{color:#a82e2e}.shop{border-top:1px solid var(--line);padding:12px 0}.shop:first-child{border-top:0}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main><div class="top"><div><h1 style="margin:0;font-size:22px">🔐 全国モグマップ 管理センター</h1><div class="muted">全国／都道府県ごとの参加店を管理</div></div><a href="./">公開マップへ</a></div><section class="card" id="loginCard"><h2>管理者ログイン</h2><div class="grid"><label>メールアドレス<input id="email" type="email" autocomplete="username"></label><label>パスワード<input id="password" type="password" autocomplete="current-password"></label><label class="full">追加管理PIN<input id="pin" type="password" inputmode="numeric" autocomplete="one-time-code" placeholder="管理用PIN"></label></div><div class="row" style="margin-top:12px"><button class="btn" id="login">ログイン</button><span class="muted" id="loginMsg">認証＋管理PINの2段階で管理します。</span></div></section><div id="admin" class="hidden"><section class="card"><div class="row"><strong id="who">管理者</strong><button class="btn ghost" id="logout">ログアウト</button></div></section><section class="card"><h2>店舗をまとめて登録</h2><p class="muted">1行1店舗。タブ区切りまたは「｜」区切りで、店名｜住所｜都道府県｜市区町村｜大分類｜小分類｜電話｜URL の順に貼り付けできます。同じ店名＋住所は登録されません。</p><textarea id="bulk" placeholder="山田食堂｜埼玉県さいたま市...｜埼玉県｜さいたま市｜飲食店｜定食｜048-...｜https://..."></textarea><div class="row" style="margin-top:10px"><button class="btn ghost" id="previewBtn">内容を確認</button><button class="btn" id="saveBtn">一括登録</button><span id="bulkMsg" class="muted"></span></div><div class="preview" id="preview"></div></section><section class="card"><h2>参加店検索・監視</h2><div class="grid"><label>都道府県<select id="pref"><option value="">すべて</option></select></label><label>店名・住所・ID<input id="search" placeholder="検索"></label></div><div class="row" style="margin-top:10px"><button class="btn ghost" id="loadBtn">検索</button></div><div id="stores"></div></section></div></main><script>
let SB='',KEY='',TOKEN='',ADMIN_PIN='',ROWS=[];const PREFS=['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];PREFS.forEach(x=>document.querySelector('#pref').insertAdjacentHTML('beforeend',`<option>${x}</option>`));async function config(){const t=await fetch('../index.html').then(r=>r.text());SB=(t.match(/const SB='([^']+)'/)||[])[1]||'';KEY=(t.match(/KEY='([^']+)'/)||[])[1]||'';if(!SB||!KEY)throw Error('公開設定を取得できません')}
async function rpc(name,body){const r=await fetch(SB+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify(body)});const txt=await r.text();if(!r.ok)throw Error(txt);try{return JSON.parse(txt)}catch{return txt}}
async function login(){let msg=document.querySelector('#loginMsg');msg.textContent='確認中…';try{await config();const email=document.querySelector('#email').value.trim(),password=document.querySelector('#password').value;ADMIN_PIN=document.querySelector('#pin').value.trim();let r=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});let d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||'ログイン失敗');TOKEN=d.access_token;let ok=await rpc('jm_verify_admin_pin',{p_pin:ADMIN_PIN});if(!ok)throw Error('管理PINが違います');document.querySelector('#loginCard').classList.add('hidden');document.querySelector('#admin').classList.remove('hidden');document.querySelector('#who').textContent=email;msg.textContent='';}catch(e){TOKEN='';msg.textContent='ログインできません：'+e.message}}
function parse(){const lines=document.querySelector('#bulk').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);ROWS=lines.map((line,i)=>{let c=line.includes('\t')?line.split('\t'):line.split('｜');c=c.map(x=>x.trim());return{no:i+1,name:c[0]||'',address:c[1]||'',prefecture:c[2]||'',city:c[3]||'',major_category:c[4]||'サービス',subcategory:c[5]||'',phone:c[6]||'',website_url:c[7]||'',sns_url:'',description:'',lat:'',lng:'',sa_member:false,rally_participant:false,job_open:false,volunteer_open:false}});renderPreview();return ROWS}
function renderPreview(){let e=document.querySelector('#preview');if(!ROWS.length){e.innerHTML='';return}e.innerHTML='<table><thead><tr><th>#</th><th>店名</th><th>住所</th><th>都道府県</th><th>分類</th></tr></thead><tbody>'+ROWS.map(x=>`<tr><td>${x.no}</td><td>${esc(x.name)}</td><td>${esc(x.address)}</td><td>${esc(x.prefecture)}</td><td>${esc(x.major_category)} / ${esc(x.subcategory)}</td></tr>`).join('')+'</tbody></table>'}
async function save(){parse();let m=document.querySelector('#bulkMsg');if(!ROWS.length){m.textContent='登録データがありません';return}let ok=0,dup=0,bad=0;for(const x of ROWS){if(!x.name||!x.address||!x.prefecture){bad++;continue}try{await rpc('jm_admin_add_store',{p_pin:ADMIN_PIN,p_data:x});ok++}catch(e){if(String(e.message).includes('duplicate store'))dup++;else bad++}}m.innerHTML=`<span class="ok">${ok}件登録</span>・重複${dup}件スキップ・<span class="bad">要確認${bad}件</span>`}
async function loadStores(){let p=document.querySelector('#pref').value,s=document.querySelector('#search').value.trim();let u=SB+'/rest/v1/jm_stores?select=id,store_code,name,address,prefecture,status,sa_member,rally_participant,job_open,volunteer_open,created_at&order=created_at.desc&limit=100';if(p)u+='&prefecture=eq.'+encodeURIComponent(p);if(s)u+='&or=(name.ilike.*'+encodeURIComponent(s)+'*,address.ilike.*'+encodeURIComponent(s)+'*,store_code.ilike.*'+encodeURIComponent(s)+'*)';let r=await fetch(u,{headers:{apikey:KEY,Authorization:'Bearer '+TOKEN}});let d=await r.json();if(!r.ok){document.querySelector('#stores').textContent='検索できません';return}document.querySelector('#stores').innerHTML=d.length?d.map(x=>`<div class="shop"><strong>${esc(x.name)}</strong> <span class="muted">${esc(x.store_code)} / ${esc(x.prefecture)}</span><div class="muted">${esc(x.address)}｜状態：${esc(x.status)}</div><div class="row" style="margin-top:7px"><button class="btn ghost act" data-id="${x.id}" data-status="active">公開</button><button class="btn ghost act" data-id="${x.id}" data-status="suspended">非公開</button><button class="btn red act" data-id="${x.id}" data-status="deleted">削除扱い</button></div></div>`).join(''):'<p class="muted">該当店舗なし</p>'}
async function setStatus(id,status){try{await rpc('jm_admin_set_store_status',{p_pin:ADMIN_PIN,p_store_id:id,p_status:status});await loadStores()}catch(e){alert('変更できませんでした')}}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}document.querySelector('#login').addEventListener('click',login);document.querySelector('#previewBtn').addEventListener('click',parse);document.querySelector('#saveBtn').addEventListener('click',save);document.querySelector('#loadBtn').addEventListener('click',loadStores);document.querySelector('#stores').addEventListener('click',e=>{let b=e.target.closest('.act');if(b)setStatus(b.dataset.id,b.dataset.status)});document.querySelector('#logout').addEventListener('click',()=>location.reload());
</script></body></html>
