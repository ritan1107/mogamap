<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>全国モグマップ</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--bg:#fffaf2;--ink:#25231f;--muted:#746f67;--line:#eadfd2;--o:#f28b25}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;padding-bottom:70px}button,input,select{font:inherit}.head,main{max-width:1080px;margin:auto;padding:12px 14px}header{position:sticky;top:0;z-index:900;background:#fffaf2f3;border-bottom:1px solid var(--line)}.brand{font-size:22px;font-weight:950;color:var(--o)}.sub,.small{font-size:12px;color:var(--muted)}.controls{display:grid;grid-template-columns:180px 1fr;gap:8px;margin-top:10px}.controls select,.controls input{padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}.chips,.legend{display:flex;gap:7px;overflow:auto;padding:9px 0}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 11px;font-weight:850}.chip.on{background:var(--o);color:#fff}.legend{font-size:12px;color:var(--muted);flex-wrap:wrap}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px}.panel,.shop{background:#fff;border:1px solid var(--line);border-radius:18px}.panel{overflow:hidden}#map{height:min(50vh,460px);min-height:310px}.meta{display:flex;justify-content:space-between;padding:10px 13px;font-size:12px;color:var(--muted)}.heading{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}.heading h2{font-size:19px;margin:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.shop{padding:14px}.shop h3{margin:5px 0}.badges{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.badge{font-size:11px;padding:4px 7px;border-radius:99px;background:#f3eee7;font-weight:850}.new{background:#dff7e9}.sa{background:#fff1b8}.rally{background:#ffe1e3}.job{background:#fff0b8}.vol{background:#ffe0ef}.empty{text-align:center;padding:30px;color:var(--muted)}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffffff3;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;z-index:1000}.bottom a{text-align:center;padding:12px;text-decoration:none;color:var(--ink);font-weight:850}@media(max-width:650px){.controls,.grid{grid-template-columns:1fr}#map{height:42vh}}</style></head><body><header><div class="head"><div class="brand">🗾 全国モグマップ</div><div class="sub">地域のお店・スタンプラリー・仕事・ボランティアを見つけよう</div><div class="controls"><select id="pref"><option value="">都道府県を選ぶ</option></select><input id="q" placeholder="店名・住所・カテゴリで検索"></div><div class="chips" id="chips"></div></div></header><main><div class="legend"><span><i class="dot" style="background:#b98a16"></i>SA</span><span><i class="dot" style="background:#2878d0"></i>通常</span><span><i class="dot" style="background:#2f9d68"></i>NEW</span><span><i class="dot" style="background:#dd3f46"></i>スタンプ</span><span><i class="dot" style="background:#e5b72f"></i>バイト</span><span><i class="dot" style="background:#dc6fa2"></i>ボランティア</span></div><section class="panel"><div id="map"></div><div class="meta"><span id="status">都道府県を選んでください</span><span>選択地域だけ読み込み</span></div></section><div class="heading"><h2>お店を探す</h2><strong id="count">0件</strong></div><div id="list" class="grid"><div class="empty">地域を選ぶと参加店が表示されます。</div></div></main><nav class="bottom"><a href="./">🗺️ 全国マップ</a><a href="./admin.html">🔐 管理ページ</a></nav><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const PREFS=['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];const FILTERS=[['all','すべて'],['food','🍴飲食店'],['service','🛍️サービス'],['sa','⭐ SA'],['new','🟢 NEW'],['rally','🔴スタンプ'],['job','🟡バイト'],['vol','🩷ボランティア']];let SB='',KEY='',stores=[],selected='all';const pref=document.querySelector('#pref'),q=document.querySelector('#q'),chips=document.querySelector('#chips'),list=document.querySelector('#list'),count=document.querySelector('#count'),statusEl=document.querySelector('#status');PREFS.forEach(p=>pref.insertAdjacentHTML('beforeend',`<option>${p}</option>`));FILTERS.forEach(([k,l])=>{let b=document.createElement('button');b.className='chip'+(k==='all'?' on':'');b.dataset.k=k;b.textContent=l;chips.appendChild(b)});const map=L.map('map').setView([36.2,138.2],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);let layer=L.layerGroup().addTo(map);
async function config(){const t=await fetch('../index.html').then(r=>r.text());SB=(t.match(/const SB='([^']+)'/)||[])[1]||'';KEY=(t.match(/KEY='([^']+)'/)||[])[1]||'';if(!SB||!KEY)throw Error('config')}
function isNew(s){return Date.now()-new Date(s.created_at).getTime()<=2592000000}function color(s){if(s.rally_participant)return'#dd3f46';if(s.job_open)return'#e5b72f';if(s.volunteer_open)return'#dc6fa2';if(isNew(s))return'#2f9d68';if(s.sa_member)return'#b98a16';return'#2878d0'}function icon(c){return L.divIcon({className:'',html:`<div style="width:22px;height:22px;border-radius:50% 50% 50% 0;background:${c};border:3px solid white;box-shadow:0 2px 7px #0005;transform:rotate(-45deg)"></div>`,iconSize:[22,22],iconAnchor:[11,22]})}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function badges(s){let a=[];if(s.sa_member)a.push('<span class="badge sa">SA加盟店</span>');if(isNew(s))a.push('<span class="badge new">NEW</span>');if(s.rally_participant)a.push('<span class="badge rally">スタンプ参加</span>');if(s.job_open)a.push('<span class="badge job">バイト</span>');if(s.volunteer_open)a.push('<span class="badge vol">ボランティア</span>');return a.join('')}function match(s){let t=q.value.trim().toLowerCase();if(t&&!`${s.name} ${s.address} ${s.major_category} ${s.subcategory||''}`.toLowerCase().includes(t))return false;if(selected==='food'&&s.major_category!=='飲食店')return false;if(selected==='service'&&s.major_category!=='サービス')return false;if(selected==='sa'&&!s.sa_member)return false;if(selected==='new'&&!isNew(s))return false;if(selected==='rally'&&!s.rally_participant)return false;if(selected==='job'&&!s.job_open)return false;if(selected==='vol'&&!s.volunteer_open)return false;return true}function render(){let a=stores.filter(match);count.textContent=a.length+'件';layer.clearLayers();list.innerHTML=a.length?'':'<div class="empty">条件に合うお店がありません。</div>';a.forEach(s=>{let e=document.createElement('article');e.className='shop';e.innerHTML=`<div class="small">${esc(s.major_category)} › ${esc(s.subcategory||'その他')}</div><h3>${esc(s.name)}</h3><div class="small">${esc(s.address)}</div><div class="badges">${badges(s)}</div>`;list.appendChild(e);if(Number.isFinite(s.lat)&&Number.isFinite(s.lng))L.marker([s.lat,s.lng],{icon:icon(color(s))}).addTo(layer).bindPopup(`<b>${esc(s.name)}</b><br>${esc(s.address)}<br>${badges(s)}`)});statusEl.textContent=(pref.value||'全国')+'：'+a.length+'店舗'}async function load(){if(!pref.value){stores=[];render();map.setView([36.2,138.2],5);return}statusEl.textContent='読み込み中…';try{if(!SB)await config();let u=SB+'/rest/v1/jm_stores?select=id,store_code,name,address,prefecture,city,major_category,subcategory,lat,lng,sa_member,rally_participant,job_open,volunteer_open,created_at&status=eq.active&prefecture=eq.'+encodeURIComponent(pref.value)+'&limit=500';let r=await fetch(u,{headers:{apikey:KEY}});if(!r.ok)throw Error();stores=await r.json();render();if(stores.some(s=>Number.isFinite(s.lat)&&Number.isFinite(s.lng))){let pts=stores.filter(s=>Number.isFinite(s.lat)&&Number.isFinite(s.lng)).map(s=>[s.lat,s.lng]);map.fitBounds(pts,{padding:[30,30],maxZoom:10})}else map.setView(pref.value==='北海道'?[43.1,142.8]:pref.value==='埼玉県'?[35.86,139.65]:[36.2,138.2],pref.value==='北海道'?6:9);let x=new URL(location.href);x.searchParams.set('pref',pref.value);history.replaceState(null,'',x)}catch(e){statusEl.textContent='読み込みエラー';list.innerHTML='<div class="empty">データを読み込めませんでした。</div>'}}pref.addEventListener('change',load);q.addEventListener('input',render);chips.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;selected=b.dataset.k;[...chips.children].forEach(x=>x.classList.toggle('on',x===b));render()});let init=new URL(location.href).searchParams.get('pref');if(PREFS.includes(init)){pref.value=init;load()}
</script></body></html>
