    const SLUG='madoka',API='https://lgidhjxowpueglduphzp.supabase.co/functions/v1/digital-card-api',SELF='https://madoka-card.pages.dev/';
    const DEFAULT={name:'のざき まどか',roman:'NOSAKI MADOKA',organization:'株式会社リハ・イノベーション｜札幌ロボケアセンター',role:'理学療法士｜ロボケアセンタートレーナー',lead1:'「動きたい、歩きたい」を力に。',lead2:'一人ひとりの目標に寄り添います。',phone1:'011-215-7961',phone1Label:'札幌ロボケアセンター',phone2:'011-215-7190',phone2Label:'ヴァルハラセンター',email:'',address:'〒063-0033 札幌市西区西野3条10丁目9番23号',hours:'平日 9:00～22:00\n土日祝 9:00～22:00\n※営業時間が変更になる場合があります。',mapUrl:'https://maps.app.goo.gl/LE1Qe35aqKyhzTFH8?g_st=ic',reserveUrl:'https://docs.google.com/forms/d/19AaG80iHUeSuhATjlzeAJdr5lS2os_WW5dbTU39DdO0/viewform',website:'http://www.order-insole.com/xrobo/',profileText:'リハ・イノベーションが運営する札幌ロボケアセンターでは、装着型サイボーグ「HAL」を使ったプログラム「Neuro HALFIT」を提供しています。\n\n高齢の方や、病気・けがなどにより身体を動かしにくい方の「少しでも動きたい、歩きたい」という想いを大切に、目標に合わせたサポートを行っています。',missionText:'少しでも動きたい、歩きたい——。その気持ちを全力でサポートします。利用される方の目標を丁寧に伺い、一人ひとりに合わせたプログラムをご提案します。',services:['🤖 Neuro HALFIT','🚶 HALを使ったトレーニング','🥽 札幌VRリハビリテーション','👣 ヴァルハラインソール工房','📘 サイボーグHALの実績集','💬 体験・ご相談'],links:[{label:'札幌ロボケアセンター ホームページ',url:'http://www.order-insole.com/xrobo/'},{label:'札幌VRリハビリテーション',url:'http://www.order-insole.com/xvrkagura/'},{label:'ヴァルハラインソール工房',url:'http://www.order-insole.com/xinsole/'},{label:'サイボーグHALの実績集',url:'https://amzn.asia/d/fHLMCH7'},{label:'ご予約・お問い合わせ',url:'https://docs.google.com/forms/d/19AaG80iHUeSuhATjlzeAJdr5lS2os_WW5dbTU39DdO0/viewform'}],avatarUrl:'',bgImageUrl:'',galleryPhotos:[],navy:'#102f51',blue:'#2d8fbd',ice:'#dff6fb',accent:'#57d0dc',cardUrl:SELF};
    let P={...DEFAULT},PIN='';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    function toast(t){$('toast').textContent=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),1800)}

    function showLink(el,url){el.style.display=url?'':'none';if(url)el.href=url}
    function render(){const r=document.documentElement.style;r.setProperty('--navy',P.navy||DEFAULT.navy);r.setProperty('--blue',P.blue||DEFAULT.blue);r.setProperty('--ice',P.ice||DEFAULT.ice);r.setProperty('--accent',P.accent||DEFAULT.accent);r.setProperty('--hero',P.bgImageUrl?`url("${P.bgImageUrl}")`:`linear-gradient(135deg,#173a61,#2b90b2)`);$('name').textContent=P.name;$('roman').textContent=P.roman;$('organization').textContent=P.organization;$('role').textContent=P.role;$('lead1').textContent=P.lead1;$('lead2').textContent=P.lead2;$('profileText').textContent=P.profileText;$('missionText').textContent=P.missionText;let av=$('avatar');if(P.avatarUrl){av.src=P.avatarUrl;av.style.display='block';$('avatarPlaceholder').style.display='none'}else{av.removeAttribute('src');av.style.display='none';$('avatarPlaceholder').style.display='grid'}$('phone1').href=tel(P.phone1);$('phone1').textContent='☎ '+(P.phone1Label||'電話1');$('phone2').href=tel(P.phone2);$('phone2').textContent='☎ '+(P.phone2Label||'電話2');showLink($('phone1'),P.phone1);showLink($('phone2'),P.phone2);showLink($('reserve'),P.reserveUrl);$('services').innerHTML=(P.services||[]).filter(Boolean).map((x,i)=>`<div class="service"><span>${['◈','◇','✦','⌁','▣','○'][i%6]}</span>${esc(x)}</div>`).join('');$('linkList').innerHTML=(P.links||[]).filter(x=>x.label&&x.url).map(x=>`<a class="link" href="${esc(x.url)}" target="_blank">${esc(x.label)}</a>`).join('');$('gallery').innerHTML=(P.galleryPhotos||[]).filter(Boolean).map(x=>`<div class="photo"><img src="${esc(x)}" loading="lazy"></div>`).join('');$('galleryPanel').style.display=(P.galleryPhotos||[]).filter(Boolean).length?'block':'none';$('contactPhone1').href=tel(P.phone1);$('contactPhone1').innerHTML=`<span class="label">${esc(P.phone1Label||'PHONE 1')}</span>${esc(P.phone1||'')}`;$('contactPhone2').href=tel(P.phone2);$('contactPhone2').innerHTML=`<span class="label">${esc(P.phone2Label||'PHONE 2')}</span>${esc(P.phone2||'')}`;$('map').href=P.mapUrl||'#';$('map').innerHTML=`<span class="label">ADDRESS / MAP</span>${esc(P.address||'')}`;$('hours').innerHTML=`<span class="label">OPEN</span>${esc(P.hours||'').replace(/\n/g,'<br>')}`;document.title=(P.name||'のざき まどか')+'｜Digital Card'}
    async function load(){try{const q=await fetch(API+'?slug='+SLUG+'&t='+Date.now(),{cache:'no-store'});const j=await q.json();if(q.ok&&j.profile)P={...DEFAULT,...j.profile}}catch(e){}render()}
    async function api(body){const q=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-card-pin':PIN},body:JSON.stringify({slug:SLUG,...body})});const j=await q.json().catch(()=>({}));if(!q.ok)throw Error(j.error==='invalid pin'?'暗証番号が違います':j.error||'通信に失敗しました');return j}

    $('share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:P.name+' 電子名刺',url:P.cardUrl||SELF});else throw 0}catch(e){navigator.clipboard?.writeText(P.cardUrl||SELF);toast('URLをコピーしました')}};$('copy').onclick=()=>navigator.clipboard.writeText(P.cardUrl||SELF).then(()=>toast('URLをコピーしました'));document.querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>$(b.dataset.to).scrollIntoView({behavior:'smooth'}));
    const M=$('modal'),B=$('box');function close(){M.classList.remove('show');B.innerHTML=''}function field(id,label,value='',type='text'){return `<label>${label}</label><input id="${id}" type="${type}" value="${esc(value)}">`}function area(id,label,value=''){return `<label>${label}</label><textarea id="${id}">${esc(value)}</textarea>`}
    function login(){M.classList.add('show');B.innerHTML='<h2>🔐 野崎さん電子名刺 編集</h2><p style="font-size:12px">6桁の編集暗証番号を入力してください。</p><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="6桁の暗証番号"><button class="btn open" id="login">編集を始める</button><button class="btn dark" id="cancel">閉じる</button>';$('cancel').onclick=close;$('login').onclick=async()=>{try{PIN=$('pin').value.trim();await api({action:'verify_pin'});editor()}catch(e){alert(e.message)}}}
    function editor(){let services=[...(P.services||[])];while(services.length<6)services.push('');let links=[...(P.links||[])];while(links.length<8)links.push({label:'',url:''});let gallery=[...(P.galleryPhotos||[])];while(gallery.length<8)gallery.push('');B.innerHTML=`<h2>✏️ 電子名刺を編集</h2><div class="group"><h3>基本情報</h3>${field('nameEdit','表示名',P.name)}${field('romanEdit','英字表記',P.roman)}${area('orgEdit','会社・施設名',P.organization)}${area('roleEdit','肩書き',P.role)}${field('lead1Edit','キャッチコピー1',P.lead1)}${field('lead2Edit','キャッチコピー2',P.lead2)}</div><div class="group"><h3>電話・連絡先</h3><div class="row"><div>${field('phone1Edit','電話番号1',P.phone1)}${field('phone1LabelEdit','電話1の表示名',P.phone1Label)}</div><div>${field('phone2Edit','電話番号2',P.phone2)}${field('phone2LabelEdit','電話2の表示名',P.phone2Label)}</div></div>${field('emailEdit','メール',P.email,'email')}${field('reserveEdit','予約・問い合わせURL',P.reserveUrl,'url')}${field('websiteEdit','ホームページ',P.website,'url')}${field('mapEdit','GoogleマップURL',P.mapUrl,'url')}${area('addressEdit','住所',P.address)}${area('hoursEdit','営業時間',P.hours)}</div><div class="group"><h3>文章</h3>${area('profileEdit','プロフィール',P.profileText)}${area('missionEdit','想い',P.missionText)}</div><div class="group"><h3>サービス（6件）</h3>${services.map((x,i)=>field('service'+i,'サービス '+(i+1),x)).join('')}</div><div class="group"><h3>リンク（8件まで）</h3>${links.map((x,i)=>`<div class="row"><div>${field('linkLabel'+i,'ボタン名 '+(i+1),x.label)}</div><div>${field('linkUrl'+i,'URL '+(i+1),x.url,'url')}</div></div>`).join('')}</div><div class="group"><h3>写真</h3><div class="fileline"><b>プロフィール写真</b><input id="avatarFile" type="file" accept="image/*"></div><div class="fileline"><b>背景写真</b><input id="bgFile" type="file" accept="image/*"></div>${gallery.map((x,i)=>`<div class="fileline"><b>ギャラリー ${i+1}</b>${x?`<small> 登録済み</small>`:''}<input id="galleryFile${i}" type="file" accept="image/*"><label><input id="galleryRemove${i}" type="checkbox" style="width:auto"> この写真を外す</label></div>`).join('')}</div><div class="group"><h3>デザインカラー</h3><div class="row"><div>${field('navyEdit','ネイビー',P.navy,'color')}${field('blueEdit','ブルー',P.blue,'color')}</div><div>${field('iceEdit','背景',P.ice,'color')}${field('accentEdit','光の色',P.accent,'color')}</div></div></div><div class="group"><h3>暗証番号の変更</h3><label>新しい6桁（変更するときだけ入力）</label><input id="newPin" inputmode="numeric" maxlength="6" type="password"></div><div class="editor-actions"><button class="btn dark" id="closeEditor">閉じる</button><button class="btn save" id="saveEditor">☁ 保存する</button></div>`;$('closeEditor').onclick=close;$('saveEditor').onclick=async()=>{const btn=$('saveEditor');try{btn.disabled=true;btn.textContent='保存中…';Object.assign(P,{name:$('nameEdit').value.trim(),roman:$('romanEdit').value.trim(),organization:$('orgEdit').value.trim(),role:$('roleEdit').value.trim(),lead1:$('lead1Edit').value.trim(),lead2:$('lead2Edit').value.trim(),phone1:$('phone1Edit').value.trim(),phone1Label:$('phone1LabelEdit').value.trim(),phone2:$('phone2Edit').value.trim(),phone2Label:$('phone2LabelEdit').value.trim(),email:$('emailEdit').value.trim(),reserveUrl:$('reserveEdit').value.trim(),website:$('websiteEdit').value.trim(),mapUrl:$('mapEdit').value.trim(),address:$('addressEdit').value.trim(),hours:$('hoursEdit').value.trim(),profileText:$('profileEdit').value.trim(),missionText:$('missionEdit').value.trim(),navy:$('navyEdit').value,blue:$('blueEdit').value,ice:$('iceEdit').value,accent:$('accentEdit').value});P.services=services.map((_,i)=>$('service'+i).value.trim()).filter(Boolean);P.links=links.map((_,i)=>({label:$('linkLabel'+i).value.trim(),url:$('linkUrl'+i).value.trim()})).filter(x=>x.label&&x.url);if($('avatarFile').files[0])P.avatarUrl=await upload($('avatarFile').files[0],'avatar');if($('bgFile').files[0])P.bgImageUrl=await upload($('bgFile').files[0],'background');for(let i=0;i<8;i++){if($('galleryRemove'+i).checked)gallery[i]='';if($('galleryFile'+i).files[0])gallery[i]=await upload($('galleryFile'+i).files[0],'gallery-'+(i+1))}P.galleryPhotos=gallery.filter(Boolean);const saved=await api({action:'save_profile',profile:P});P={...DEFAULT,...saved.profile};const next=$('newPin').value.trim();if(next){await api({action:'change_pin',newPin:next});PIN=next}render();toast('保存しました');close()}catch(e){alert(e.message);btn.disabled=false;btn.textContent='☁ 保存する'}}}
    $('editOpen').onclick=login;$('navEdit').onclick=login;load();
  </script>
  <script src="./editor-v2.js"></script>
</body>
</html>
