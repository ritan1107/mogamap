<html lang="ja">
<head>
<meta charset="utf-8">

<title>もぐマップ ネットマルシェ</title>
<link rel="icon" type="image/png" href="../simple/icons/favicon-48.png">

<meta property="og:title" content="もぐマップ ネットマルシェ｜歩いて、のぞいて、スタンプを集めよう">
<meta property="og:description" content="キャラを作って街を歩き、お店をのぞいて、買い物とスタンプラリー。">

<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'M PLUS Rounded 1c',system-ui,sans-serif;background:#fff8ef;color:#4a3b35;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
button{font-family:inherit}
header{height:50px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;background:#fff;border-bottom:2px solid #f3dcc2}
.logo{font-weight:800;font-size:16px;color:#e0708a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10px;background:#ffe2ea;color:#d0567a;padding:2px 8px;border-radius:99px;font-weight:800;white-space:nowrap}
.spacer{flex:1}
.pill.hp{text-decoration:none;background:#fff1ec;border-color:#f6b8a6;color:#c8604a}
@media(max-width:420px){.pill.hp{font-size:11px;padding:3px 8px}.logo{font-size:14px}.tag{display:none}}
.pill{background:#fff3d6;border:2px solid #ffd27a;border-radius:99px;padding:3px 11px;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap;color:#4a3b35}
.iconbtn{width:34px;height:34px;flex:none;border-radius:50%;border:2px solid #f3dcc2;background:#fff;font-size:15px;cursor:pointer;color:#4a3b35;font-weight:800}
#viewport{flex:1;overflow:auto;position:relative;background:#f6ead8;-webkit-overflow-scrolling:touch}
#wrap{position:relative;margin:0 auto}
#world{position:absolute;left:0;top:0;width:2400px;height:1420px;transform-origin:0 0;cursor:pointer;user-select:none;-webkit-user-select:none;overflow:hidden}
#bg{position:absolute;inset:0}
.av{position:absolute;width:50px;transform:translate(-50%,-100%);pointer-events:none}
.av svg{display:block;width:50px;height:auto}
.av.left svg{transform:scaleX(-1)}
.av.walking svg{animation:bob .26s infinite alternate}
.av.left.walking svg{animation:bobl .26s infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes bobl{from{transform:scaleX(-1) translateY(0)}to{transform:scaleX(-1) translateY(-3px)}}
.av .nm{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;background:rgba(255,255,255,.9);padding:0 7px;border-radius:8px;white-space:nowrap;margin-top:1px}
.av.me .nm{background:#ff8fab;color:#fff}
.bubble{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#fff;border:2px solid #4a3b35;border-radius:12px;padding:3px 10px;font-size:12px;font-weight:800;width:max-content;max-width:210px;text-align:center;line-height:1.35;animation:pop .2s;z-index:5}
.bubble::after{content:'';position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:#4a3b35}
@keyframes pop{from{transform:translateX(-50%) scale(.5);opacity:0}}
.ripple{position:absolute;width:30px;height:14px;margin:-7px 0 0 -15px;border:3px solid #ff8fab;border-radius:50%;animation:rip .5s forwards;pointer-events:none}
@keyframes rip{to{transform:scale(2);opacity:0}}

.booth{position:absolute;width:160px;height:168px;cursor:pointer;transition:transform .15s}
.booth:hover{transform:translateY(-3px)}
.booth .sign{position:absolute;top:0;left:50%;transform:translateX(-50%);background:#fff;border:3px solid var(--c);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:800;white-space:nowrap;z-index:3;max-width:176px;overflow:hidden;text-overflow:ellipsis}
.booth .awn{position:absolute;top:24px;left:4px;right:4px;height:38px;border-radius:10px 10px 0 0;background:repeating-linear-gradient(90deg,var(--c) 0 19px,#fff 19px 38px);z-index:2}
.booth .awn::after{content:'';position:absolute;left:0;right:0;top:100%;height:10px;background:radial-gradient(circle at 9.5px 0,var(--c) 9.5px,transparent 10px) 0 0/38px 10px repeat-x,radial-gradient(circle at 28.5px 0,#fff 9.5px,transparent 10px) 0 0/38px 10px repeat-x}
.booth .pole{position:absolute;top:60px;width:6px;height:84px;background:#c9a27e;border-radius:3px}
.booth .pole.l{left:12px}.booth .pole.r{right:12px}
.booth .keeper{position:absolute;top:66px;left:50%;transform:translateX(-50%);width:40px;z-index:1}
.booth .keeper svg{width:40px;display:block}
.booth .counter{position:absolute;bottom:0;left:0;right:0;height:46px;background:#fffdf8;border:3px solid var(--c);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;gap:3px;z-index:2;box-shadow:0 5px 0 rgba(0,0,0,.08)}
.booth .got{position:absolute;right:-6px;top:20px;z-index:4;width:34px;height:34px;border-radius:50%;border:3px double #e2475f;color:#e2475f;background:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;transform:rotate(-14deg)}
.lot{position:absolute;width:150px;height:64px;border:3px dashed #d9bf9f;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:800;color:#b49477;background:rgba(255,255,255,.45);cursor:pointer;line-height:1.4}
.lot:hover{background:rgba(255,255,255,.8)}
.fountain{position:absolute;cursor:pointer}
.bld{position:absolute;pointer-events:none}.bld svg{display:block;pointer-events:none}.bld svg *{pointer-events:visiblePainted;cursor:pointer}
.bname{position:absolute;transform:translate(-50%,-100%);background:#fff;border:2.5px solid var(--c);border-radius:99px;padding:2px 10px;font-size:11px;font-weight:800;white-space:nowrap;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.1);max-width:190px;overflow:hidden;text-overflow:ellipsis}
.bname i{font-style:normal;margin-left:3px}
.bname:hover{background:var(--c);color:#fff}
.booth.small{transform:scale(.8);transform-origin:50% 100%}.booth.small:hover{transform:scale(.8) translateY(-3px)}
.lot{width:120px!important;height:52px!important;font-size:11px!important}
.booth-got{position:absolute;width:34px;height:34px;border-radius:50%;border:3px double #e2475f;color:#e2475f;background:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;transform:rotate(-14deg);pointer-events:none}
.booth .board{position:absolute;top:76px;left:50%;transform:translateX(-50%);background:#4d5b4f;color:#fff;border:3px solid #a9805e;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:800;white-space:nowrap;z-index:1;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.booth .rally{position:absolute;left:-6px;top:20px;z-index:4;background:#ffd36e;color:#7a4b00;border:2px solid #fff;border-radius:99px;font-size:10px;font-weight:800;padding:1px 7px;box-shadow:0 2px 0 rgba(0,0,0,.1)}
.booth.info .roof{position:absolute;top:22px;left:-6px;right:-6px;height:48px;background:var(--c);clip-path:polygon(50% 0,100% 100%,0 100%);z-index:2}
.booth.info .wall{position:absolute;top:68px;left:8px;right:8px;bottom:0;background:#fffaf0;border:3px solid var(--c);border-radius:4px 4px 8px 8px;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:800;color:#7a5a12}
.booth.info .wall img{width:44px;height:44px}
.av.npc{pointer-events:auto;cursor:pointer}
.btn.mic{padding:9px 12px}.btn.mic.on{background:#ff4d6d;color:#fff;border-color:#ff4d6d;animation:mic 1s infinite}
@keyframes mic{50%{box-shadow:0 0 0 6px rgba(255,77,109,.25)}}
.av.keeper{pointer-events:auto;cursor:pointer;width:56px}.av.keeper svg{width:56px}
.av.keeper .bubble{border-color:var(--c);box-shadow:0 2px 0 var(--c)}
.av.keeper .bubble::after{border-top-color:var(--c)}
.av.pet{width:44px;pointer-events:auto;cursor:pointer}.av.pet svg{width:44px}
.av.keeper .nm{background:var(--c);color:#fff;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2);font-size:10px;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.av.keeper .mark{position:absolute;bottom:calc(100% - 2px);left:50%;transform:translateX(-50%);background:#ffd36e;color:#7a4b00;border:2px solid #fff;font-size:9px;font-weight:800;border-radius:99px;padding:0 6px;white-space:nowrap;animation:mk 1.2s ease-in-out infinite alternate;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.av.keeper .bubble~.mark,.av.keeper.talking .mark{display:none}
@keyframes mk{to{transform:translateX(-50%) translateY(-4px)}}
.hlogo{width:28px;height:28px;flex:none}
.sec{margin-top:14px;border-top:1px dashed #f0dfcc;padding-top:12px}
.sec>b{display:block;font-size:14px;margin-bottom:6px}
.sec p{margin:0;font-size:14px;line-height:1.7;white-space:pre-line}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{display:inline-flex;align-items:center;gap:4px;text-decoration:none;border:2px solid #f3dcc2;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:800;color:#4a3b35;background:#fff}
.links a.main{background:#ff8fab;border-color:#ff8fab;color:#fff}
.mogubtn{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:#d4a52c;color:#fff;font-weight:800;border-radius:16px;padding:13px;margin-top:16px;font-size:15px;box-shadow:0 4px 0 #a9801a}
.mogubtn img{width:26px;height:26px;background:#fff;border-radius:50%}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tg{font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px;background:#fff;color:#4a3b35}

#chatrow{flex:none;display:flex;gap:6px;padding:6px 8px;background:#fff;border-top:2px solid #f3dcc2}
#chatin{flex:1;min-width:0;border:2px solid #f3dcc2;border-radius:99px;padding:8px 14px;font:inherit;font-size:16px;outline:none;color:#4a3b35}
#chatin:focus{border-color:#ff8fab}
.btn{border:none;border-radius:99px;padding:9px 16px;font:inherit;font-weight:800;cursor:pointer;background:#ff8fab;color:#fff;font-size:14px;white-space:nowrap}
.btn.sub{background:#fff;color:#4a3b35;border:2px solid #f3dcc2}
.btn.ok{background:#3fb984}
.btn.small{padding:6px 12px;font-size:12px}
.btn.block{display:block;width:100%;text-align:center;text-decoration:none;margin:12px 0}
.btn:disabled{opacity:.55;cursor:default}
nav{flex:none;display:flex;background:#fff;padding:3px 4px calc(3px + env(safe-area-inset-bottom));border-top:1px solid #f5e6d3}
nav button{flex:1;border:none;background:none;font-size:10px;font-weight:800;color:#7a6258;display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 0;cursor:pointer;position:relative}
nav button .i{font-size:22px;line-height:1.2}
.badge{position:absolute;top:0;left:calc(50% + 6px);background:#ff4d6d;color:#fff;font-size:10px;border-radius:99px;min-width:17px;height:17px;line-height:17px;padding:0 4px;text-align:center}

#modal{position:fixed;inset:0;background:rgba(74,59,53,.45);display:none;align-items:flex-end;justify-content:center;z-index:100}
#modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:90vh;max-height:90dvh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));animation:up .25s;position:relative}
@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0 0 6px;font-size:19px;padding-right:36px}
.sheet h3{font-size:15px;margin:18px 0 6px}
.x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:none;background:#f6ede4;font-size:15px;cursor:pointer;color:#7a6258}
.muted{color:#a08a7e;font-size:12px;line-height:1.6}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.fl{display:block;font-size:12px;font-weight:800;color:#a08a7e;margin-top:12px}
.fl input,.fl textarea,.fl select,.mrow input{display:block;width:100%;margin-top:4px;border:2px solid #f3dcc2;border-radius:12px;padding:9px 12px;font:inherit;font-size:16px;color:#4a3b35;outline:none;background:#fff}
.fl input:focus,.fl textarea:focus,.mrow input:focus{border-color:#ff8fab}
.err{color:#d04848;font-size:13px;font-weight:800;margin-top:8px;min-height:1em}

.ed{display:flex;gap:14px;align-items:flex-start;margin-top:10px}
.prev{width:120px;flex:none;background:#fff6ea;border-radius:18px;padding:12px 14px 8px}
.prev svg{width:100%;display:block}
.opts{flex:1;min-width:0}
.opt{margin-bottom:9px}
.ol{font-size:11px;font-weight:800;color:#a08a7e;margin-bottom:3px}
.oc{display:flex;flex-wrap:wrap;gap:5px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid #e8dccf;cursor:pointer;padding:0}
.sw.on{outline:3px solid #ff8fab;outline-offset:1px}
.chipb{border:2px solid #f3dcc2;background:#fff;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:800;cursor:pointer;color:#4a3b35}
.chipb.on{background:#ff8fab;color:#fff;border-color:#ff8fab}
@media(max-width:480px){.ed{flex-direction:column;align-items:stretch}.prev{width:100px;margin:0 auto}}

.shophead{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,var(--c),#fff 140%);margin:-18px -18px 0;padding:22px 18px 16px;border-radius:22px 22px 0 0}
.shophead .big{width:62px;height:62px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.shophead h2{margin:0;color:#3a2c27}
.shophead .muted{color:#5a4840}
.stbox{display:flex;align-items:center;gap:8px;margin:12px 0 4px;background:#fff8ef;border-radius:14px;padding:9px 12px;font-size:13px;font-weight:800;flex-wrap:wrap}
.chip{font-size:11px;padding:3px 9px;border-radius:99px;font-weight:800;white-space:nowrap}
.chip.none{background:#f0ebe6;color:#8a766c}.chip.bought{background:#ffe2ea;color:#d0567a}.chip.pending{background:#fff1c9;color:#b7791f}.chip.approved{background:#dcf5e8;color:#2f9e6c}.chip.rejected{background:#ffe0e0;color:#d04848}
.menu{display:grid;gap:10px;margin-top:12px}
.item{display:flex;gap:12px;align-items:center;border:2px solid #f3e6d6;border-radius:16px;padding:10px}
.item .em{width:56px;height:56px;border-radius:14px;background:#fff6ea;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.item .body{flex:1;min-width:0}
.item .inm{font-weight:800}
.item .pr{color:#e0708a;font-weight:800}
.item .ds{font-size:12px;color:#8a766c}
.item .bought{font-size:11px;color:#3fb984;font-weight:800}
.callout{background:#fff1f5;border:2px solid #ffc6d5;border-radius:16px;padding:12px;margin-top:14px;text-align:center}
.callout p{margin:0 0 8px;font-size:13px;font-weight:700}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;margin-top:8px}
.tabb{flex:none;border:2px solid #f3dcc2;background:#fff;border-radius:99px;padding:5px 12px;font-size:12px;font-weight:800;cursor:pointer;color:#4a3b35;position:relative}
.tabb.on{background:#4a3b35;color:#fff;border-color:#4a3b35}
.tabb i{font-style:normal;background:#ff4d6d;color:#fff;border-radius:99px;padding:0 6px;margin-left:5px;font-size:10px}
.tip{background:#eef8f2;border-radius:14px;padding:10px 12px;font-size:12px;line-height:1.6;color:#2f7a57;font-weight:700}
.req{border:2px solid #f3e6d6;border-radius:16px;padding:12px;margin-bottom:8px;position:relative;overflow:hidden}
.req .ono{font-size:12px;margin-top:3px}
.req .note{font-size:12px;background:#fff8ef;border-radius:10px;padding:5px 9px;margin-top:6px}
.req .ra{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.req.done{opacity:.75;font-size:13px;padding:9px 12px}
.req .bigstamp{position:absolute;right:18px;top:14px}

.prog{height:14px;background:#f3e6d6;border-radius:99px;overflow:hidden;margin-top:12px}
.prog div{height:100%;background:linear-gradient(90deg,#ffb3c6,#ff8fab);border-radius:99px;transition:width .6s}
.progt{text-align:right;font-weight:800;font-size:13px;margin-top:4px}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:14px 8px;margin-top:14px}
.cell{display:flex;flex-direction:column;align-items:center;gap:5px}
.slot{width:90px;height:90px;border-radius:50%;border:2px dashed #e8d3bd;display:flex;align-items:center;justify-content:center;color:#c4ab93;font-size:11px;font-weight:800;text-align:center;background:#fffdf9}
.slot .ghost{font-size:30px;opacity:.25;filter:grayscale(1)}
.cn{font-size:11px;font-weight:800;text-align:center;line-height:1.3}
.stamp{width:80px;height:80px;border-radius:50%;border:4px double #e2475f;color:#e2475f;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg);font-weight:800;background:rgba(255,255,255,.6);line-height:1.15}
.stamp .e{font-size:26px}
.stamp .sn{font-size:8px;max-width:66px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.stamp .sd{font-size:8px;border-top:1.5px solid #e2475f;margin-top:2px;padding-top:1px}
.stamp.press{animation:press .65s cubic-bezier(.2,1.5,.4,1) both}
@keyframes press{0%{transform:scale(2.6) rotate(-35deg);opacity:0}55%{opacity:1}100%{transform:scale(1) rotate(-12deg);opacity:1}}
.coupon{margin-top:14px;border:3px dashed #ff8fab;border-radius:18px;padding:14px;text-align:center;background:#fff4f7;line-height:1.7}
.coupon b{display:block;font-size:15px;color:#d0567a}
.coupon span{font-size:11px;color:#a08a7e}
.hist{border:2px solid #f3e6d6;border-radius:16px;padding:11px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.hist .em{font-size:28px}
.hist .body{flex:1;min-width:0;font-size:13px}
.hist .acts2{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.emopick{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.emopick button{width:38px;height:38px;border-radius:10px;border:2px solid #f3dcc2;background:#fff;font-size:20px;cursor:pointer;padding:0}
.emopick button.on{border-color:#ff8fab;background:#fff1f5}
.mrow{display:grid;grid-template-columns:56px 1fr 92px 32px;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed #f0dfcc}
.mrow input{margin-top:0;padding:8px 9px}
.mrow .url{grid-column:1/-1}
.mrow .del{border:none;background:#f6ede4;border-radius:10px;cursor:pointer;color:#a08a7e;font-weight:800}
.steps{padding-left:0;list-style:none;counter-reset:s;margin:10px 0}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;font-size:14px;line-height:1.6}
.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:#ff8fab;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.future{background:#f4f1ff;border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.8}
.chatlog{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.chatlog div{font-size:14px;background:#fff8ef;border-radius:12px;padding:6px 10px}
.chatlog b{color:#d0567a;margin-right:6px}

#checkout{position:fixed;inset:0;background:#eef1f6;z-index:200;display:none;flex-direction:column;font-family:system-ui,-apple-system,'Hiragino Sans',sans-serif;color:#1f2937}

function storefront(L,h,c,emoji,label,info){const wall=info?'#fffaf0':'#fffdf8';let aw='';const n=9,w=(L-8)/n;for(let k=0;k<n;k++)aw+=`<rect x="${4+k*w}" y="-62" width="${w+.4}" height="13" fill="${k%2?'#fff':c}"/>`;
  return `<rect x="0" y="${-h}" width="${L}" height="${h}" fill="${wall}"/>
  ${h>90?`<rect x="8" y="${-h+30}" width="${L-16}" height="${Math.max(0,h-102)}" fill="${mix(c,'#ffffff',.82)}"/>${Array.from({length:Math.max(0,Math.floor((h-104)/22))},(_,r)=>`<rect x="14" y="${-h+36+r*22}" width="${(L-34)/2}" height="12" rx="2" fill="#d6ecfa"/><rect x="${20+(L-34)/2}" y="${-h+36+r*22}" width="${(L-34)/2}" height="12" rx="2" fill="#d6ecfa"/>`).join('')}`:''}
  <rect x="5" y="${-h+6}" width="${L-10}" height="19" rx="4" fill="#fff" stroke="${c}" stroke-width="2.5"/>
  <text x="${L/2}" y="${-h+19.5}" font-size="10.5" font-weight="800" text-anchor="middle" fill="#4a3b35" font-family="M PLUS Rounded 1c,sans-serif">${esc(label)}</text>
  ${aw}<polygon points="4,-49 ${L-4},-49 ${L},-45 0,-45" fill="rgba(0,0,0,.12)"/>
  <rect x="8" y="-43" width="${L-38}" height="30" rx="2" fill="#d8eefc" stroke="${mix(c,'#000000',.15)}" stroke-width="2"/>
  <text x="${(L-30)/2}" y="-21" font-size="15" text-anchor="middle">${esc(emoji)}${esc(emoji)}</text>
  <rect x="${L-25}" y="-40" width="17" height="40" rx="2" fill="${mix(c,'#000000',.1)}"/><circle cx="${L-11}" cy="-20" r="1.6" fill="#fff"/>
  <rect x="0" y="-3" width="${L}" height="3" fill="rgba(0,0,0,.1)"/>`}
function buildingSVG(L,c,emoji,label,info){const{i,j,h,f}=L,i1=i+2,j1=j+2;
  const B=P(i,j),R=P(i1,j),F=P(i1,j1),Lf=P(i,j1),up=p=>[p[0],p[1]-h];
  const minx=Lf[0]-4,maxx=R[0]+4,miny=B[1]-h-(info?70:8),maxy=F[1]+4;
  const len=Math.hypot(2*T,2*T2),wallI=mix(c,'#ffffff',.55),wallJ=mix(c,'#ffffff',.72),roof=mix(c,'#ffffff',.35);
  let body=`<polygon points="${pts([R,F,up(F),up(R)])}" fill="${mix(wallI,'#000000',.08)}"/><polygon points="${pts([Lf,F,up(F),up(Lf)])}" fill="${wallJ}"/>`;
  if(f.includes('J'))body+=`<g transform="matrix(0.894,0.447,0,1,${Lf[0]},${Lf[1]})">${storefront(len,h,c,emoji,label,info)}</g>`;
  if(f.includes('I'))body+=`<g transform="matrix(0.894,-0.447,0,1,${F[0]},${F[1]})">${storefront(len,h,c,emoji,label,info)}</g><polygon points="${pts([R,F,up(F),up(R)])}" fill="rgba(0,0,0,.06)"/>`;
  body+=`<polygon points="${pts([up(B),up(R),up(F),up(Lf)])}" fill="${roof}" stroke="${mix(c,'#000000',.12)}" stroke-width="2"/>`;
  const rc=P(i+1,j+1);body+=`<polygon points="${pts([[rc[0]-14,rc[1]-h-2],[rc[0],rc[1]-h-9],[rc[0]+14,rc[1]-h-2],[rc[0],rc[1]-h+5]])}" fill="#fff" opacity=".7"/>`;
  if(info)body+=`<rect x="${rc[0]-3}" y="${rc[1]-h-44}" width="6" height="40" fill="#8a7a6a"/><circle cx="${rc[0]}" cy="${rc[1]-h-50}" r="30" fill="#fff" stroke="${c}" stroke-width="5"/><image href="${LOGO}" x="${rc[0]-24}" y="${rc[1]-h-74}" width="48" height="48"/>`;
  return{svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${maxx-minx}" height="${maxy-miny}" viewBox="${minx} ${miny} ${maxx-minx} ${maxy-miny}" style="overflow:visible">${body}</svg>`,minx,miny,z:Math.round(B[1]+(L.f==='IJ'?T2:0)),top:[rc[0],rc[1]-h-(info?86:12)]}}

function placeBuilding(L,item,act,isInfo){const label=(item.short||item.name).slice(0,8);const b=buildingSVG(L,item.color,item.emoji,label,isInfo);

const ents=[];let me=null;
function makeEnt(av,name,x,y,isMe){const el=document.createElement('div');el.className='av'+(isMe?' me':'');el.innerHTML=(typeof av==='string'?av:avatarSVG(av))+`<div class="nm">${esc(name)}</div>`;world.appendChild(el);
  const e={el,av,name,x,y,tx:x,ty:y,cb:null,me:!!isMe};place(e);ents.push(e);return e}
function place(e){e.el.style.left=e.x+'px';e.el.style.top=e.y+'px';e.el.style.zIndex=Math.round(e.y)+1}
function walkTo(e,x,y,cb){if(e===me&&LIVE&&!MP.inside){if(cb)cb();return}[x,y]=clampW(x,y);e.tx=x;e.ty=y;e.cb=cb||null;if(e===me)setTimeout(()=>mpTrack(),0);
  if(x<e.x-2)e.el.classList.add('left');else if(x>e.x+2)e.el.classList.remove('left');
  if(Math.hypot(x-e.x,y-e.y)<1){e.cb=null;cb&&cb();return}e.el.classList.add('walking')}
let last=performance.now();
function tick(t){const dt=Math.min(.05,(t-last)/1000);last=t;
  for(const e of ents){const dx=e.tx-e.x,dy=e.ty-e.y,d=Math.hypot(dx,dy);if(d>0){const st=(e.me?300:e.pet?120:85)*dt;
    if(d<=Math.max(st,.6)){e.x=e.tx;e.y=e.ty}else{e.x+=dx/d*st;e.y+=dy/d*st}place(e);
    if(e.x===e.tx&&e.y===e.ty){e.el.classList.remove('walking');const cb=e.cb;e.cb=null;cb&&cb()}}}
  if(me&&me.el.classList.contains('walking'))follow(.12);requestAnimationFrame(tick)}
function say(e,text){let b=e.el.querySelector('.bubble');if(b)b.remove();b=document.createElement('div');b.className='bubble';b.textContent=text;e.el.appendChild(b);e.el.classList.add('talking');clearTimeout(e.bt);e.bt=setTimeout(()=>{b.remove();e.el.classList.remove('talking')},4500)}
function ripple(x,y){const r=document.createElement('div');r.className='ripple';r.style.left=x+'px';r.style.top=y+'px';r.style.zIndex=2;world.appendChild(r);setTimeout(()=>r.remove(),520)}

function fit(){const W=vp.clientWidth,H=vp.clientHeight;let sc=Math.max(.8,Math.min(1.15,H/WH*1.35));if(W/WW>sc)sc=Math.min(W/WW,1.3);SC=sc;

function follow(k){if(!me)return;const tx=me.x*SC-vp.clientWidth/2,ty=me.y*SC-vp.clientHeight/2;vp.scrollLeft+=(tx-vp.scrollLeft)*k;vp.scrollTop+=(ty-vp.scrollTop)*k}

  <details class="codein"><summary>🔑 キャラの保存コードを持っている方</summary><div class="amt" style="margin-top:6px"><input id="en_code" placeholder="MOGU-…" style="font-size:15px!important;font-weight:700;text-align:left"><button class="btn small" data-act="usecode">使う</button></div><div class="err" id="code_err"></div></details>
  <div id="entryForm"></div>${first?'':'<div class="acts"><button class="btn sub" data-act="close">やめる</button></div>'}`,first)}

  if(r==='shop')f.innerHTML=`<label class="fl">お店<select id="en_shop"><option value="">お店を選んでください</option>${allShops().filter(x=>x.real&&x.id!=='ritan').map(x=>`<option value="${esc(x.id)}" ${S.shopId===x.id?'selected':''}>${esc(x.emoji)} ${esc(x.name)}</option>`).join('')}</select></label>
    <label class="fl">お店のPIN（もぐマップのお店アプリと同じ）<input id="en_pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN"></label>
    <label class="fl">お店の人のなまえ（キャラの名札）<input id="en_name" maxlength="10" value="${esc(S.role==='shop'?S.name:'')}" placeholder="例：ゆかりママ"></label>`;
  if(r==='comm')f.innerHTML=`<label class="fl">ニックネーム<input id="en_name" maxlength="10" value="${esc(S.name&&S.name!=='ゲスト'?S.name:(p&&p.nickname)||'')}" placeholder="例：りーたん"></label>
    <label class="fl">UW.ID<input id="en_uw" maxlength="30" autocomplete="off" value="${esc(S.uw||(p&&p.uwId)||'')}" placeholder="例：UW-12345"></label><div class="muted">もぐマップのスタンプラリーで使うUW.IDと同じです。</div>${LIVE&&!part()?`<label class="fl">あいことば（4桁の数字・別の端末で入るときに使います）<input id="en_pin4" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="例：1234"></label><div class="tip">📮 もぐマップで登録済みの方は、上の「登録済みの方」から入ってね（もう一度登録しなくてOK）</div>`:''}`;
  if(r==='guest')f.innerHTML=`<label class="fl">ニックネーム（なくてもOK）<input id="en_name" maxlength="10" value="${esc(S.name&&S.name!=='ゲスト'?S.name:'')}" placeholder="例：さっぽろ太郎"></label><div class="muted">名札に「ゲスト」と表示されます。キャラはこの端末に保存されます。</div>`;
  f.innerHTML+=`<div class="err" id="en_err"></div>${LIVE||r==='guest'?'':'<div class="muted">※ 体験版のため、PIN・UW.IDの確認はしていません。公開版ではもぐマップで確認します。</div>'}<div class="acts"><button class="btn" data-act="entergo">${S.avatar?'入る':'次へ：アバターを作る →'}</button></div>`}
async function enterGo(btn){const r=entryRole,err=t=>{$('#en_err').textContent=t};const nm=(($('#en_name')||{}).value||'').trim();
  btn.disabled=true;try{
  if(r==='shop'){const id=$('#en_shop').value,pin=$('#en_pin').value.trim();if(!id)return err('お店を選んでください');if(!pin)return err('PINを入れてください');
    if(LIVE){const x=await rpc('mogu_shop_login',{p_shop_id:id,p_pin:pin});if(!x||!x.ok)return err((x&&x.message)||'PINがちがいます');lsSet(LKEY,{shopId:id,pin,name:(shopById(id)||{}).name||'',organizer:!!x.organizer})}
    S.role='shop';S.shopId=id;S.name=nm||'お店の人';S.uw=''}
  if(r==='comm'){const uw=$('#en_uw').value.trim();if(!nm)return err('ニックネームを入れてください');if(!uw)return err('UW.IDを入れてください');
    if(LIVE){const p=part();if(p){if(p.uwId!==uw){p.uwId=uw;lsSet(PKEY,p)}}else{const pin=(($('#en_pin4')||{}).value||'').trim();if(!/^\d{4}$/.test(pin))return err('あいことば（4桁の数字）を決めてください');
      const rows=await rpc('start_rally_with_uwid',{p_nickname:nm,p_uw_id:uw}),x=rows&&rows[0];if(!x)return err('UW.IDを確認できませんでした');
      const np={id:x.id||x.participant_id,token:x.participant_token,nickname:x.nickname||nm,entryId:x.participant_entry_id||'',uwId:x.uw_id||uw,style:'onsite'};lsSet(PKEY,np);
      try{const q=await rpc('mogu_set_login_pin',{p_participant_id:np.id,p_participant_token:np.token,p_pin:pin});if(q&&q[0]&&q[0].entry_id){np.entryId=q[0].entry_id;lsSet(PKEY,np)}S.showId=true}catch(e){console.warn(e)}}}
    S.role='comm';S.uw=uw;S.name=nm;S.shopId=''}
  if(r==='guest'){S.role='guest';S.name=nm||S.name||'ゲスト';S.uw='';S.shopId=''}
  save();renderBooths();setMeLabel();if(LIVE)await profReload();
  if(!S.avatar)openAvatar(true);else{if(!me)startMe();if(S.showId){S.showId=false;save();openIdCard()}else closeModal();toast(`${ROLE[S.role][0]} ${ROLE[S.role][1]}として入りました`)}
  }catch(e){err(String(e.message||e).includes('UW')?'UW.IDを確認してください':'うまくいきませんでした。もう一度お試しください')}finally{btn.disabled=false}}

/* ---------- スタンプラリー連動（もぐマップと同じ参加者・同じスタンプ帳） ---------- */
const RL={stampIds:new Set(),progress:null,subs:[],clears:[],ticker:null,posts:null,loaded:false};
const PER_CLEAR=3,DM_MARK='【DM・質問】';
const part=()=>{const p=lsGet(PKEY);return p&&p.id&&p.token?p:null};
const pAuth=p=>({p_participant_id:p.id,p_participant_token:p.token});
const isReal=id=>{const s=shopById(id);return!!(s&&s.real&&s.id!=='ritan')};
async function ensureParticipant(){let p=part();if(p)return p;
  const rows=await rpc('start_rally_with_uwid',{p_nickname:String(S.name||'ゲスト').slice(0,20),p_uw_id:S.role==='comm'&&S.uw?S.uw:null}),x=rows&&rows[0];
  if(!x)throw new Error('参加登録できませんでした');
  p={id:x.id||x.participant_id,token:x.participant_token,nickname:x.nickname||S.name,entryId:x.participant_entry_id||'',uwId:x.uw_id||null,style:'onsite'};lsSet(PKEY,p);return p}
async function loadRally(quiet){const p=part();if(!LIVE||!p)return;
  try{const [pr,ids]=await Promise.all([rpc('get_rally_progress',pAuth(p)),rpc('get_participant_stamp_ids',pAuth(p))]);
    const before=new Set(RL.stampIds),next=new Set((ids||[]).map(x=>x.shop_id));RL.progress=(pr&&pr[0])||null;
    if(RL.loaded&&!quiet){const fresh=[...next].filter(i=>!before.has(i));fresh.forEach(i=>{S.newStamps.push(i);const sh=shopById(i);toast(`📮 ${sh?sh.name:'お店'} のスタンプが押されました！`,4500)});if(fresh.length)save()}
    RL.stampIds=next;RL.loaded=true;
    if(!p.entryId){try{const er=await rpc('get_participant_entry_id',pAuth(p));if(er&&er[0]&&er[0].participant_entry_id){p.entryId=er[0].participant_entry_id;lsSet(PKEY,p)}}catch(e){}}
    try{const rows=await rpc('mogu_record_clears',Object.assign(pAuth(p),{p_per_clear:PER_CLEAR}));const was=RL.clears.length;RL.clears=rows||[];if(was&&RL.clears.length>was)setTimeout(confetti,300)}catch(e){RL.clears=Array.from({length:Math.floor(RL.stampIds.size/PER_CLEAR)},(_,i)=>({clear_no:i+1}))}
  }catch(e){console.warn(e)}
  updateBadges();renderBooths()}
async function loadSubs(){const p=part();if(!LIVE||!p)return RL.subs;
  try{const rows=await rpc('list_purchase_submissions_for_participant',pAuth(p));const all=(rows||[]).map(r=>Object.assign({},r,{status:r.submission_status||'pending',proof_data:null}));RL.all=all;RL.subs=all.filter(r=>!String(r.purchase_message||'').startsWith(DM_MARK))}catch(e){console.warn(e)}
  return RL.subs}
function liveStatus(id){if(RL.stampIds.has(id))return'approved';const s=RL.subs.filter(r=>r.shop_id===id);if(s.some(r=>r.status==='pending'))return'pending';if(s.some(r=>r.status==='rejected'))return'rejected';return'none'}
function readPhoto(file){if(!file)return Promise.resolve({data:null,mime:null});if(!String(file.type).startsWith('image/'))return Promise.reject(new Error('画像ファイルを選んでください'));
  return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error('写真を読み込めませんでした'));fr.onload=()=>{const img=new Image();img.onerror=()=>rej(new Error('写真を読み込めませんでした'));
    img.onload=()=>{const k=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res({data:c.toDataURL('image/jpeg',.72),mime:'image/jpeg'})};img.src=fr.result};fr.readAsDataURL(file)})}
async function submitLive(sh,btn){const item=($('#bt_item').value||'').trim(),no=($('#bt_no').value||'').trim(),msg=($('#bt_msg').value||'').trim(),file=($('#bt_photo')||{}).files&&$('#bt_photo').files[0];
  const st=$('#bt_err');if(!item&&!no&&!file)return st.textContent='買ったもの・注文番号・写真のどれかを入れてください';btn.disabled=true;st.textContent='送信中…';
  try{const p=await ensureParticipant();const ph=await readPhoto(file);
    const text=['🏪マルシェから',item&&'買ったもの：'+item,no&&'注文番号・メモ：'+no,msg&&'ひとこと：'+msg].filter(Boolean).join('／');
    const r=await rpc('submit_purchase_proof',Object.assign(pAuth(p),{p_shop_id:sh.id,p_uw_id:p.uwId||(S.role==='comm'?S.uw:null)||null,p_purchase_message:text,p_purchase_url:null,p_proof_data:ph.data,p_proof_mime:ph.mime}));
    const x=r&&r[0];if(x&&x.ok===false)throw new Error(x.message||'送れませんでした');
    await loadSubs();await loadRally(true);openShop(sh.id);const k=ents.find(e=>e.shopId===sh.id);if(k)say(k,'ありがとうございます！確認しますね');
    toast('📮 お店に送りました！もぐマップのスタンプラリーにも届いています',4500)}
  catch(e){const m=String(e.message||e);st.textContent=m.includes('スタンプラリー')?m.replace(/^.*?(スタンプラリー)/,'$1'):m.includes('already')||m.includes('すでに')?'このお店にはすでに申請済みです':'送れませんでした。少し待ってもう一度お試しください';btn.disabled=false}}
/* ---- お店の人：本物の申請を確認してスタンプを押す ---- */
function shopLogin(){const l=lsGet(LKEY);return l&&l.shopId===S.shopId&&l.pin?l:null}
async function renderShopInbox(){const box=$('#liveInbox');if(!box)return;const l=shopLogin();if(!l){box.innerHTML='<div class="muted">お店のPINで入り直すと、ここで申請を確認できます。</div><button class="btn sub small" data-act="relogin">入り直す</button>';return}
  box.innerHTML='<div class="muted">読み込み中…</div>';
  try{const rows=(await rpc('list_purchase_submissions_for_shop_pin',{p_shop_id:l.shopId,p_shop_pin:l.pin})||[]).map(x=>Object.assign({},x,{id:x.submission_id||x.id,status:x.submission_status||x.status||'pending'}));
    const dms=rows.filter(r=>String(r.purchase_message||'').startsWith(DM_MARK));const app=rows.filter(r=>!String(r.purchase_message||'').startsWith(DM_MARK));const pend=app.filter(r=>r.status==='pending'),done=app.filter(r=>r.status!=='pending').slice(0,10);
    box.innerHTML=`<h3>📮 スタンプ申請（${pend.length}件）</h3>${pend.map(r=>`<div class="req"><b>${esc(r.nickname||'参加者')}</b> さん <span class="muted">${hm(r.created_at)}${r.participant_entry_id?' ・ID '+esc(r.participant_entry_id):''}${r.uw_id?' ・UW '+esc(r.uw_id):''}</span>
      <div class="note" style="white-space:pre-line">${esc(r.purchase_message||'')}</div>${r.purchase_url?`<div class="muted">🔗 ${esc(r.purchase_url)}</div>`:''}${r.proof_data?`<img class="proof" src="${esc(r.proof_data)}" alt="写真">`:''}
      <div class="ra"><button class="btn ok" data-act="lvapprove" data-id="${r.id}">確認OK！スタンプを押す</button><button class="btn sub small" data-act="lvreject" data-id="${r.id}">確認できない</button><button class="btn sub small" data-act="shopthread" data-id="${r.id}">💬 やりとり</button></div></div>`).join('')||'<div class="muted">いまは申請はありません</div>'}
      <h3>💬 メッセージ（${dms.length}件）</h3>${dms.slice(0,15).map(r=>`<div class="req done" style="opacity:1;cursor:pointer" data-act="shopthread" data-id="${r.id}"><b>${esc(r.nickname||'お客様')}</b> さん <span class="muted">${hm(r.created_at)}</span><div class="muted">${esc(String(r.purchase_message||'').replace(DM_MARK,'').slice(0,40))}</div></div>`).join('')||'<div class="muted">メッセージはまだありません</div>'}
      ${done.length?`<h3>対応済み</h3>${done.map(r=>`<div class="req done">${r.status==='approved'?'✅':'⚠️'} ${esc(r.nickname||'')} さん <span class="chip ${r.status==='approved'?'approved':'rejected'}">${r.status==='approved'?'スタンプ済み':'見送り'}</span> <span class="muted">${hm(r.responded_at||r.created_at)}</span></div>`).join('')}`:''}
      <div class="muted" style="margin-top:6px">ここで押したスタンプは、もぐマップのスタンプラリーにもそのまま反映されます。</div>`}
  catch(e){box.innerHTML=`<div class="err">${String(e.message||'').includes('PIN')?'PINが変わったようです。入り直してください':'読み込めませんでした'}</div>`}}
async function resolveLive(id,action,btn){const l=shopLogin();if(!l)return;btn.disabled=true;const msg=action==='approve'?'マルシェで確認しました！ありがとうございます':'確認できませんでした';
  try{const r=await rpc('resolve_purchase_submission',{p_shop_id:l.shopId,p_shop_pin:l.pin,p_submission_id:id,p_action:action,p_response_message:msg});const x=r&&r[0];if(x&&x.ok===false)throw new Error(x.message);
    toast(action==='approve'?'スタンプを押しました！もぐマップにも反映されます':'見送りにしました');renderShopInbox()}catch(e){toast('処理できませんでした');btn.disabled=false}}

async function loadTicker(){if(!LIVE)return;try{RL.ticker=await rpc('mogu_info_ticker',{})}catch(e){}renderTicker()}
function tickerItems(){const out=[],t=RL.ticker||{},p=t.period||{},jd=v=>new Date(v).toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric'});
  if(p.running)out.push(`🎉 スタンプラリー開催中！${p.ends_at?jd(p.ends_at)+'まで':''}`);else if(p.starts_at&&new Date(p.starts_at)>new Date())out.push(`⏳ スタンプラリーは ${jd(p.starts_at)} からスタート！`);
  (t.events||[]).slice(0,3).forEach(e=>out.push(`🎪 ${e.event_date?jd(e.event_date+'T12:00:00+09:00')+' ':''}${e.title||''}${e.event_place?'（'+e.event_place+'）':''}`));
  (t.posts||[]).slice(0,4).forEach(x=>out.push(`${{news:'📢',shop:'🏪',video:'🎬',voice:'💬'}[x.kind]||'📢'} ${x.title||''}`));
  const n=myStamped().size,rest=PER_CLEAR-(n%PER_CLEAR);out.push(`📮 あと${rest}個で${Math.floor(n/PER_CLEAR)+1}クリア！遠くからでも通販でスタンプを集められます`);
  const on=DEFAULT_SHOPS.filter(s=>s.online&&s.rally!==false);if(on.length)out.push(`📦 通販でスタンプOK：${on.map(s=>s.short||s.name).join('・')}`);
  return out}
function renderTicker(){const el=$('#ticker');if(!el)return;const items=tickerItems();el.innerHTML=`<div class="tk-track">${items.concat(items).map(x=>`<span>${esc(x)}</span>`).join('')}</div>`;el.style.setProperty('--dur',Math.max(20,items.length*7)+'s')}
async function loadPosts(){if(!LIVE)return[];if(RL.posts)return RL.posts;try{const r=await rpc('mogu_list_posts',{});RL.posts=Array.isArray(r)?r:[]}catch(e){RL.posts=[]}return RL.posts}

async function loginParticipant(btn){const id=($('#lg_id').value||'').trim(),pin=($('#lg_pin').value||'').trim(),st=$('#lg_err');
  if(!/^\d{5}$/.test(id)||!/^\d{4}$/.test(pin))return st.textContent='参加者ID（5桁）と4桁のあいことばを入れてください';btn.disabled=true;
  try{const x=(await rpc('mogu_login',{p_entry_id:id,p_pin:pin}))[0];if(!x||!x.ok){st.textContent=(x&&x.message)||'ログインできませんでした';return}
    lsSet(PKEY,{id:x.participant_id,token:x.participant_token,nickname:x.nickname||'',entryId:x.entry_id||id});if(!S.name&&x.nickname)S.name=x.nickname;save();
    st.textContent='';toast(`おかえりなさい、${x.nickname||''}さん。もぐマップのスタンプ帳とつながりました`);await loadRally(true);await loadSubs();await profReload();if(S.role&&S.avatar){if(!me)startMe();setMeLabel();renderBooths();closeModal()}else openEntry(!S.role)}
  catch(e){st.textContent='ログインできませんでした'}finally{btn.disabled=false}}

let lastShout=null;
function shoutLines(sh){const out=[];const posts=(RL.posts||[]).filter(x=>x&&x.shop_id===sh.id&&x.title);posts.slice(0,3).forEach(x=>out.push('📣 '+x.title));
  if(sh.menu&&sh.menu.length){const m=pick(sh.menu);out.push(`${m.emoji} ${m.name} ${yen(m.price)} 売ってます！`)}
  const d=String(sh.desc||'').split(/[\n。！!]/).map(x=>x.trim()).filter(x=>x.length>=4&&x.length<=26);if(d.length)out.push(pick(d));
  if(sh.online)out.push('📦 通販で買ってもスタンプOK！');if(sh.buy)out.push('🌐 ネットでも買えます！');
  return out}
function shout(){const list=allShops().filter(s=>LOTS[s.lot]&&s.id!==lastShout);if(!list.length)return;const sh=pick(list);const lines=shoutLines(sh);if(!lines.length)return;lastShout=sh.id;
  const pill=world.querySelector(`.bname[data-shop="${sh.id}"]`)||world.querySelector(`.booth[data-shop="${sh.id}"]`);if(!pill)return;

    if(e.pet){if(Math.random()<.3&&!e.el.classList.contains('walking')){const p=randWalk(true);walkTo(e,p[0],p[1])}if(Math.random()<.03)say(e,e.pet==='dog'?pick(['ワン！','ワンワン🐾','くぅ〜ん']):pick(['にゃ〜','にゃん🐾','ごろごろ…']));return}
    if(e.other||e.off||e.busy>now)return;
    if(Math.random()<.2&&!e.el.classList.contains('walking')){const p=randWalk();walkTo(e,p[0],p[1])}
    if(Math.random()<.006){const t=pick(NPC_TALK);say(e,t);logChat(e.name,t)}});
    if(Math.random()<.04){const list=npcs();const a=pick(list);const b=list.filter(x=>x!==a&&!x.el.classList.contains('walking')).sort((x,y)=>Math.hypot(x.x-a.x,x.y-a.y)-Math.hypot(y.x-a.x,y.y-a.y))[0];
      if(a&&b&&Math.hypot(a.x-b.x,a.y-b.y)<260){const pr=pick(NPC_PAIRS);a.busy=b.busy=now+6000;a.tx=a.x;a.ty=a.y;a.el.classList.remove('walking');say(a,pr[0]);logChat(a.name,pr[0]);setTimeout(()=>{say(b,pr[1]);logChat(b.name,pr[1])},1600)}}
  },1200)}
load();buildBg();renderBooths();fit();startNPCs();startPets();updateBadges();
window.addEventListener('resize',()=>{fit();follow(1)});
requestAnimationFrame(tick);
function boot(){if(!S.role&&autoFromMogu()){if(!me)startMe();setTimeout(()=>toast(`もぐマップの登録で入りました（${ROLE[S.role][1]}）。キャラは👤マイページで変えられます`,5000),700);return}if(!S.role){if(S.avatar)startMe();openEntry(true)}else if(S.avatar)startMe();else openAvatar(true)}
readRef();cloudInit();
if(S.avatar)boot();else{let done=false;restoreAvatar(b=>{if(done)return;done=true;S.avatar=normalize(b.avatar);if(!S.name)S.name=b.name||'';if(!S.role&&b.role){S.role=b.role;S.uw=b.uw||'';S.shopId=b.shopId||''}save();boot();toast('前に作ったキャラで入りました')});setTimeout(()=>{if(!done){done=true;boot()}},400)}
loadLive().then(async()=>{liveUI();if(!LIVE){renderTicker();return}mpConnect();loadPosts();profLoad();await loadRally(true);await loadSubs();loadTicker();setInterval(()=>loadRally(),60*1000);setInterval(()=>{if(RL.subs.some(r=>r.status==='pending'))loadSubs().then(()=>loadRally())},3*60*1000);setInterval(loadTicker,10*60*1000)});setInterval(()=>{if(LIVE)loadLive()},10*60*1000);
})();
