<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a43">
<title>MOGU RALLY｜スタンプラリー</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--navy:#102a43;--blue:#1f6f8b;--mint:#b8f2e6;--lime:#d8f3a5;--orange:#ffb703;--cream:#fffaf0;--ink:#162433;--muted:#6c7a89;--line:#dbe4ea;--white:#fff;--danger:#c3423f;--shadow:0 18px 45px rgba(16,42,67,.12)}
*{box-sizing:border-box}html{background:var(--cream)}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;padding-bottom:90px}button,input,textarea,select{font:inherit}button{cursor:pointer}.topbar{position:sticky;top:0;z-index:20;background:rgba(255,250,240,.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(219,228,234,.8)}.topbar-inner{max-width:1080px;margin:auto;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:15px}.wordmark{font-weight:950;letter-spacing:.08em;color:var(--navy)}.wordmark span{color:var(--orange)}.top-link{color:var(--muted);font-size:12px;text-decoration:none}.wrap{max-width:1080px;margin:auto;padding:18px}.hero{background:var(--navy);color:#fff;border-radius:28px;padding:26px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-55px;top:-70px;background:var(--orange);opacity:.9}.hero:before{content:"";position:absolute;width:120px;height:120px;border-radius:35px;right:90px;bottom:-85px;background:var(--mint);transform:rotate(20deg);opacity:.8}.eyebrow{font-size:12px;letter-spacing:.12em;opacity:.75;font-weight:800}.hero h1{font-size:clamp(28px,6vw,52px);line-height:1.12;margin:10px 0 8px;max-width:720px;position:relative;z-index:1}.hero p{margin:0;max-width:650px;color:#dcebf5;line-height:1.75;position:relative;z-index:1}.hero-grid{display:grid;grid-template-columns:1fr 220px;gap:18px;align-items:end}.progress-box{position:relative;z-index:1;background:#fff;color:var(--ink);border-radius:20px;padding:16px}.progress-box strong{font-size:30px;color:var(--navy)}.progress-track{height:9px;background:#eaf0f3;border-radius:99px;overflow:hidden;margin-top:10px}.progress-track div{height:100%;background:linear-gradient(90deg,var(--orange),var(--lime));border-radius:99px}.panel{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 10px 28px rgba(16,42,67,.06);margin-top:16px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 14px}.section-title h2{font-size:20px;margin:0}.muted{color:var(--muted);font-size:13px;line-height:1.7}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 13px;white-space:nowrap;font-weight:800;color:var(--muted)}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}.button{border:0;border-radius:13px;padding:12px 16px;font-weight:900;background:var(--navy);color:#fff}.button.orange{background:var(--orange);color:var(--navy)}.button.mint{background:var(--mint);color:var(--navy)}.button.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}.button.small{padding:9px 12px;font-size:12px}.button:disabled{opacity:.45;cursor:not-allowed}.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick{border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px 10px;text-align:left;color:var(--ink);min-height:85px}.quick b{display:block;font-size:23px;margin-bottom:7px}.quick span{font-size:12px;font-weight:900}.store-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.store-card{border:1px solid var(--line);border-radius:18px;padding:15px;background:#fff;position:relative}.store-card.got{background:linear-gradient(135deg,#f3fff5,#fff);border-color:#9dd7b0}.store-number{font-size:11px;color:var(--muted);font-weight:900}.store-card h3{font-size:17px;margin:5px 0}.store-card p{margin:5px 0;font-size:12px;color:var(--muted);line-height:1.55}.status-pill{position:absolute;right:12px;top:12px;border-radius:99px;padding:5px 8px;font-size:11px;font-weight:900;background:#eef3f6;color:var(--muted)}.got .status-pill{background:var(--lime);color:#385424}.tag{display:inline-flex;border-radius:99px;padding:5px 8px;font-size:11px;font-weight:900;background:var(--mint);color:var(--navy)}.store-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.reward{background:linear-gradient(135deg,var(--navy),#235b72);color:#fff;border-radius:22px;padding:24px;position:relative;overflow:hidden}.reward:after{content:"🎁";position:absolute;right:20px;bottom:12px;font-size:70px;opacity:.25}.reward h2{font-size:28px;margin:8px 0}.reward p{line-height:1.75;color:#d9edf2;max-width:580px}.complete-code{display:inline-block;background:#fff;color:var(--navy);font-weight:950;letter-spacing:.12em;border-radius:12px;padding:11px 14px}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.form{display:grid;gap:12px}.field{display:grid;gap:6px;font-weight:800;font-size:13px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--ink)}.field textarea{min-height:90px;resize:vertical}.join{max-width:600px;margin:20px auto}.join-mark{font-size:48px}.join h2{font-size:26px;margin:5px 0}.notice{background:#fff7da;border:1px solid #f0d88d;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.65}.scan-card{border:2px solid var(--orange);background:#fff9e8}.scan-card h2{margin:4px 0 8px}.map{height:430px;border-radius:17px;overflow:hidden;background:#edf2f3}.leaflet-popup-content{font-family:inherit}.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px max(8px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr)}.nav-btn{border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:900;padding:5px 2px}.nav-btn b{display:block;font-size:21px;margin-bottom:3px}.nav-btn.on{color:var(--navy)}.nav-btn.on b{filter:drop-shadow(0 3px 5px rgba(255,183,3,.45))}.view{display:none}.view.on{display:block}.modal{position:fixed;inset:0;background:rgba(16,42,67,.58);z-index:80;display:none;align-items:flex-end;justify-content:center}.modal.on{display:flex}.sheet{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:22px}.close{float:right;border:0;border-radius:50%;background:#eef3f6;color:var(--navy);width:38px;height:38px;font-size:20px}.success{border:2px solid #9dd7b0;background:#f2fff5}.success-mark{font-size:58px}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);z-index:120;background:var(--navy);color:#fff;border-radius:99px;padding:11px 16px;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.loading{padding:30px;text-align:center;color:var(--muted)}.token{font-family:ui-monospace,monospace;background:#eef3f6;padding:8px 10px;border-radius:10px;font-size:12px;word-break:break-all}.benefit{background:#f7fbf1;border:1px solid #dcebbd;border-radius:12px;padding:10px;font-size:13px;line-height:1.6}@media(max-width:720px){.wrap{padding:12px}.hero{padding:22px 18px;border-radius:23px}.hero-grid{grid-template-columns:1fr}.progress-box{max-width:260px}.quick-grid{grid-template-columns:repeat(2,1fr)}.store-grid{grid-template-columns:1fr}.panel{padding:16px}.map{height:350px}}@media(min-width:900px){.bottom-nav{max-width:650px;left:50%;right:auto;transform:translateX(-50%);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0}.toast{bottom:110px}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><div class="wordmark">MOGU <span>RALLY</span></div><a class="top-link" href="./admin.html">主催者管理</a></div></header>
<main class="wrap">
  <section id="hero" class="hero"><div class="loading">ラリーを読み込んでいます…</div></section>
  <section id="scanArea"></section>
  <section id="joinArea"></section>
  <div id="appArea" hidden>
    <section class="view on" id="view-home"></section>
    <section class="view" id="view-book"></section>
    <section class="view" id="view-map"></section>
    <section class="view" id="view-reward"></section>
    <section class="view" id="view-me"></section>
  </div>
</main>
<nav id="bottomNav" class="bottom-nav" hidden>
  <button class="nav-btn on" data-view="home"><b>⌂</b>ホーム</button>
  <button class="nav-btn" data-view="book"><b>🎫</b>スタンプ帳</button>
  <button class="nav-btn" data-view="map"><b>🗺</b>MAP</button>
  <button class="nav-btn" data-view="reward"><b>🎁</b>特典</button>
  <button class="nav-btn" data-view="me"><b>●</b>マイページ</button>
</nav>
<div id="modal" class="modal"><div class="sheet"><button class="close" id="closeModal">×</button><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>
<script src="./config.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CFG=window.MOGU_CONFIG||{};const SB=CFG.supabaseUrl,KEY=CFG.publishableKey;
const H={apikey:KEY,'Content-Type':'application/json'};let accessToken='',rally=null,stores=[],progress=null,currentView='home',map=null,markerLayer=null,pendingScan=null;
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const params=new URLSearchParams(location.search),requestedSlug=params.get('rally')||'',via=(params.get('via')||'qr').toLowerCase();
function tokenKey(){return 'mogu-rally-token:'+((rally&&rally.slug)||requestedSlug)}
function getToken(){try{return localStorage.getItem(tokenKey())||''}catch(e){return''}}
function setToken(v){try{localStorage.setItem(tokenKey(),v)}catch(e){}}
function showToast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
async function api(path,opt={}){const r=await fetch(SB+'/rest/v1/'+path,{...opt,headers:{...H,...(opt.headers||{})}});const t=await r.text();if(!r.ok)throw Error(t||'通信に失敗しました');return t?JSON.parse(t):null}
async function rpc(name,body){const headers={...H};if(accessToken)headers.Authorization='Bearer '+accessToken;const r=await fetch(SB+'/rest/v1/rpc/'+name,{method:'POST',headers,body:JSON.stringify(body)});const t=await r.text();if(!r.ok)throw Error(t||'処理に失敗しました');return t?JSON.parse(t):null}
function reasonText(x){return({rally_not_found:'ラリーが見つかりません',participant_not_found:'参加情報が見つかりません',invalid_code:'認証情報を確認できませんでした',store_not_found:'店舗情報が見つかりません',already_stamped:'この店舗はすでに取得済みです',request_pending:'この店舗は確認待ちです',completion_pending:'3個達成の主催者確認待ちです',insufficient_stamps:'必要なスタンプ数がまだ集まっていません',evidence_required:'購入内容または購入履歴を入力してください',nickname_required:'ニックネームを入力してください',auth_required:'管理者ログインが必要です'})[x]||'処理できませんでした'}
async function loadRally(){let rows;if(requestedSlug){rows=await api('mogu_rallies?select=id,slug,title,description,status,starts_at,ends_at,required_stamps,reward_title,reward_description&status=eq.active&slug=eq.'+encodeURIComponent(requestedSlug)+'&limit=1')}else{rows=await api('mogu_rallies?select=id,slug,title,description,status,starts_at,ends_at,required_stamps,reward_title,reward_description&status=eq.active&order=created_at.desc&limit=1')}if(!rows||!rows[0]){rally=null;renderNoRally();return}rally=rows[0];stores=await api('mogu_rally_stores?select=id,name,address,prefecture,city,category,description,latitude,longitude,benefit_title,benefit_description,sort_order&rally_id=eq.'+rally.id+'&is_active=eq.true&order=sort_order.asc,name.asc');pendingScan=params.get('store')?{storeId:params.get('store'),code:params.get('code')||'',via:via==='nfc'?'nfc':'qr'}:null;const t=getToken();if(t)await loadProgress(t);render()}
async function loadProgress(t){try{const x=await rpc('mogu_get_progress',{p_rally_slug:rally.slug,p_participant_token:t});if(x&&x.ok){if(x.next_participant_token&&x.next_participant_token!==t){setToken(x.next_participant_token);return loadProgress(x.next_participant_token)}progress=x}else{try{localStorage.removeItem(tokenKey())}catch(e){}}}catch(e){console.warn(e)}}
function renderNoRally(){$('hero').innerHTML='<div class="eyebrow">MOGU RALLY</div><h1>参加するラリーを<br>選んでください</h1><p>主催者から届いたラリーURLを開くと、ここにスタンプ帳が表示されます。</p>';$('joinArea').innerHTML='<div class="panel notice">現在公開中のスタンプラリーがありません。URLの「?rally=ラリー名」を確認してください。</div>'}
function render(){if(!rally)return;const got=(progress&&progress.stamps)||[],total=stores.length,required=rally.required_stamps||total,count=got.length,rate=required?Math.min(100,Math.round(count/required*100)):0;$('hero').innerHTML='<div class="hero-grid"><div><div class="eyebrow">MOGU RALLY / '+esc(rally.slug)+'</div><h1>'+esc(rally.title)+'</h1><p>'+esc(rally.description||'店舗を巡って、スタンプを集めよう。')+'</p></div><div class="progress-box"><div class="muted">あなたの進み具合</div><strong>'+count+' <small>/ '+required+'</small></strong><div class="progress-track"><div style="width:'+rate+'%"></div></div><div class="muted" style="margin-top:7px">'+(progress?'参加中：'+esc(progress.nickname):'まずは参加登録')+'</div></div></div>';
if(pendingScan){$('scanArea').innerHTML='<div class="panel scan-card"><div class="eyebrow">SCAN DETECTED</div><h2>'+(pendingScan.via==='nfc'?'📳 NFCタッチ':'📷 QRコード')+'を受け取りました</h2><p class="muted">参加登録後、店舗側へ確認依頼を送り、承認されるとスタンプが反映されます。</p></div>'}else{$('scanArea').innerHTML=''}
if(!progress){$('joinArea').innerHTML='<section class="panel join"><div class="join-mark">🎟️</div><h2>このラリーに参加する</h2><p class="muted">ニックネームだけで参加できます。本名は不要です。</p><form id="joinForm" class="form"><label class="field">ニックネーム<input id="nickname" maxlength="40" placeholder="例：りーたん" required></label><button class="button orange">スタンプ帳を作る</button></form></section>';$('appArea').hidden=true;$('bottomNav').hidden=true;return}
$('joinArea').innerHTML='';$('appArea').hidden=false;$('bottomNav').hidden=false;renderViews();if(pendingScan)processScan()}
function completionBlock(){const report=progress.completion_report||{};if(!progress.complete)return '<div class="panel notice">あと '+Math.max(0,(progress.required_stamps||0)-(progress.stamp_count||0))+'個のスタンプで主催者へ報告できます。</div>';if(report.status==='pending')return '<div class="panel notice"><b>3個達成・主催者確認待ち</b><p>主催者が報酬対象を確認しています。確認後、次のスタンプラリーが自動で再発行されます。</p></div>';if(report.status==='rejected')return '<div class="panel notice"><b>確認が必要です</b><p>主催者から確認メッセージがあります。内容を確認して、もう一度報告できます。</p><p>'+esc(report.review_note||'')+'</p><button class="button orange" onclick="reportCompletion()">もう一度報告する</button></div>';return '<div class="reward"><div class="eyebrow">3 STAMPS COMPLETE</div><h2>3個集まりました</h2><p>スタンプ帳の内容を確認して、主催者へ報告してください。</p><button class="button orange" onclick="reportCompletion()">主催者へ報告する</button></div>'}
async function reportCompletion(){try{const x=await rpc('mogu_report_completion',{p_rally_slug:rally.slug,p_participant_token:getToken(),p_report_note:''});if(!x.ok)throw Error(x.reason);await loadProgress(getToken());render();showToast('主催者へ報告しました')}catch(e){showToast(reasonText(e.message))}}
function pendingForStore(id){return (progress.pending_requests||[]).some(r=>r.store_id===id)}
function renderViews(){const got=new Set((progress.stamps||[]).map(s=>s.id));const required=progress.required_stamps||rally.required_stamps||stores.length;const next=stores.find(s=>!got.has(s.id)&&!pendingForStore(s.id));const waiting=stores.filter(s=>!got.has(s.id)&&pendingForStore(s.id)).length;$('view-home').innerHTML='<div class="panel"><div class="section-title"><h2>次におすすめ</h2><span class="tag">'+got.size+' / '+required+'</span></div>'+(next?storeCard(next,got,false,true):waiting?'<div class="panel notice">店舗確認待ちが '+waiting+'件あります。承認されるとスタンプ帳に反映されます。</div>':completionBlock())+'</div><div class="panel"><div class="section-title"><h2>すぐできること</h2></div><div class="quick-grid"><button class="quick" onclick="switchView(&quot;book&quot;)"><b>🎫</b><span>スタンプ帳</span></button><button class="quick" onclick="switchView(&quot;map&quot;)"><b>🗺</b><span>MAPを見る</span></button><button class="quick" onclick="switchView(&quot;reward&quot;)"><b>🎁</b><span>特典・達成報告</span></button><button class="quick" onclick="switchView(&quot;me&quot;)"><b>●</b><span>参加情報</span></button></div></div><div class="panel"><div class="section-title"><h2>楽しみ方</h2></div><p class="muted">店舗のNFCタグにスマホをタッチ、またはQRコードを読み取ると、店舗へ確認依頼が届きます。店舗側が承認するとスタンプが反映されます。遠隔参加は購入内容を送信し、店舗側の確認後に反映されます。</p></div>';
$('view-book').innerHTML='<div class="panel"><div class="section-title"><h2>スタンプ帳</h2><span class="muted">'+got.size+' / '+required+'</span></div><div class="store-grid">'+stores.map(s=>storeCard(s,got,got.has(s.id),false)).join('')+'</div></div>';
$('view-map').innerHTML='<div class="panel"><div class="section-title"><h2>MAP</h2><span class="muted">参加店舗 '+stores.length+'件</span></div><div id="map" class="map"></div></div>';
$('view-reward').innerHTML='<div class="panel"><div class="section-title"><h2>特典・達成報告</h2><span class="tag">'+(progress.completion_report?.status||'進行中')+'</span></div>'+(progress.last_reward_code?'<div class="benefit"><b>前回の報酬確認コード</b><br><span class="token">'+esc(progress.last_reward_code)+'</span></div>':'')+completionBlock()+'</div>';
$('view-me').innerHTML='<div class="panel"><div class="section-title"><h2>マイページ</h2></div><p class="muted">この端末の参加情報です。ブラウザのデータを消すと復元できない場合があります。</p><div class="field"><span>ニックネーム</span><div class="token">'+esc(progress.nickname)+'</div></div><div class="field" style="margin-top:12px"><span>参加トークン</span><div class="token">'+esc(getToken())+'</div></div><div class="field" style="margin-top:12px"><span>周回</span><div class="token">'+esc(progress.cycle_no||1)+'周目</div></div><div class="store-actions"><button class="button ghost small" onclick="copyText(getToken())">参加情報をコピー</button><button class="button ghost small" onclick="resetParticipant()">この端末の参加情報を削除</button></div></div>';
if(currentView==='map')setTimeout(initMap,50)}
function storeCard(s,got,isGot,compact){const pending=pendingForStore(s.id);return'<article class="store-card '+(isGot?'got':pending?'pending':'')+'"><span class="store-number">STORE '+String((stores.indexOf(s)+1)).padStart(2,'0')+'</span><span class="status-pill">'+(isGot?'取得済み':pending?'承認待ち':'未取得')+'</span><h3>'+esc(s.name)+'</h3><p>📍 '+esc(s.address||s.city||'')+'</p>'+(s.benefit_title?'<div class="benefit"><b>'+esc(s.benefit_title)+'</b><br>'+esc(s.benefit_description||'')+'</div>':'')+'<div class="store-actions">'+(isGot?'<button class="button mint small" onclick="openStore(&quot;'+s.id+'&quot;)">特典を見る</button>':pending?'<span class="tag">店舗確認待ち</span>':'<button class="button ghost small" onclick="openStore(&quot;'+s.id+'&quot;)">店舗詳細</button>'+(compact?'<button class="button orange small" onclick="openStore(&quot;'+s.id+'&quot;)">参加する</button>':'') )+'</div></article>'}
function switchView(name){currentView=name;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='view-'+name));document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('on',x.dataset.view===name));if(name==='map')setTimeout(initMap,50);window.scrollTo({top:0,behavior:'smooth'})}
function initMap(){const el=$('map');if(!el||!window.L)return;if(map){map.remove();map=null}map=L.map(el).setView([36.2,138.2],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);markerLayer=L.layerGroup().addTo(map);const points=[];stores.forEach((s,i)=>{if(!Number.isFinite(Number(s.latitude))||!Number.isFinite(Number(s.longitude)))return;const marker=L.marker([Number(s.latitude),Number(s.longitude)]).addTo(markerLayer);marker.bindPopup('<b>'+esc(s.name)+'</b><br>'+esc(s.address||'')+'<br><button class="button small orange" onclick="openStore(&quot;'+s.id+'&quot;)">店舗を見る</button>');points.push([Number(s.latitude),Number(s.longitude)])});if(points.length)map.fitBounds(points,{padding:[20,20],maxZoom:12})}
function openStore(id){const s=stores.find(x=>x.id===id);if(!s)return;const isGot=(progress.stamps||[]).some(x=>x.id===id),pending=pendingForStore(id);$('modalBody').innerHTML='<div class="eyebrow">STORE DETAIL</div><h2>'+esc(s.name)+'</h2><p class="muted">📍 '+esc(s.address||'')+'</p><p>'+esc(s.description||'この店舗でスタンプを集められます。')+'</p>'+(s.benefit_title?'<div class="benefit"><b>🎁 '+esc(s.benefit_title)+'</b><br>'+esc(s.benefit_description||'')+'</div>':'')+'<div class="store-actions">'+(isGot?'<span class="tag">スタンプ取得済み</span>':pending?'<span class="tag">店舗確認待ち</span>':'<button class="button orange" onclick="showRemoteForm(&quot;'+s.id+'&quot;)">遠隔参加を申請</button>')+'<button class="button ghost" onclick="closeModal()">閉じる</button></div>';openModal()}
function showRemoteForm(id){const s=stores.find(x=>x.id===id);$('modalBody').innerHTML='<div class="eyebrow">REMOTE STAMP</div><h2>'+esc(s.name)+'への遠隔申請</h2><p class="muted">コミュニティから購入した画面の内容を貼り付けるか、購入履歴ページのURLを入力してください。店舗確認後にスタンプが反映されます。</p><form id="remoteForm" class="form"><label class="field">購入・利用内容<textarea id="remoteNote" required placeholder="例：商品名／購入日／注文番号など"></textarea></label><label class="field">購入画面・履歴の内容<textarea id="remoteEvidence" placeholder="購入画面の文字をコピーして貼り付け"></textarea></label><label class="field">購入履歴ページURL（任意）<input id="remoteUrl" type="url" placeholder="https://..."></label><button class="button orange">店舗へ確認依頼を送る</button></form>';openModal();$('remoteForm').onsubmit=async e=>{e.preventDefault();try{const x=await rpc('mogu_create_remote_request',{p_rally_slug:rally.slug,p_participant_token:getToken(),p_store_id:id,p_note:$('remoteNote').value.trim(),p_evidence_text:$('remoteEvidence').value.trim(),p_evidence_url:$('remoteUrl').value.trim()});if(!x.ok)throw Error(x.reason);closeModal();await loadProgress(getToken());render();showToast('購入内容を店舗へ送りました。確認後にスタンプが反映されます')}catch(err){showToast(reasonText(err.message))}}}
async function processScan(){if(!pendingScan||!progress)return;const scan=pendingScan;pendingScan=null;try{const x=await rpc('mogu_claim_stamp',{p_rally_slug:rally.slug,p_participant_token:getToken(),p_store_id:scan.storeId,p_code:scan.code,p_method:scan.via});if(!x.ok)throw Error(x.reason);await loadProgress(getToken());render();$('modalBody').innerHTML='<div class="success"><div class="success-mark">'+(scan.via==='nfc'?'📳':'📷')+'</div><div class="eyebrow">REQUEST SENT</div><h2>'+esc(x.store&&x.store.name||'店舗')+'へ確認依頼を送りました</h2><p class="muted">店舗側が購入・利用を確認して承認すると、スタンプ帳に反映されます。</p><button class="button orange" onclick="closeModal()">確認しました</button></div>';openModal()}catch(e){$('modalBody').innerHTML='<div class="notice"><h2>確認依頼を送れませんでした</h2><p>'+esc(reasonText(e.message))+'</p><button class="button ghost" onclick="closeModal()">閉じる</button></div>';openModal()}}
function openModal(){$('modal').classList.add('on')}function closeModal(){$('modal').classList.remove('on')}
function copyText(v){navigator.clipboard?.writeText(v).then(()=>showToast('コピーしました')).catch(()=>showToast('コピーできませんでした'))}
function resetParticipant(){if(confirm('この端末の参加情報を削除しますか？')){localStorage.removeItem(tokenKey());location.reload()}}
$('closeModal').onclick=closeModal;$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});$('bottomNav').addEventListener('click',e=>{const b=e.target.closest('.nav-btn');if(b)switchView(b.dataset.view)});document.addEventListener('submit',async e=>{if(e.target.id!=='joinForm')return;e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const x=await rpc('mogu_start_rally',{p_rally_slug:rally.slug,p_nickname:$('nickname').value.trim()});if(!x.ok)throw Error(x.reason);setToken(x.participant_token);await loadProgress(x.participant_token);render()}catch(err){showToast(reasonText(err.message));b.disabled=false}});
loadRally().catch(e=>{$('hero').innerHTML='<div class="notice">読み込みに失敗しました。時間をおいて再度お試しください。</div>';console.error(e)});
</script>
