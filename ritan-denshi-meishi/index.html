<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#81D8D0"><title>りーたん電子名刺</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6fffd}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent}</style></head><body><iframe id="card" src="base.html?v=layout-20260831-1" allow="autoplay; clipboard-write; web-share"></iframe><script>function enhanceCard(){if(window.__ritanLayoutV1)return;window.__ritanLayoutV1=true;function css(){if(document.getElementById('ritanLayoutCss'))return;let s=document.createElement('style');s.id='ritanLayoutCss';s.textContent='#links{margin-top:13px!important}.links .link{transition:.2s ease;box-shadow:0 5px 14px rgba(41,65,75,.08)}.links .link:active{transform:scale(.98)}.links .purchaseCta{grid-column:1/-1!important;min-height:66px!important;display:flex!important;align-items:center!important;justify-content:center!important;text-align:center!important;font-size:17px!important;font-weight:900!important;color:#fff!important;border:2px solid rgba(255,255,255,.9)!important;background:linear-gradient(135deg,#df6696,#81d8d0)!important;box-shadow:0 10px 24px rgba(223,102,150,.25)!important;position:relative;overflow:hidden}.links .purchaseCta:before{content:"🛒";font-size:22px;margin-right:8px}.links .purchaseCta:after{content:"タップして購入ページへ";display:block;position:absolute;left:0;right:0;bottom:5px;font-size:9px;font-weight:700;opacity:.9}.storyToggle{width:100%;border:1px solid #dfe9ec;border-radius:15px;padding:12px 14px;background:linear-gradient(135deg,#fff,#effffc,#fff0f6);color:#29414b;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px}.storyToggle .arrow{transition:.25s}.storyToggle[aria-expanded="true"] .arrow{transform:rotate(180deg)}#storyText.storyCollapsed{display:none!important}#storyText.storyOpen{displ ryCollapsed')}}css();placeLinks();storyToggle();let oldRender=window.render;if(typeof oldRender==='function'){window.render=function(){oldRender();css();placeLinks();storyToggle()}}setTimeout(()=>{placeLinks();storyToggle()},500);setTimeout(()=>{placeLinks();storyToggle()},1500)}let f=document.getElementById('card');f.addEventListener('load',()=>{try{f.contentWindow.eval('('+enhanceCard.toString()+')()')}catch(e){console.error(e)}});</script></body></html>
