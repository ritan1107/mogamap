<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#81D8D0"><title>りーたん電子名刺</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6fffd}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent}</style></head><body><iframe id="card" src="base.html" allow="autoplay; clipboard-write; web-share"></iframe><script>function installEffects(){if(window.__cardEffectsV2)return;window.__cardEffectsV2=true;function defaults(){return{effectGoldRing:true,effectType:location.pathname.includes('ritan-denshi-meishi')?'sakura':'sparkle',effectAmount:7,effectSpeed:5,effectOpacity:.45}}function initDefaults(){let d=defaults();for(let k in d)if(P[k]===undefined)P[k]=d[k]}function styles(){if(document.getElementById('cardEffectsCss'))return;let s=document.createElement('style');s.id='cardEffectsCss';s.textContent='.av.fxGold::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:9;background:conic-gradient(from 0deg,transparent 0 72%,rgba(255,255,255,.15) 77%,#fff7c7 82%,#ffd45c 87%,#fff 91%,transparent 97%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));filter:drop-shadow(0 0 5px #ffd35a) drop-shadow(0 0 11px #fff0a0);animation:fxGoldSweep 5.2s linear infinite}@keyframes fxGoldSweep{0%,67%{transform:rotate(0);opacity:0}72%{opacity:1}90%{transform:rotate(360deg);opacity:1}96%,100%{transform:rotate(390deg);opacity:0}}#fallFxLayer{position:fixed;inset:0;z-index:25;pointer-events:none;overflow:hidden}.fallFxItem{position:absolute;top:-12vh;animation:fxFall linear infinite;will-change:transform;filter:drop-shadow(0 2px 3px rgba(0,0,0,.08))}@keyframes fxFall{from{transform:translate3d(0,-10vh,0) rotate(0deg)}to{transform:translate3d(var(--drift),115vh,0) rotate(var(--rot))}}';document.head.appendChild(s)}function apply(){initDefaults();styles();let av=document.querySelector('.av');if(av)av.classList.toggle('fxGold',!!P.effectGoldRing);document.querySelectorAll('.fx .star,.fx .petal').forEach(e=>e.style.display='none');let layer=document.getElementById('fallFxLayer');if(!layer){layer=document.createElement('div');layer.id='fallFxLayer';document.body.appendChild(layer)}layer.innerHTML='';let map={snow:['❄️','❅','❄️'],sakura:['🌸','🌸','✿'],sparkle:['✨','✦','✧'],music:['♩','♪','♫'],heart:['♡','♥','♡'],food:['🍴','🍴','✦']};let a=map[P.effectType];if(!a||P.effectType==='none')return;let n=Math.max(3,Math.min(20,+P.effectAmount||7)),sp=Math.max(1,Math.min(10,+P.effectSpeed||5)),op=Math.max(.2,Math.min(1,+P.effectOpacity||.45)),base=16-sp;for(let i=0;i<n;i++){let e=document.createElement('span');e.className='fallFxItem';e.textContent=a[i%a.length];let dur=base*(.8+Math.random()*.55);e.style.left=(Math.random()*100)+'vw';e.style.fontSize=(12+Math.random()*11)+'px';e.style.opacity=String(op*(.7+Math.random()*.3));e.style.animationDuration=dur+'s';e.style.animationDelay=(-Math.random()*dur)+'s';e.style.setProperty('--drift',(-8+Math.random()*16)+'vw');e.style.setProperty('--rot',(-280+Math.random()*560)+'deg');layer.appendChild(e)}}let oldRender=render;render=function(){oldRender();apply()};let oldMenu=menu;menu=function(){oldMenu();let m=B.querySelector('.menu');if(m&&!document.getElementById('effectEditBtn')){let b=document.createElement('button');b.id='effectEditBtn';b.className='choice wide';b.innerHTML='<span>✨</span>エフェクト編集<small>金色リング・雪・桜・キラキラ・音符・ハート・🍴</small>';m.appendChild(b);b.onclick=effectEditor}};function effectEditor(){initDefaults();B.innerHTML='<button class="btn dark" id="fxback">← 戻る</button><h2>✨ エフェクト編集</h2><div class="group"><b>⭕ プロフィール円</b><label class="toggle">金色の光が一瞬、円に沿って走る<input id="fxgold" type="checkbox" '+(P.effectGoldRing?'checked':'')+'></label><p class="hint">常に光るのではなく、数秒おきに一瞬だけ光ります。</p></div><div class="group"><b>🌸 上から少し降るエフェクト</b><label>種類</label><select id="fxtype"><option value="none">なし</option><option value="snow">❄️ 雪</option><option value="sakura">🌸 桜</option><option value="sparkle">✨ キラキラ</option><option value="music">♩ 音符</option><option value="heart">♡ ハート</option><option value="food">🍴 食事</option></select><div class="range"><span>量</span><input id="fxamount" type="range" min="3" max="20" value="'+P.effectAmount+'"><b id="fxamountv">'+P.effectAmount+'</b></div><div class="range"><span>速さ</span><input id="fxspeed" type="range" min="1" max="10" value="'+P.effectSpeed+'"><b id="fxspeedv">'+P.effectSpeed+'</b></div><div class="range"><span>透明度</span><input id="fxopacity" type="range" min=".2" max="1" step=".05" value="'+P.effectOpacity+'"><b id="fxopacityv">'+Math.round(P.effectOpacity*100)+'%</b></div></div><button class="btn" id="fxsave">☁️ エフェクトを保存</button>';$('fxtype').value=P.effectType||'none';$('fxback').onclick=menu;let preview=function(){P.effectGoldRing=$('fxgold').checked;P.effectType=$('fxtype').value;P.effectAmount=+$('fxamount').value;P.effectSpeed=+$('fxspeed').value;P.effectOpacity=+$('fxopacity').value;$('fxamountv').textContent=P.effectAmount;$('fxspeedv').textContent=P.effectSpeed;$('fxopacityv').textContent=Math.round(P.effectOpacity*100)+'%';apply()};['fxgold','fxtype','fxamount','fxspeed','fxopacity'].forEach(id=>$(id).oninput=preview);$('fxsave').onclick=async function(){try{preview();await save();toast('エフェクトを保存しました');menu()}catch(e){alert(e.message)}}}let typeDefaults=function(){return{nameSize:32,nameColor:'',nameWeight:900,nameAlign:'center',headingSize:17,headingColor:'',headingWeight:800,headingAlign:'left',bodySize:13,bodyColor:'',bodyWeight:400,bodyAlign:'left',bodyLineHeight:1.9,buttonSize:12,buttonColor:'',buttonWeight:900,buttonAlign:'center'}};function initType(){let d=typeDefaults();for(let k in d)if(P[k]===undefined)P[k]=d[k]}function applyType(){initType();let root=document.documentElement.style;root.setProperty('--ty-name-size',P.nameSize+'px');root.setProperty('--ty-name-color',P.nameColor||'inherit');root.setProperty('--ty-name-weight',P.nameWeight);root.setProperty('--ty-name-align',P.nameAlign);root.setProperty('--ty-heading-size',P.headingSize+'px');root.setProperty('--ty-heading-color',P.headingColor||'inherit');root.setProperty('--ty-heading-weight',P.headingWeight);root.setProperty('--ty-heading-align',P.headingAlign);root.setProperty('--ty-body-size',P.bodySize+'px');root.setProperty('--ty-body-color',P.bodyColor||'inherit');root.setProperty('--ty-body-weight',P.bodyWeight);root.setProperty('--ty-body-align',P.bodyAlign);root.setProperty('--ty-body-line',P.bodyLineHeight);root.setProperty('--ty-button-size',P.buttonSize+'px');root.setProperty('--ty-button-color',P.buttonColor||'inherit');root.setProperty('--ty-button-weight',P.buttonWeight);root.setProperty('--ty-button-align',P.buttonAlign);if(!document.getElementById('cardTypographyCss')){let s=document.createElement('style');s.id='cardTypographyCss';s.textContent='.hero h1{font-size:var(--ty-name-size)!important;color:var(--ty-name-color)!important;font-weight:var(--ty-name-weight)!important;text-align:var(--ty-name-align)!important}.title{font-size:var(--ty-heading-size)!important;color:var(--ty-heading-color)!important;font-weight:var(--ty-heading-weight)!important;text-align:var(--ty-heading-align)!important}.story p,.role,.hint,.person .p,.service,.cap{font-size:var(--ty-body-size)!important;color:var(--ty-body-color)!important;font-weight:var(--ty-body-weight)!important;text-align:var(--ty-body-align)!important;line-height:var(--ty-body-line)!important}.gem,.link,.share button,.nav button,.btn,.choice{font-size:var(--ty-button-size)!important;color:var(--ty-button-color)!important;font-weight:var(--ty-button-weight)!important;text-align:var(--ty-button-align)!important}';document.head.appendChild(s)}}let oldRenderType=render;render=function(){oldRenderType();applyType()};let menuWithType=menu;menu=function(){menuWithType();let m=B.querySelector('.menu');if(m&&!document.getElementById('typeEditBtn')){let b=document.createElement('button');b.id='typeEditBtn';b.className='choice wide';b.innerHTML='<span>🔤</span>文字デザイン<small>名前・見出し・本文・ボタンの大きさ／色／太さ／配置</small>';m.appendChild(b);b.onclick=typeEditor}};function typeEditor(){initType();let colorInput=(id,label,val)=>'<label>'+label+'</label><div style="display:grid;grid-template-columns:1fr 54px;gap:8px"><input id="'+id+'Text" value="'+(val||'')+'" placeholder="空欄＝元の色"><input id="'+id+'" type="color" value="'+(val||'#29414b')+'"></div>';let select=(id,val)=>'<select id="'+id+'"><option value="left">左</option><option value="center">中央</option><option value="right">右</option></select>';B.innerHTML='<button class="btn dark" id="tyback">← 戻る</button><h2>🔤 文字デザイン編集</h2><p class="hint">変更するとその場でプレビューできます。空欄の色は元のデザイン色を使います。</p><div class="group"><b>👤 名前</b><div class="range"><span>大きさ</span><input id="nameSize" type="range" min="20" max="52" value="'+P.nameSize+'"><b id="nameSizeV">'+P.nameSize+'px</b></div>'+colorInput('nameColor','文字色',P.nameColor)+'<label>太さ</label><select id="nameWeight"><option value="400">標準</option><option value="700">太字</option><option value="900">極太</option></select><label>配置</label>'+select('nameAlign',P.nameAlign)+'</div><div class="group"><b>🏷️ 見出し</b><div class="range"><span>大きさ</span><input id="headingSize" type="range" min="12" max="32" value="'+P.headingSize+'"><b id="headingSizeV">'+P.headingSize+'px</b></div>'+colorInput('headingColor','文字色',P.headingColor)+'<label>太さ</label><select id="headingWeight"><option value="400">標準</option><option value="700">太字</option><option value="900">極太</option></select><label>配置</label>'+select('headingAlign',P.headingAlign)+'</div><div class="group"><b>📖 本文</b><div class="range"><span>大きさ</span><input id="bodySize" type="range" min="10" max="24" value="'+P.bodySize+'"><b id="bodySizeV">'+P.bodySize+'px</b></div>'+colorInput('bodyColor','文字色',P.bodyColor)+'<label>太さ</label><select id="bodyWeight"><option value="400">標準</option><option value="600">少し太字</option><option value="700">太字</option></select><label>配置</label>'+select('bodyAlign',P.bodyAlign)+'<div class="range"><span>行間</span><input id="bodyLineHeight" type="range" min="1.2" max="2.6" step=".1" value="'+P.bodyLineHeight+'"><b id="bodyLineV">'+P.bodyLineHeight+'</b></div></div><div class="group"><b>🔘 ボタン文字</b><div class="range"><span>大きさ</span><input id="buttonSize" type="range" min="9" max="22" value="'+P.buttonSize+'"><b id="buttonSizeV">'+P.buttonSize+'px</b></div>'+colorInput('buttonColor','文字色',P.buttonColor)+'<label>太さ</label><select id="buttonWeight"><option value="400">標準</option><option value="700">太字</option><option value="900">極太</option></select><label>配置</label>'+select('buttonAlign',P.buttonAlign)+'</div><button class="btn" id="typesave">☁️ 文字デザインを保存</button>';$('tyback').onclick=menu;['nameWeight','headingWeight','bodyWeight','buttonWeight'].forEach(id=>$(id).value=String(P[id]));['nameAlign','headingAlign','bodyAlign','buttonAlign'].forEach(id=>$(id).value=P[id]);let preview=function(){['name','heading','body','button'].forEach(k=>{P[k+'Size']=+$(k+'Size').value;P[k+'Color']=$(k+'ColorText').value.trim();P[k+'Weight']=+$(k+'Weight').value;P[k+'Align']=$(k+'Align').value});P.bodyLineHeight=+$('bodyLineHeight').value;$('nameSizeV').textContent=P.nameSize+'px';$('headingSizeV').textContent=P.headingSize+'px';$('bodySizeV').textContent=P.bodySize+'px';$('buttonSizeV').textContent=P.buttonSize+'px';$('bodyLineV').textContent=P.bodyLineHeight;applyType()};['nameSize','nameWeight','nameAlign','headingSize','headingWeight','headingAlign','bodySize','bodyWeight','bodyAlign','bodyLineHeight','buttonSize','buttonWeight','buttonAlign'].forEach(id=>$(id).oninput=preview);['nameColor','headingColor','bodyColor','buttonColor'].forEach(id=>{$(id).oninput=e=>{$(id+'Text').value=e.target.value;preview()};$(id+'Text').oninput=preview});$('typesave').onclick=async function(){try{preview();await save();toast('文字デザインを保存しました');menu()}catch(e){alert(e.message)}}}applyType();window.__cardTypographyV1=true;apply()}let f=document.getElementById('card');f.addEventListener('load',()=>{try{f.contentWindow.eval('('+installEffects.toString()+')()')}catch(e){console.error(e)}});</script></body></html>
