<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#81D8D0"><title>りーたん Portfolio Editor</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;color:#29414b;background:linear-gradient(145deg,#e8fffc,#fff2f7 55%,#f4efff);min-height:100vh}.wrap{max-width:760px;margin:auto;padding:14px 12px 70px}.glass{background:#ffffffd9;border:1px solid #fff;border-radius:28px;box-shadow:0 18px 55px #405e7524;padding:18px}.brand{font-family:'Snell Roundhand','Segoe Script',cursive;color:#ad8338;text-align:center;font-size:22px}.back{display:inline-block;text-decoration:none;color:#46656d;font-size:12px;font-weight:900;margin-bottom:10px}.login{text-align:center;padding:24px 12px}.login h1{font-size:24px}.input,textarea{width:100%;padding:11px;border:1px solid #d8e4e8;border-radius:12px;font:inherit;background:#fff}textarea{min-height:95px}.btn{width:100%;border:0;border-radius:14px;padding:12px;margin-top:9px;font-weight:900;background:linear-gradient(135deg,#81d8d0,#ffbfd5);color:#fff}.dark{background:#334d58}.work{margin:14px 0;padding:13px;border:1px solid #e2eaee;border-radius:18px;background:#ffffffb9}.work h3{margin:0 0 8px}.work label{display:block;font-size:11px;font-weight:900;margin:8px 0 4px}.preview{width:100%;max-height:190px;object-fit:cover;border-radius:12px;margin-top:7px}.previewVideo{width:100%;max-height:220px;border-radius:12px;background:#111;margin-top:7px}.remove{border:0;border-radius:11px;padding:9px;width:100%;margin-top:7px;background:#fff0f4;color:#9c4563;font-weight:900}.notice{padding:10px;border-radius:12px;background:#effffc;font-size:11px;line-height:1.6;margin:10px 0}.toplinks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.toplinks a{text-decoration:none;text-align:center;padding:10px;border-radius:12px;background:#ffffffcf;color:#47656e;font-weight:900;font-size:11px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#304a55;color:#fff;padding:10px 14px;border-radius:99px;display:none}</style></head><body><div class="wrap"><div class="glass"><div class="brand">Ritan Portfolio Editor ♡</div><div class="toplinks"><a href="./">← 電子名刺</a><a href="portfolio.html">👀 公開ページ</a></div><div id="app"></div></div></div><div class="toast" id="toast"></div><script>const API='https://lgidhjxowpueglduphzp.supabase.co/functions/v1/ritan-card-admin';let P={},PIN='',FILES={};const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function toast(t){let e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}async function load(){let r=await fetch(API+'?t='+Date.now(),{cache:'no-store'}),j=await r.json();P=j.profile||{};login()}function login(){$('app').innerHTML='<div class="login"><h1>🔐 ポートフォリオ編集</h1><p>暗証番号を入力してください。</p><input class="input" id="pin" type="password" inputmode="numeric" placeholder="暗証番号"><button class="btn" id="go">編集を開く</button></div>';$('go').onclick=async()=>{try{let pin=$('pin').value,r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-card-pin':pin},body:JSON.stringify({action:'verify_pin'})}),j=await r.json();if(!r.ok||!j.ok)throw Error('暗証番号が違います');PIN=pin;editor()}catch(e){alert(e.message)}}}function editor(){let I=[...(P.portfolioItems||[])].slice(0,12);while(I.length<12)I.push({title:'',description:'',url:'',mediaUrl:'',mediaType:'image'});$('app').innerHTML='<div class="notice">最大12作品まで。タイトル・説明・作品URL・写真または動画を登録できます。空欄の作品は公開ページに表示されません。</div>'+I.map((q,i)=>`<div class="work"><h3>作品 ${i+1}</h3><label>タイトル</label><input class="input" id="t${i}" value="${esc(q.title||'')}"><label>説明</label><textarea id="d${i}">${esc(q.description||'')}</textarea><label>作品URL・詳細URL</label><input class="input" id="u${i}" value="${esc(q.url||'')}"><label>写真または動画を差し替え</label><input class="input" id="f${i}" type="file" accept="image/*,video/*"><div id="m${i}">${q.mediaUrl?(q.mediaType==='video'?`<video class="previewVideo" src="${esc(q.mediaUrl)}" controls playsinline></video>`:`<img class="preview" src="${esc(q.mediaUrl)}">`):''}</div><button class="remove" type="button" id="r${i}">この作品を外す</button></div>`).join('')+'<button class="btn" id="save">☁️ ポートフォリオを保存</button>';I.forEach((q,i)=>{$('f'+i).onchange=e=>{let f=e.target.files[0];if(!f)return;FILES[i]=f;let url=URL.createObjectURL(f);$('m'+i).innerHTML=f.type.startsWith('video/')?`<video class="previewVideo" src="${url}" controls playsinline></video>`:`<img class="preview" src="${url}">`};$('r'+i).onclick=()=>{I[i]={title:'',description:'',url:'',mediaUrl:'',mediaType:'image'};delete FILES[i];$('t'+i).value='';$('d'+i).value='';$('u'+i).value='';$('f'+i).value='';$('m'+i).innerHTML=''}});$('save').onclick=async()=>{let b=$('save');b.disabled=true;b.textContent='保存中…';try{for(let i=0;i<12;i++){I[i].title=$('t'+i).value.trim();I[i].description=$('d'+i).value.trim();I[i].url=$('u'+i).value.trim();if(FILES[i]){let fd=new FormData();fd.append('file',FILES[i]);fd.append('kind','portfolio-'+(i+1));let r=await fetch(API,{method:'POST',headers:{'x-card-pin':PIN},body:fd}),j=await r.json();if(!r.ok)throw Error(j.error||'画像・動画アップロード失敗');I[i].mediaUrl=j.url;I[i].mediaType=FILES[i].type.startsWith('video/')?'video':'image'}}P.portfolioItems=I.filter(x=>x.title||x.description||x.url||x.mediaUrl).slice(0,12);let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-card-pin':PIN},body:JSON.stringify({action:'save_profile',profile:P})}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'保存失敗');P=j.profile||P;FILES={};toast('保存しました');setTimeout(editor,300)}catch(e){alert(e.message);b.disabled=false;b.textContent='☁️ ポートフォリオを保存'}}}load().catch(e=>$('app').innerHTML='<div class="notice">読み込みに失敗しました。再読み込みしてください。</div>');</script></body></html>
