<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#81D8D0"><title>りーたん Portfolio</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;color:#29414b;background:linear-gradient(#effffc,#fff8fc 55%,#f5efff);min-height:100vh}.wrap{max-width:900px;margin:auto;padding:14px 12px 70px}.hero{padding:28px 18px;text-align:center;border-radius:28px;background:#ffffffc9;border:1px solid #fff;box-shadow:0 18px 55px #405e7528}.brand{font-family:'Snell Roundhand','Segoe Script',cursive;color:#b2853b;font-size:22px}.hero h1{margin:8px 0 4px;font-size:30px}.sub{font-size:12px;line-height:1.8}.back{display:inline-block;margin-top:13px;padding:10px 14px;border-radius:99px;text-decoration:none;background:linear-gradient(135deg,#81d8d0,#ffbfd5);color:#fff;font-size:11px;font-weight:900}.grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:18px}.work{overflow:hidden;border-radius:22px;background:#ffffffdc;border:1px solid #fff;box-shadow:0 12px 30px #41607818}.media{aspect-ratio:16/10;background:#eefaf9}.media img,.media video{width:100%;height:100%;object-fit:cover;display:block}.body{padding:15px}.body h2{margin:0 0 7px;font-size:17px;color:#d45e8d}.desc{font-size:12px;line-height:1.8;white-space:pre-wrap}.go{display:inline-block;margin-top:10px;padding:9px 12px;border-radius:12px;text-decoration:none;background:linear-gradient(135deg,#5fcfc5,#9d83e7);color:#fff;font-size:11px;font-weight:900}.empty{padding:34px 18px;text-align:center;border-radius:22px;background:#ffffffc9;font-size:12px;line-height:1.8}@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><header class="hero"><div class="brand">Ritan Portfolio ♡</div><h1>作品・制作実績</h1><div class="sub">Web制作 / 手描きアニメーション / イラスト・デザイン / 動画編集</div><a class="back" href="./">← 電子名刺へ戻る</a></header><main class="grid" id="grid"></main></div><script>const A='https://lgidhjxowpueglduphzp.supabase.co/functions/v1/ritan-card-admin',G=document.getElementById('grid');const e=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));(async()=>{try{const r=await fetch(A+'?t='+Date.now(),{cache:'no-store'}),j=await r.json(),a=(j.profile?.portfolioItems||[]).filter(x=>x&&(x.title||x.description||x.mediaUrl||x.url));G.innerHTML=a.length?a.map(x=>`<article class="work">${x.mediaUrl?`<div class="media">${x.mediaType==='video'?`<video src="${e(x.mediaUrl)}" controls playsinline></video>`:`<img src="${e(x.mediaUrl)}" alt="">`}</div>`:''}<div class="body"><h2>${e(x.title||'Works')}</h2>${x.description?`<div class="desc">${e(x.description)}</div>`:''}${x.url?`<a class="go" href="${e(x.url)}" target="_blank">作品・詳細を見る →</a>`:''}</div></article>`).join(''):'<div class="empty">作品はこれから追加されます ✨</div>'}catch(_){G.innerHTML='<div class="empty">作品を読み込めませんでした。</div>'}})();</script></body></html>
