<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOGUマップ 埼玉 管理</title><style>:root{--o:#f28b25;--bg:#fffaf2;--ink:#292722;--muted:#756f68;--line:#eadfd2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:900px;margin:auto;padding:18px 14px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.head h1{font-size:22px;margin:0;color:var(--o)}a{color:inherit}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:14px}.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit}.muted{font-size:12px;color:var(--muted)}.row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.name{font-weight:900}.badge{display:inline-block;font-size:11px;padding:3px 7px;border-radius:99px;background:#eef1f5;margin-right:4px}.active{background:#ddf5e6}.pending{background:#fff0c9}.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:8px 10px;font-weight:850;background:var(--o);color:#fff}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}@media(max-width:620px){.row{grid-template-columns:1fr}.tools{justify-content:flex-start}}</style></head><body><div class="wrap"><div class="head"><div><h1>🔐 MOGUマップ 埼玉 管理</h1><div class="muted">埼玉県の参加店だけを確認・管理</div></div><a href="./">← 公開ページ</a></div><div class="card"><input id="q" class="search" placeholder="店名・住所・IDで検索"><p class="muted">現在は安全のため閲覧中心です。公開停止・座標確定などの管理操作は全国管理権限側から行います。</p><div id="summary"></div><div id="list"></div></div></div><script>let SB='',KEY='',stores=[];const q=document.querySelector('#q'),list=document.querySelector('#list'),summary=document.querySelector('#summary');function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function config(){const t=await fetch('../index.html').then(r=>r.text());SB=(t.match(/const SB='([^']+)'/)||[])[1]||'';KEY=(t.match(/KEY='([^']+)'/)||[])[1]||'';if(!SB||!KEY)throw Error('config')}function render(){const t=q.value.trim().toLowerCase();const a=stores.filter(s=>!t||`${s.store_code} ${s.name} ${s.address}`.toLowerCase().includes(t));summary.innerHTML=`<p><b>${a.length}件</b>表示 / 全${stores.length}件</p>`;list.innerHTML=a.map(s=>`<div class="row"><div><div class="name">${esc(s.name)}</div><div class="muted">ID: ${esc(s.store_code)}<br>${esc(s.address)}</div><div style="margin-top:5px"><span class="badge active">${s.status==='active'?'公開中':esc(s.status)}</span><span class="badge ${s.map_location_status==='verified'?'active':'pending'}">${s.map_location_status==='verified'?'位置確認済み':'位置確認中'}</span></div></div><div class="tools"><button class="btn ghost" type="button" disabled>編集準備中</button></div></div>`).join('')||'<p class="muted">該当する店舗がありません。</p>'}async function load(){try{await config();const u=SB+'/rest/v1/jm_stores?select=store_code,name,address,status,map_location_status&prefecture=eq.'+encodeURIComponent('埼玉県')+'&order=name.asc&limit=200';const r=await fetch(u,{headers:{apikey:KEY}});if(!r.ok)throw Error();stores=await r.json();render()}catch(e){list.innerHTML='<p>読み込みに失敗しました。</p>'}}q.addEventListener('input',render);load();</script></body></html>
