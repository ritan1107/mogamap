<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOGUマップ 埼玉｜一括管理</title><style>:root{--o:#f28b25;--g:#278668;--bg:#fffaf2;--ink:#292722;--muted:#756f68;--line:#eadfd2;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:980px;margin:auto;padding:16px 14px 50px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.head h1{font-size:22px;margin:0;color:var(--o)}a{color:inherit}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:9px 0}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:4px}input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}textarea{min-height:90px}.muted{font-size:12px;color:var(--muted)}.btn{border:0;border-radius:10px;padding:9px 11px;font-weight:850;background:var(--o);color:#fff}.btn.green{background:var(--g)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.red{background:var(--red)}.row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.name{font-weight:900}.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.hide{display:none}.notice{background:#fff5d5;border:1px solid #edd899;border-radius:12px;padding:10px}.ok{color:var(--g);font-weight:800}.err{color:var(--red);font-weight:800}h2{font-size:18px;margin:0 0 8px}@media(max-width:700px){.grid,.row{grid-template-columns:1fr}.tools{justify-content:flex-start}}</style></head><body><div class="wrap"><div class="head"><div><h1>🔐 MOGUマップ 埼玉｜一括管理</h1><div class="muted">店舗・PIN・スタンプラリー・特典・応援枠を一括管理</div></div><a href="./">← 公開ページ</a></div><div id="login" class="card"><h2>管理者ログイン</h2><p class="muted">埼玉版の全体管理者PINを入力してください。</p><div class="field"><label>管理者PIN</label><input id="adminPin" type="password" inputmode="numeric"></div><button class="btn" onclick="loginAdmin()">管理画面を開く</button><p id="loginMsg" class="muted"></p></div><div id="dash" class="hide"><div class="grid"><section class="card"><h2>🎉 クリア特典・お祝い表示</h2><div class="field"><label>スタンプラリー名</label><input id="rallyTitle"></div><div class="field"><label>クリア時タイトル</label><input id="completeTitle"></div><div class="field"><label>クリア時メッセージ</label><textarea id="completeMsg"></textarea></div><div class="field"><label>特典案内</label><textarea id="rewardText"></textarea></div><div class="field"><label>応援・協賛欄タイトル</label><input id="sponsorTitle"></div><button class="btn green" onclick="saveSettings()">設定を保存</button><p id="settingsMsg" class="muted"></p></section><section class="card"><h2>🔑 管理者PIN変更</h2><p class="muted">現在の管理者PINを知っている管理者だけ変更できます。</p><div class="field"><label>新しい管理者PIN（4桁以上）</label><input id="newAdminPin" type="password" inputmode="numeric"></div><button class="btn" onclick="changeAdminPin()">管理者PINを変更</button><p id="adminPinMsg" class="muted"></p><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h2>🏆 クリアランキング</h2><div id="ranking" class="muted">読み込み中…</div></section></div><section class="card"><h2>📣 スタンプラリー応援・貢献者</h2><p class="muted">協賛店舗・サービス・応援者を公開ページで宣伝できます。</p><div class="grid"><div><div class="field"><label>名前</label><input id="spName"></div><div class="field"><label>紹介文</label><textarea id="spDesc"></textarea></div></div><div><div class="field"><label>URL</label><input id="spUrl" placeholder="https://..."></div><div class="field"><label>画像URL</label><input id="spImage" placeholder="https://..."></div><div class="field"><label>表示順</label><input id="spOrder" type="number" value="0"></div></div></div><button class="btn green" onclick="addSponsor()">応援者を追加</button><p id="sponsorMsg" class="muted"></p><div id="sponsors"></div></section><section class="card"><h2>🏪 埼玉21店舗 一括管理</h2><input id="q" placeholder="店名・住所・IDで検索"><p class="notice">「店舗PIN」は店舗ページ編集用、「スタンプ数字」は来店者がスタンプを押すための別コードです。店舗には必要な方だけ伝えてください。</p><div id="summary"></div><div id="stores"></div></section></div></div><script>let SB='',KEY='',admin='',stores=[];const REGION='埼玉県';function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function config(){let t=await fetch('../index.html').then(r=>r.text());SB=(t.match(/const SB='([^']+)'/)||[])[1]||'';KEY=(t.match(/KEY='([^']+)'/)||[])[1]||''}function H(){return {'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'}}async function rpc(name,body){let r=await fetch(SB+'/rest/v1/rpc/'+name,{method:'POST',headers:H(),body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());return await r.json()}async function loginAdmin(){admin=document.querySelector('#adminPin').value.trim();try{let ok=await rpc('jm_verify_region_admin_pin',{p_region:REGION,p_pin:admin});if(!ok)throw Error();document.querySelector('#login').classList.add('hide');document.querySelector('#dash').classList.remove('hide');await Promise.all([loadStores(),loadSettings(),loadRanking(),loadSponsors()])}catch{document.querySelector('#loginMsg').textContent='管理者PINが違います。'}}async function loadStores(){let r=await fetch(SB+'/rest/v1/jm_stores?select=id,store_code,name,address,status,sa_member,rally_participant,job_open,volunteer_open&prefecture=eq.'+encodeURIComponent(REGION)+'&order=name.asc&limit=200',{headers:H()});stores=await r.json();renderStores()}function renderStores(){let t=document.querySelector('#q').value.trim().toLowerCase(),a=stores.filter(s=>!t||(`${s.store_code} ${s.name} ${s.address}`.toLowerCase().includes(t)));document.querySelector('#summary').innerHTML='<p><b>'+a.length+'件</b> / 全'+stores.length+'件</p>';document.querySelector('#stores').innerHTML=a.map(s=>`<div class="row"><div><div class="name">${esc(s.name)}</div><div class="muted">ID: ${esc(s.store_code)}<br>${esc(s.address)}</div><div class="muted">${s.sa_member?'⭐SA ':''}${s.rally_participant?'🎫スタンプ ':''}${s.job_open?'💼バイト ':''}${s.volunteer_open?'🤝募集 ':''}</div></div><div class="tools"><button class="btn" onclick="setStorePin('${s.id}','${esc(s.name)}')">店舗PIN</button><button class="btn green" onclick="setStampCode('${s.id}','${esc(s.name)}')">スタンプ数字</button><a class="btn ghost" href="./?store=${encodeURIComponent(s.id)}">店舗を見る</a></div></div>`).join('')}async function setStorePin(id,name){let p=prompt(name+' の新しい店舗PIN（4桁以上）');if(!p)return;let ok=await rpc('jm_admin_set_store_pin',{p_region:REGION,p_admin_pin:admin,p_store_id:id,p_new_pin:p});alert(ok?'店舗PINを設定しました。\n店舗側には「'+p+'」を伝えてください。':'設定できませんでした。')}async function setStampCode(id,name){let p=prompt(name+' のスタンプ数字（3桁以上の簡単な数字）');if(!p)return;let ok=await rpc('jm_admin_set_stamp_code',{p_region:REGION,p_admin_pin:admin,p_store_id:id,p_code:p});alert(ok?'スタンプ数字を設定しました。\n来店者には「'+p+'」を入力してもらいます。':'設定できませんでした。')}async function loadSettings(){let r=await fetch(SB+'/rest/v1/jm_region_rally_settings_public?region=eq.'+encodeURIComponent(REGION)+'&limit=1',{headers:H()});let a=await r.json(),s=a[0]||{};rallyTitle.value=s.rally_title||'';completeTitle.value=s.completion_title||'';completeMsg.value=s.completion_message||'';rewardText.value=s.reward_text||'';sponsorTitle.value=s.sponsor_title||''}async function saveSettings(){try{let ok=await rpc('jm_admin_update_region_rally_settings',{p_region:REGION,p_admin_pin:admin,p_rally_title:rallyTitle.value,p_completion_title:completeTitle.value,p_completion_message:completeMsg.value,p_reward_text:rewardText.value,p_sponsor_title:sponsorTitle.value});settingsMsg.textContent=ok?'保存しました。':'保存できませんでした。'}catch{settingsMsg.textContent='保存できませんでした。'}}async function changeAdminPin(){let p=newAdminPin.value.trim();if(p.length<4){adminPinMsg.textContent='4桁以上にしてください。';return}let ok=await rpc('jm_change_region_admin_pin',{p_region:REGION,p_current_pin:admin,p_new_pin:p});if(ok){admin=p;adminPinMsg.textContent='管理者PINを変更しました。';newAdminPin.value=''}else adminPinMsg.textContent='変更できませんでした。'}async function loadRanking(){let r=await fetch(SB+'/rest/v1/jm_rally_rankings_public?region=eq.'+encodeURIComponent(REGION)+'&order=rank.asc&limit=100',{headers:H()});let a=await r.json();ranking.innerHTML=a.length?a.map(x=>`<div>🏆 ${x.rank}位　${x.profile_url?`<a target="_blank" href="${esc(x.profile_url)}">${esc(x.nickname)}</a>`:esc(x.nickname)} ${x.member_id?`<span class="muted">ID:${esc(x.member_id)}</span>`:''}</div>`).join(''):'まだクリア者はいません。'}async function addSponsor(){try{let id=await rpc('jm_admin_add_sponsor',{p_region:REGION,p_admin_pin:admin,p_name:spName.value,p_description:spDesc.value,p_url:spUrl.value,p_image_url:spImage.value,p_sort_order:Number(spOrder.value||0)});sponsorMsg.textContent=id?'追加しました。':'追加できませんでした。';if(id){spName.value=spDesc.value=spUrl.value=spImage.value='';await loadSponsors()}}catch{sponsorMsg.textContent='追加できませんでした。'}}async function loadSponsors(){let r=await fetch(SB+'/rest/v1/jm_rally_sponsors_public?region=eq.'+encodeURIComponent(REGION)+'&order=sort_order.asc',{headers:H()});let a=await r.json();sponsors.innerHTML=a.length?'<hr style="border:0;border-top:1px solid var(--line);margin:15px 0">'+a.map(s=>`<div class="row"><div><b>${esc(s.name)}</b><div class="muted">${esc(s.description||'')}</div></div><div>${s.url?`<a class="btn ghost" target="_blank" href="${esc(s.url)}">見る</a>`:''}</div></div>`).join(''):''}document.querySelector('#q').addEventListener('input',renderStores);config();</script></body></html>
