<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOGUマップ 埼玉 管理</title><style>:root{--o:#f28b25;--bg:#fffaf2;--ink:#292722;--muted:#756f68;--line:#eadfd2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:900px;margin:auto;padding:18px 14px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.head h1{font-size:22px;margin:0;color:var(--o)}a{color:inherit}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:14px}.search,input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}.muted{font-size:12px;color:var(--muted)}.row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.name{font-weight:900}.tools{display:flex;gap:6px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:8px 10px;font-weight:850;background:var(--o);color:#fff}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center}.modal.on{display:flex}.sheet{width:min(600px,100%);background:#fff;border-radius:22px 22px 0 0;padding:18px}.field{margin:9px 0}.field label{font-size:12px;font-weight:800;display:block;margin-bottom:4px}@media(max-width:620px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><div><h1>🔐 MOGUマップ 埼玉 管理</h1><div class="muted">店舗PINの発行・再設定</div></div><a href="./">← 公開ページ</a></div><div class="card"><input id="q" class="search" placeholder="店名・住所・IDで検索"><p class="muted">北海道版で使っている主催者PINで、埼玉各店舗の店舗PINを設定できます。</p><div id="summary"></div><div id="list"></div></div></div><div class="modal" id="pinModal"><div class="sheet"><button class="btn ghost" style="float:right" onclick="closeM()">×</button><h2 id="pinTitle">店舗PIN設定</h2><form id="pinForm"><div class="field"><label>主催者PIN</label><input name="organizer" type="password" required></div><div class="field"><label>新しい店舗PIN（4桁以上）</label><input name="newpin" type="password" minlength="4" required></div><button class="btn" type="submit">PINを設定</button><p id="msg" class="muted"></p></form></div></div><script>let SB='',KEY='',stores=[],target=null;const q=document.querySelector('#q'),list=document.querySelector('#list'),summary=document.querySelector('#summary');function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function config(){let t=await fetch('../index.html').then(r=>r.text());SB=(t.match(/const SB='([^']+)'/)||[])[1]||'';KEY=(t.match(/KEY='([^']+)'/)||[])[1]||''}function H(){return {'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'}}function render(){let t=q.value.trim().toLowerCase(),a=stores.filter(s=>!t||`${s.store_code} ${s.name} ${s.address}`.toLowerCase().includes(t));summary.innerHTML=`<p><b>${a.length}件</b> / 全${stores.length}件</p>`;list.innerHTML=a.map(s=>`<div class="row"><div><div class="name">${esc(s.name)}</div><div class="muted">ID: ${esc(s.store_code)}<br>${esc(s.address)}</div></div><div class="tools"><button class="btn" onclick="openPin('${s.id}')">店舗PIN設定</button><a class="btn ghost" href="./?store=${encodeURIComponent(s.id)}">公開ページ</a></div></div>`).join('')}function openPin(id){target=id;let s=stores.find(x=>x.id===id);document.querySelector('#pinTitle').textContent=(s?s.name:'店舗')+' のPIN設定';document.querySelector('#msg').textContent='';document.querySelector('#pinModal').classList.add('on')}function closeM(){document.querySelector('#pinModal').classList.remove('on')}document.querySelector('#pinForm').addEventListener('submit',async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.currentTarget));let r=await fetch(SB+'/rest/v1/rpc/jm_set_store_pin_with_organizer',{method:'POST',headers:H(),body:JSON.stringify({p_store_id:target,p_organizer_pin:d.organizer,p_new_pin:d.newpin})});let ok=r.ok&&await r.json();document.querySelector('#msg').textContent=ok?'店舗PINを設定しました。店舗側にこのPINを伝えてください。':'主催者PINが違うか設定できませんでした。';if(ok)e.currentTarget.reset()});async function load(){await config();let r=await fetch(SB+'/rest/v1/jm_stores?select=id,store_code,name,address,status&prefecture=eq.'+encodeURIComponent('埼玉県')+'&order=name.asc&limit=200',{headers:H()});stores=await r.json();render()}q.addEventListener('input',render);load();</script></body></html>
