<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOGUマップ 埼玉｜一括管理</title><style>:root{--o:#f28b25;--g:#278668;--bg:#fffaf2;--ink:#292722;--muted:#756f68;--line:#eadfd2;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:980px;margin:auto;padding:16px 14px 50px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.head h1{font-size:22px;margin:0;color:var(--o)}a{color:inherit}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:9px 0}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:4px}input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}textarea{min-height:90px}.muted{font-size:12px;color:var(--muted)}.btn{border:0;border-radius:10px;padding:9px 11px;font-weight:850;background:var(--o);color:#fff}.btn.green{background:var(--g)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.red{background:var(--red)}.row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.name{font-weight:900}.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.hide{display:none}.notice{background:#fff5d5;border:1px solid #edd899;border-radius:12px;padding:10px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.on{display:flex}.sheet{width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px}.check{display:flex;gap:8px;align-items:center;margin:8px 0}.check input{width:auto}h2{font-size:18px;margin:0 0 8px}@media(max-width:700px){.grid,.row{grid-template-columns:1fr}.tools{justify-content:flex-start}}</style></head><body><div class="wrap"><div class="head"><div><h1>🔐 MOGUマップ 埼玉｜一括管理</h1><div class="muted">店舗・PIN・スタンプラリー・特典・応援枠を一括管理</div></div><a href="./">← 公開ページ</a></div><div id="login" class="card"><h2>管理者ログイン</h2><div class="field"><label>管理者PIN</label><input id="adminPin" type="password" inputmode="numeric"></div><button class="btn" onclick="loginAdmin()">管理画面を開く</button><p id="loginMsg" class="muted"></p></div><div id="dash" class="hide"><div class="grid"><section class="card"><h2>🎉 クリア特典・お祝い表示</h2><div class="field"><label>スタンプラリー名</label><input id="rallyTitle"></div><div class="field"><label>クリア時タイトル</label><input id="completeTitle"></div><div class="field"><label>クリア時メッセージ</label><textarea id="completeMsg"></textarea></div><div class="field"><label>特典案内</label><textarea id="rewardText"></textarea></div><div class="field"><label>応援・協賛欄タイトル</label><input id="sponsorTitle"></div><button class="btn green" onclick="saveSettings()">設定を保存</button><p id="settingsMsg" class="muted"></p></section><section class="card"><h2>🔑 管理者PIN変更</h2><div class="field"><label>新しい管理者PIN（4桁以上）</label><input id="newAdminPin" type="password" inputmode="numeric"></div><button class="btn" onclick="changeAdminPin()">管理者PINを変更</button><p id="adminPinMsg" class="muted"></p><hr><h2>🏆 クリアランキング</h2><div id="ranking" class="muted"></div></section></div><section class="card"><h2>📣 スタンプラリー応援・貢献者</h2><div class="grid"><div><div class="field"><label>名前</label><input id="spName"></div><div class="field"><label>紹介文</label><textarea id="spDesc"></textarea></div></div><div><div class="field"><label>URL</label><input id="spUrl"></div><div class="field"><label>画像URL</label><input id="spImage"></div><div class="field"><label>表示順</label><input id="spOrder" type="number" value="0"></div></div></div><button class="btn green" onclick="addSponsor()">応援者を追加</button><div id="sponsors"></div></section><section class="card"><h2>🏪 埼玉21店舗 一括管理</h2><input id="q" placeholder="店名・住所・IDで検索"><p class="notice">管理者は全店舗を直接編集できます。店舗側には店舗PINを渡すと、自分のお店だけ公開ページから編集できます。</p><div id="summary"></div><div id="stores"></div></section></div></div><div class="modal" id="editModal"><div class="sheet"><button class="btn ghost" style="float:right" onclick="closeEdit()">×</button><h2 id="editTitle">店舗編集</h2><form id="editForm"></form></div></div><script>let SB='',KEY='',admin='',stores=[],editing=null;const REGION='埼玉県';function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function config(){let t=await fetch('../index.html').then(r=>r.text());SB=(t.match(/const SB='([^']+)'/)||[])[1]||'';KEY=(t.match(/KEY='([^']+)'/)||[])[1]||''}function H(){return {'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'}}async function rpc(name,body){let r=await fetch(SB+'/rest/v1/rpc/'+name,{method:'POST',headers:H(),body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());return await r.json()}async function loginAdmin(){admin=adminPin.value.trim();try{if(!await rpc('jm_verify_region_admin_pin',{p_region:REGION,p_pin:admin}))throw Error();login.classList.add('hide');dash.classList.remove('hide');await Promise.all([loadStores(),loadSettings(),loadRanking(),loadSponsors()])}catch{loginMsg.textContent='管理者PINが違います。'}}async function loadStores(){let sel='id,store_code,name,address,phone,description,website_url,sns_url,community_url,group_page_url,google_maps_url,image_url,status,sa_member,rally_participant,job_open,job_title,job_description,job_hourly_wage,job_schedule,job_payment_method,job_contact,volunteer_open,volunteer_title,volunteer_description,volunteer_schedule,volunteer_contact';let r=await fetch(SB+'/rest/v1/jm_stores?select='+sel+'&prefecture=eq.'+encodeURIComponent(REGION)+'&order=name.asc&limit=200',{headers:H()});stores=await r.json();renderStores()}function renderStores(){let t=q.value.trim().toLowerCase(),a=stores.filter(s=>!t||(`${s.store_code} ${s.name} ${s.address}`.toLowerCase().includes(t)));summary.innerHTML='<p><b>'+a.length+'件</b> / 全'+stores.length+'件</p>';document.querySelector('#stores').innerHTML=a.map(s=>`<div class="row"><div><div class="name">${esc(s.name)}</div><div class="muted">ID: ${esc(s.store_code)}<br>${esc(s.address)}</div><div class="muted">${s.sa_member?'⭐SA ':''}${s.rally_participant?'🎫スタンプ ':''}${s.job_open?'💼バイト ':''}${s.volunteer_open?'🤝募集 ':''}</div></div><div class="tools"><button class="btn" onclick="openEdit('${s.id}')">✏️ 編集</button><button class="btn ghost" onclick="setStorePin('${s.id}','${esc(s.name)}')">店舗PIN</button><button class="btn green" onclick="setStampCode('${s.id}','${esc(s.name)}')">スタンプ数字</button><a class="btn ghost" href="./?store=${encodeURIComponent(s.id)}">店舗を見る</a></div></div>`).join('')}function openEdit(id){editing=stores.find(s=>s.id===id);if(!editing)return;editTitle.textContent=editing.name+' を編集';editForm.innerHTML=`<div class="field"><label>店名</label><input name="name" value="${esc(editing.name)}"></div><div class="field"><label>住所</label><input name="address" value="${esc(editing.address)}"></div><div class="field"><label>電話</label><input name="phone" value="${esc(editing.phone||'')}"></div><div class="field"><label>紹介文</label><textarea name="description">${esc(editing.description||'')}</textarea></div><div class="field"><label>HP</label><input name="website_url" value="${esc(editing.website_url||'')}"></div><div class="field"><label>SNS</label><input name="sns_url" value="${esc(editing.sns_url||'')}"></div><div class="field"><label>店舗ページURL</label><input name="community_url" value="${esc(editing.community_url||'')}"></div><div class="field"><label>グループページURL</label><input name="group_page_url" value="${esc(editing.group_page_url||'')}"></div><div class="field"><label>GoogleマップURL</label><input name="google_maps_url" value="${esc(editing.google_maps_url||'')}"></div><div class="field"><label>画像URL</label><input name="image_url" value="${esc(editing.image_url||'')}"></div><label class="check"><input name="sa_member" type="checkbox" ${editing.sa_member?'checked':''}>⭐ SA加盟店</label><label class="check"><input name="rally_participant" type="checkbox" ${editing.rally_participant?'checked':''}>🎫 スタンプラリー参加</label><label class="check"><input name="job_open" type="checkbox" ${editing.job_open?'checked':''}>💼 スポットバイト募集</label><div class="field"><label>バイトタイトル</label><input name="job_title" value="${esc(editing.job_title||'')}"></div><div class="field"><label>仕事内容</label><textarea name="job_description">${esc(editing.job_description||'')}</textarea></div><div class="field"><label>時給</label><input name="job_hourly_wage" type="number" value="${editing.job_hourly_wage||''}"></div><div class="field"><label>日時</label><input name="job_schedule" value="${esc(editing.job_schedule||'')}"></div><div class="field"><label>支払方法</label><input name="job_payment_method" value="${esc(editing.job_payment_method||'')}"></div><div class="field"><label>連絡先</label><input name="job_contact" value="${esc(editing.job_contact||'')}"></div><label class="check"><input name="volunteer_open" type="checkbox" ${editing.volunteer_open?'checked':''}>🤝 ボランティア募集</label><div class="field"><label>募集タイトル</label><input name="volunteer_title" value="${esc(editing.volunteer_title||'')}"></div><div class="field"><label>内容</label><textarea name="volunteer_description">${esc(editing.volunteer_description||'')}</textarea></div><div class="field"><label>日時</label><input name="volunteer_schedule" value="${esc(editing.volunteer_schedule||'')}"></div><div class="field"><label>連絡先</label><input name="volunteer_contact" value="${esc(editing.volunteer_contact||'')}"></div><button class="btn" type="submit">保存する</button><p id="editMsg" class="muted"></p>`;editModal.classList.add('on')}function closeEdit(){editModal.classList.remove('on')}editForm.addEventListener('submit',async e=>{e.preventDefault();let f=e.currentTarget,d=Object.fromEntries(new FormData(f));let body={p_region:REGION,p_admin_pin:admin,p_store_id:editing.id,p_name:d.name,p_address:d.address,p_phone:d.phone||'',p_description:d.description||'',p_website_url:d.website_url||'',p_sns_url:d.sns_url||'',p_community_url:d.community_url||'',p_group_page_url:d.group_page_url||'',p_google_maps_url:d.google_maps_url||'',p_image_url:d.image_url||'',p_sa_member:!!f.sa_member.checked,p_rally_participant:!!f.rally_participant.checked,p_job_open:!!f.job_open.checked,p_job_title:d.job_title||'',p_job_description:d.job_description||'',p_job_hourly_wage:d.job_hourly_wage?Number(d.job_hourly_wage):null,p_job_schedule:d.job_schedule||'',p_job_payment_method:d.job_payment_method||'',p_job_contact:d.job_contact||'',p_volunteer_open:!!f.volunteer_open.checked,p_volunteer_title:d.volunteer_title||'',p_volunteer_description:d.volunteer_description||'',p_volunteer_schedule:d.volunteer_schedule||'',p_volunteer_contact:d.volunteer_contact||''};try{let ok=await rpc('jm_admin_update_store',body);editMsg.textContent=ok?'保存しました。':'保存できませんでした。';if(ok)await loadStores()}catch{editMsg.textContent='保存できませんでした。'}});async function setStorePin(id,name){let p=prompt(name+' の新しい店舗PIN（4桁以上）');if(!p)return;alert(await rpc('jm_admin_set_store_pin',{p_region:REGION,p_admin_pin:admin,p_store_id:id,p_new_pin:p})?'店舗PINを設定しました。店舗側にこのPINを伝えてください。':'設定できませんでした。')}async function setStampCode(id,name){let p=prompt(name+' のスタンプ数字（3桁以上）');if(!p)return;alert(await rpc('jm_admin_set_stamp_code',{p_region:REGION,p_admin_pin:admin,p_store_id:id,p_code:p})?'スタンプ数字を設定しました。':'設定できませんでした。')}async function loadSettings(){let r=await fetch(SB+'/rest/v1/jm_region_rally_settings_public?region=eq.'+encodeURIComponent(REGION)+'&limit=1',{headers:H()});let s=(await r.json())[0]||{};rallyTitle.value=s.rally_title||'';completeTitle.value=s.completion_title||'';completeMsg.value=s.completion_message||'';rewardText.value=s.reward_text||'';sponsorTitle.value=s.sponsor_title||''}async function saveSettings(){settingsMsg.textContent=await rpc('jm_admin_update_region_rally_settings',{p_region:REGION,p_admin_pin:admin,p_rally_title:rallyTitle.value,p_completion_title:completeTitle.value,p_completion_message:completeMsg.value,p_reward_text:rewardText.value,p_sponsor_title:sponsorTitle.value})?'保存しました。':'保存できませんでした。'}async function changeAdminPin(){let p=newAdminPin.value.trim();if(p.length<4)return adminPinMsg.textContent='4桁以上にしてください。';let ok=await rpc('jm_change_region_admin_pin',{p_region:REGION,p_current_pin:admin,p_new_pin:p});if(ok){admin=p;adminPinMsg.textContent='変更しました。';newAdminPin.value=''}else adminPinMsg.textContent='変更できませんでした。'}async function loadRanking(){let r=await fetch(SB+'/rest/v1/jm_rally_rankings_public?region=eq.'+encodeURIComponent(REGION)+'&order=rank.asc',{headers:H()});let a=await r.json();ranking.innerHTML=a.length?a.map(x=>`<div>🏆 ${x.rank}位 ${esc(x.nickname)}</div>`).join(''):'まだクリア者はいません。'}async function addSponsor(){let id=await rpc('jm_admin_add_sponsor',{p_region:REGION,p_admin_pin:admin,p_name:spName.value,p_description:spDesc.value,p_url:spUrl.value,p_image_url:spImage.value,p_sort_order:Number(spOrder.value||0)});if(id)loadSponsors()}async function loadSponsors(){let r=await fetch(SB+'/rest/v1/jm_rally_sponsors_public?region=eq.'+encodeURIComponent(REGION)+'&order=sort_order.asc',{headers:H()});let a=await r.json();sponsors.innerHTML=a.map(s=>`<div class="row"><div><b>${esc(s.name)}</b><div class="muted">${esc(s.description||'')}</div></div><div>${s.url?`<a class="btn ghost" target="_blank" href="${esc(s.url)}">見る</a>`:''}</div></div>`).join('')}q.addEventListener('input',renderStores);config();</script></body></html>
