<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOGUマップ 埼玉｜新規店舗・一括登録</title><style>:root{--o:#f28b25;--g:#278668;--bg:#fffaf2;--ink:#292722;--muted:#756f68;--line:#eadfd2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:980px;margin:auto;padding:16px 14px 60px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.head h1{margin:0;color:var(--o);font-size:22px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:9px 0}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:4px}input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}textarea{min-height:120px}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:850;background:var(--o);color:#fff}.btn.green{background:var(--g)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.hide{display:none}.muted{font-size:12px;color:var(--muted)}.preview{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ok{color:#18794e;font-weight:800}.err{color:#b42318;font-weight:800}.notice{background:#fff5d5;border:1px solid #edd899;padding:10px;border-radius:12px}@media(max-width:700px){.grid,.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="head"><div><h1>➕ MOGUマップ 埼玉｜新規店舗・一括登録</h1><div class="muted">1店舗でも、まとめてコピペでも登録できます</div></div><a href="./admin.html">← 一括管理</a></div><section id="login" class="card"><h2>管理者ログイン</h2><div class="field"><label>管理者PIN</label><input id="adminPin" type="password" inputmode="numeric"></div><button class="btn" onclick="loginAdmin()">登録画面を開く</button><p id="loginMsg" class="muted"></p></section><div id="app" class="hide"><section class="card"><h2>① 1店舗ずつ登録</h2><div class="grid"><div><div class="field"><label>店舗名 *</label><input id="oneName"></div><div class="field"><label>住所 *</label><input id="oneAddress"></div><div class="field"><label>電話</label><input id="onePhone"></div><div class="field"><label>大分類</label><select id="oneMajor"><option>飲食店</option><option selected>サービス</option></select></div><div class="field"><label>小分類</label><input id="oneSub" placeholder="カフェ、居酒屋、美容など"></div></div><div><div class="field"><label>紹介文</label><textarea id="oneDesc"></textarea></div><div class="field"><label>HP</label><input id="oneWeb"></div><div class="field"><label>SNS</label><input id="oneSns"></div><div class="field"><label>GoogleマップURL</label><input id="oneMap"></div></div></div><button class="btn green" onclick="createOne()">この店舗を登録</button><p id="oneMsg" class="muted"></p></section><section class="card"><h2>② コピペで時短・一括登録</h2><p class="notice">下に何店舗でもそのまま貼ってください。「店名:」「住所:」「ID:」「紹介文:」「HP:」「SNS:」「Googleマップ:」などを自動で読み取ります。店舗と店舗の間は空行を1つ以上あけると精度が上がります。</p><textarea id="bulkText" placeholder="例：&#10;1. Cafe ABC&#10;ID: abc_001&#10;カテゴリ: カフェ&#10;住所: 埼玉県さいたま市...&#10;紹介文: ...&#10;HP: https://...&#10;&#10;2. ○○商店&#10;住所: 埼玉県川越市..."></textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn" onclick="parseBulk()">AI風に自動整理</button><button class="btn ghost" onclick="bulkText.value='';preview.innerHTML='';items=[]">クリア</button></div><p class="muted">※このページの自動整理は、入力文章の項目名・URL・住所形式を解析して分割します。曖昧な内容は登録前に必ずプレビューで修正できます。</p><div id="preview"></div><button id="bulkSave" class="btn green hide" onclick="saveBulk()">この内容で一括登録</button><p id="bulkMsg" class="muted"></p></section></div></main><script>let SB='',KEY='',admin='',items=[];const REGION='埼玉県';async function config(){let t=await fetch('../index.html').then(r=>r.text());SB=(t.match(/const SB='([^']+)'/)||[])[1]||'';KEY=(t.match(/KEY='([^']+)'/)||[])[1]||''}function H(){return{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'}}async function rpc(n,b){let r=await fetch(SB+'/rest/v1/rpc/'+n,{method:'POST',headers:H(),body:JSON.stringify(b)});if(!r.ok)throw Error(await r.text());return r.json()}async function loginAdmin(){admin=adminPin.value.trim();try{if(!await rpc('jm_verify_region_admin_pin',{p_region:REGION,p_pin:admin}))throw 0;login.classList.add('hide');app.classList.remove('hide')}catch{loginMsg.textContent='管理者PINが違います。'}}async function createOne(){oneMsg.textContent='登録中…';let b={p_region:REGION,p_admin_pin:admin,p_store_code:'',p_name:oneName.value.trim(),p_address:oneAddress.value.trim(),p_phone:onePhone.value.trim(),p_major_category:oneMajor.value,p_subcategory:oneSub.value.trim()||'その他',p_description:oneDesc.value.trim(),p_website_url:oneWeb.value.trim(),p_sns_url:oneSns.value.trim(),p_community_url:'',p_group_page_url:'',p_google_maps_url:oneMap.value.trim(),p_image_url:''};try{let r=await rpc('jm_admin_create_store',b);if(r.ok){oneMsg.innerHTML='<span class="ok">✅ 登録しました。</span>';['oneName','oneAddress','onePhone','oneSub','oneDesc','oneWeb','oneSns','oneMap'].forEach(id=>document.getElementById(id).value='')}else oneMsg.innerHTML='<span class="err">'+(r.reason==='duplicate'?'同じ店名＋住所の店舗が既にあります。':'登録できませんでした。')+'</span>'}catch(e){oneMsg.innerHTML='<span class="err">登録できませんでした。</span>'}}function normKey(s){return s.replace(/[：:]/g,'').trim().toLowerCase()}function splitBlocks(t){let b=t.replace(/\r/g,'').split(/\n\s*\n+/).map(x=>x.trim()).filter(Boolean);if(b.length===1){let lines=t.replace(/\r/g,'').split('\n');b=[];let cur=[];for(let line of lines){if(/^\s*\d+[\.．、)]\s*/.test(line)&&cur.length){b.push(cur.join('\n'));cur=[line]}else cur.push(line)}if(cur.join('').trim())b.push(cur.join('\n'))}return b}function parseBlock(block){let o={store_code:'',name:'',address:'',phone:'',major_category:'サービス',subcategory:'その他',description:'',website_url:'',sns_url:'',community_url:'',group_page_url:'',google_maps_url:'',image_url:''};let lines=block.split('\n').map(x=>x.trim()).filter(Boolean);for(let i=0;i<lines.length;i++){let line=lines[i].replace(/^\d+[\.．、)]\s*/,'');let m=line.match(/^([^:：]{1,18})[:：]\s*(.*)$/);if(m){let k=normKey(m[1]),v=m[2].trim();if(/^(id|店舗id)$/.test(k))o.store_code=v;else if(/^(店名|店舗名|名前)$/.test(k))o.name=v;else if(/^(住所|所在地)$/.test(k))o.address=v;else if(/^(電話|電話番号|tel)$/.test(k))o.phone=v;else if(/^(カテゴリ|カテゴリー|小分類)$/.test(k)){o.subcategory=v;if(/カフェ|居酒屋|食事|ラーメン|レストラン|海鮮|飲食|パン|スイーツ/.test(v))o.major_category='飲食店'}else if(/^(大分類)$/.test(k))o.major_category=/飲食/.test(v)?'飲食店':'サービス';else if(/^(紹介文|説明|紹介|メモ)$/.test(k))o.description=v;else if(/^(hp|ホームページ|web|website)$/.test(k))o.website_url=v;else if(/^(sns|instagram|インスタ|x|twitter|facebook)$/.test(k))o.sns_url=v;else if(/コミュニティ/.test(k))o.community_url=v;else if(/グループ/.test(k))o.group_page_url=v;else if(/google.*map|googleマップ|地図/.test(k))o.google_maps_url=v;else if(/画像|写真/.test(k))o.image_url=v;continue}if(!o.name&&line.length<80&&!/^https?:\/\//.test(line)){o.name=line;continue}if(!o.address&&/(都|道|府|県).*(市|区|町|村)/.test(line)){o.address=line;continue}if(/^https?:\/\//.test(line)){if(/google\.[^/]+\/maps|maps\.app\.goo\.gl/.test(line))o.google_maps_url=line;else if(/instagram|facebook|twitter|x\.com/.test(line))o.sns_url=line;else if(!o.website_url)o.website_url=line;continue}if(!o.description)o.description=line;else o.description+=' '+line}if(/カフェ|居酒屋|食堂|ラーメン|レストラン|料理|珈琲|コーヒー|菓子|パン|焼肉|寿司|うどん|そば|蕎麦/.test(o.name+' '+o.subcategory))o.major_category='飲食店';return o}function parseBulk(){items=splitBlocks(bulkText.value).map(parseBlock).filter(x=>x.name||x.address);renderPreview()}function renderPreview(){preview.innerHTML='<h3>登録前プレビュー（'+items.length+'店舗）</h3>'+items.map((x,i)=>`<div class="preview"><b>${i+1}. ${x.name||'店名未入力'}</b><div class="row"><div><label>店名</label><input value="${esc(x.name)}" oninput="items[${i}].name=this.value"><label>住所</label><input value="${esc(x.address)}" oninput="items[${i}].address=this.value"><label>ID</label><input value="${esc(x.store_code)}" oninput="items[${i}].store_code=this.value"><label>大分類</label><select onchange="items[${i}].major_category=this.value"><option ${x.major_category==='飲食店'?'selected':''}>飲食店</option><option ${x.major_category!=='飲食店'?'selected':''}>サービス</option></select><label>小分類</label><input value="${esc(x.subcategory)}" oninput="items[${i}].subcategory=this.value"></div><div><label>紹介文</label><textarea oninput="items[${i}].description=this.value">${esc(x.description)}</textarea><label>HP</label><input value="${esc(x.website_url)}" oninput="items[${i}].website_url=this.value"><label>SNS</label><input value="${esc(x.sns_url)}" oninput="items[${i}].sns_url=this.value"><label>Googleマップ</label><input value="${esc(x.google_maps_url)}" oninput="items[${i}].google_maps_url=this.value"></div></div><button class="btn ghost" onclick="items.splice(${i},1);renderPreview()">この店舗を除外</button></div>`).join('');bulkSave.classList.toggle('hide',!items.length)}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function saveBulk(){let valid=items.filter(x=>x.name.trim()&&x.address.trim());if(!valid.length)return bulkMsg.innerHTML='<span class="err">店名と住所が入った店舗がありません。</span>';bulkMsg.textContent='一括登録中…';try{let r=await rpc('jm_admin_bulk_create_stores',{p_region:REGION,p_admin_pin:admin,p_items:valid});if(r.ok){bulkMsg.innerHTML=`<span class="ok">✅ ${r.created}店舗を登録しました。</span>　重複 ${r.duplicates}件 / エラー ${r.errors}件`;if(r.created){items=[];preview.innerHTML='';bulkSave.classList.add('hide')}}else bulkMsg.innerHTML='<span class="err">一括登録できませんでした。</span>'}catch(e){bulkMsg.innerHTML='<span class="err">一括登録できませんでした。</span>'}}config();</script></body></html>
