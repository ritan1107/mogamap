<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOGUマップ 埼玉｜新規店舗・一括登録</title><style>:root{--o:#f28b25;--g:#278668;--bg:#fffaf2;--ink:#292722;--muted:#756f68;--line:#eadfd2;--red:#b42318;--gold:#9a6700}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:1050px;margin:auto;padding:16px 14px 70px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.head h1{margin:0;color:var(--o);font-size:22px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:9px 0}.field label,label{display:block;font-size:12px;font-weight:850;margin-bottom:4px}input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}textarea{min-height:120px}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:850;background:var(--o);color:#fff;text-decoration:none;display:inline-block}.btn.green{background:var(--g)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.red{background:var(--red)}.hide{display:none}.muted{font-size:12px;color:var(--muted)}.preview{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.preview.warn{border-color:#e4b347;background:#fffaf0}.preview.bad{border-color:#efb0aa;background:#fff7f6}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ok{color:#18794e;font-weight:800}.err{color:var(--red);font-weight:800}.warnText{color:var(--gold);font-weight:800}.notice{background:#fff5d5;border:1px solid #edd899;padding:10px;border-radius:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.summary{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pill{background:#f4efe8;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:800}.pill.good{background:#eaf8ef;color:#18794e}.pill.warn{background:#fff2ce;color:#8a5d00}.pill.bad{background:#fdebea;color:#a0251b}.checkline{display:flex;gap:8px;align-items:center;margin:6px 0}.checkline input{width:auto}.quality{font-size:12px;margin:5px 0}.sticky{position:sticky;bottom:10px;z-index:10;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 6px 25px #0001}.mini{font-size:11px;color:var(--muted)}@media(max-width:700px){.grid,.row{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="head"><div><h1>➕ MOGUマップ 埼玉｜新規店舗・一括登録</h1><div class="muted">1店舗・大量コピペ・表形式データに対応</div></div><div class="toolbar"><a class="btn ghost" href="./admin.html">← 一括管理</a><a class="btn ghost" href="./store-manager.html">店舗編集</a></div></div><section id="login" class="card"><h2>管理者ログイン</h2><div class="field"><label>管理者PIN</label><input id="adminPin" type="password" inputmode="numeric"></div><button class="btn" onclick="loginAdmin()">登録画面を開く</button><p id="loginMsg" class="muted"></p></section><div id="app" class="hide"><section class="card"><h2>① 1店舗ずつ登録</h2><div class="grid"><div><div class="field"><label>店舗名 *</label><input id="oneName"></div><div class="field"><label>住所 *</label><input id="oneAddress"></div><div class="field"><label>電話</label><input id="onePhone"></div><div class="field"><label>大分類</label><select id="oneMajor"><option>飲食店</option><option selected>サービス</option></select></div><div class="field"><label>小分類</label><input id="oneSub" placeholder="カフェ、居酒屋、美容など"></div></div><div><div class="field"><label>紹介文</label><textarea id="oneDesc"></textarea></div><div class="field"><label>HP</label><input id="oneWeb"></div><div class="field"><label>SNS</label><input id="oneSns"></div><div class="field"><label>GoogleマップURL</label><input id="oneMap"></div></div></div><div class="toolbar"><button class="btn green" onclick="createOne()">この店舗を登録</button><button class="btn ghost" onclick="openMapSearch(oneName.value,oneAddress.value)">Googleマップで確認</button></div><p id="oneMsg" class="muted"></p></section><section class="card"><h2>② コピペで時短・一括登録</h2><p class="notice">文章形式でも、Excel/スプレッドシートからのタブ区切り貼り付けでもOK。店名・住所・ID・紹介文・HP・SNS・GoogleマップURLなどを自動整理します。登録前に必ずプレビューできます。</p><textarea id="bulkText" placeholder="例：&#10;1. Cafe ABC&#10;ID: abc_001&#10;カテゴリ: カフェ&#10;住所: 埼玉県さいたま市...&#10;紹介文: ...&#10;HP: https://...&#10;&#10;または Excel/スプレッドシートの行をそのまま貼り付け"></textarea><div class="toolbar"><button class="btn" onclick="parseBulk()">自動整理して確認</button><button class="btn ghost" onclick="saveDraft()">下書き保存</button><button class="btn ghost" onclick="loadDraft()">下書きを戻す</button><button class="btn ghost" onclick="clearAll()">クリア</button></div><p class="muted">※自動整理はブラウザ内で行います。店名や住所が曖昧な場合は「要確認」として止め、勝手に確定しません。</p><div id="parseSummary" class="summary"></div><div id="preview"></div><div id="saveBar" class="sticky hide"><div id="selectedSummary" class="muted"></div><div class="toolbar"><button id="bulkSave" class="btn green" onclick="saveBulk()">選択した店舗を一括登録</button><button class="btn ghost" onclick="selectAll(true)">全て選択</button><button class="btn ghost" onclick="selectAll(false)">全て解除</button></div><p id="bulkMsg" class="muted"></p></div></section></div></main><script>let SB='',KEY='',admin='',items=[];const REGION='埼玉県',DRAFT='moguSaitamaBulkDraftV2';async function config(){let t=await fetch('../index.html').then(r=>r.text());SB=(t.match(/const SB='([^']+)'/)||[])[1]||'';KEY=(t.match(/KEY='([^']+)'/)||[])[1]||''}function H(){return{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'}}async function rpc(n,b){let r=await fetch(SB+'/rest/v1/rpc/'+n,{method:'POST',headers:H(),body:JSON.stringify(b)});if(!r.ok)throw Error(await r.text());return r.json()}async function loginAdmin(){admin=adminPin.value.trim();try{if(!await rpc('jm_verify_region_admin_pin',{p_region:REGION,p_pin:admin}))throw 0;login.classList.add('hide');app.classList.remove('hide')}catch{loginMsg.textContent='管理者PINが違います。'}}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function urlOK(v){if(!v)return true;try{let u=new URL(v);return /^https?:$/.test(u.protocol)}catch{return false}}function norm(s){return String(s||'').replace(/[　\s]+/g,'').replace(/[−ー‐–—]/g,'-').toLowerCase()}function categoryGuess(text){let t=String(text||'');if(/カフェ|喫茶|珈琲|コーヒー|居酒屋|食堂|ラーメン|らーめん|レストラン|料理|焼肉|寿司|鮨|うどん|そば|蕎麦|パン|ベーカリー|菓子|ケーキ|スイーツ|バー|bar|ダイニング|弁当|おにぎり|餃子|とんかつ|海鮮/i.test(t))return'飲食店';return'サービス'}async function createOne(){oneMsg.textContent='登録中…';if(!oneName.value.trim()||!oneAddress.value.trim())return oneMsg.innerHTML='<span class="err">店名と住所は必須です。</span>';let b={p_region:REGION,p_admin_pin:admin,p_store_code:'',p_name:oneName.value.trim(),p_address:oneAddress.value.trim(),p_phone:onePhone.value.trim(),p_major_category:oneMajor.value,p_subcategory:oneSub.value.trim()||'その他',p_description:oneDesc.value.trim(),p_website_url:oneWeb.value.trim(),p_sns_url:oneSns.value.trim(),p_community_url:'',p_group_page_url:'',p_google_maps_url:oneMap.value.trim(),p_image_url:''};try{let r=await rpc('jm_admin_create_store',b);if(r.ok){oneMsg.innerHTML='<span class="ok">✅ 登録しました。</span>';['oneName','oneAddress','onePhone','oneSub','oneDesc','oneWeb','oneSns','oneMap'].forEach(id=>document.getElementById(id).value='')}else oneMsg.innerHTML='<span class="err">'+(r.reason==='duplicate'?'同じ店名＋住所の店舗が既にあります。':'登録できませんでした。')+'</span>'}catch{oneMsg.innerHTML='<span class="err">登録できませんでした。</span>'}}function normKey(s){return s.replace(/[：:]/g,'').trim().toLowerCase()}function splitBlocks(t){t=t.replace(/\r/g,'').trim();if(!t)return[];let lines=t.split('\n');let tabLines=lines.filter(x=>x.includes('\t'));if(tabLines.length>=2){let rows=lines.filter(Boolean).map(x=>x.split('\t').map(v=>v.trim()));let first=rows[0].map(normKey),hasHeader=first.some(x=>/店名|店舗名|住所|カテゴリ|紹介|hp|sns|google/.test(x));if(hasHeader){return rows.slice(1).filter(r=>r.some(Boolean)).map(r=>({__table:true,header:first,row:r}))}}let b=t.split(/\n\s*\n+/).map(x=>x.trim()).filter(Boolean);if(b.length===1){b=[];let cur=[];for(let line of lines){if(/^\s*\d+[\.．、)]\s*/.test(line)&&cur.length){b.push(cur.join('\n'));cur=[line]}else cur.push(line)}if(cur.join('').trim())b.push(cur.join('\n'))}return b}function parseTable(x){let o=emptyItem();x.header.forEach((k,i)=>{let v=(x.row[i]||'').trim();assignKey(o,k,v)});if(o.major_category==='サービス')o.major_category=categoryGuess(o.name+' '+o.subcategory);return o}function emptyItem(){return{store_code:'',name:'',address:'',phone:'',major_category:'サービス',subcategory:'その他',description:'',website_url:'',sns_url:'',community_url:'',group_page_url:'',google_maps_url:'',image_url:'',selected:true,warnings:[]}}function assignKey(o,k,v){if(!v)return;if(/^(id|店舗id|店舗コード)$/.test(k))o.store_code=v;else if(/^(店名|店舗名|名前|名称)$/.test(k))o.name=v;else if(/^(住所|所在地)$/.test(k))o.address=v;else if(/^(電話|電話番号|tel)$/.test(k))o.phone=v;else if(/^(カテゴリ|カテゴリー|小分類|業種)$/.test(k)){o.subcategory=v;o.major_category=categoryGuess(v)}else if(/^(大分類)$/.test(k))o.major_category=/飲食/.test(v)?'飲食店':'サービス';else if(/^(紹介文|説明|紹介|メモ|概要)$/.test(k))o.description=v;else if(/^(hp|ホームページ|web|website|url)$/.test(k))o.website_url=v;else if(/^(sns|instagram|インスタ|x|twitter|facebook)$/.test(k))o.sns_url=v;else if(/コミュニティ/.test(k))o.community_url=v;else if(/グループ/.test(k))o.group_page_url=v;else if(/google.*map|googleマップ|地図/.test(k))o.google_maps_url=v;else if(/画像|写真/.test(k))o.image_url=v}function parseBlock(block){if(typeof block==='object')return parseTable(block);let o=emptyItem(),lines=block.split('\n').map(x=>x.trim()).filter(Boolean);for(let i=0;i<lines.length;i++){let line=lines[i].replace(/^\d+[\.．、)]\s*/,'');let m=line.match(/^([^:：]{1,22})[:：]\s*(.*)$/);if(m){assignKey(o,normKey(m[1]),m[2].trim());continue}if(!o.name&&line.length<90&&!/^https?:\/\//.test(line)&&!/(都|道|府|県).*(市|区|町|村)/.test(line)){o.name=line;continue}if(!o.address&&/(都|道|府|県).*(市|区|町|村)/.test(line)){o.address=line;continue}if(/^https?:\/\//.test(line)){if(/google\.[^/]+\/maps|maps\.app\.goo\.gl|goo\.gl\/maps/.test(line))o.google_maps_url=line;else if(/instagram|facebook|twitter|x\.com|tiktok/.test(line))o.sns_url=line;else if(!o.website_url)o.website_url=line;continue}if(!o.description)o.description=line;else o.description+=' '+line}o.major_category=categoryGuess(o.name+' '+o.subcategory+' '+o.description);return o}function analyze(){let seen=new Map();for(let x of items){x.warnings=[];if(!x.name)x.warnings.push('店名なし');if(!x.address)x.warnings.push('住所なし');if(x.address&&!/(都|道|府|県)/.test(x.address))x.warnings.push('都道府県が不明');for(let k of['website_url','sns_url','google_maps_url'])if(x[k]&&!urlOK(x[k]))x.warnings.push(k+'のURL形式');let key=norm(x.name)+'|'+norm(x.address);if(x.name&&x.address){if(seen.has(key)){x.warnings.push('この貼り付け内で重複');items[seen.get(key)].warnings.push('この貼り付け内で重複')}else seen.set(key,items.indexOf(x))}x.quality=Math.max(0,100-(x.warnings.length*22)-(x.description?0:8)-(x.google_maps_url?0:5))}}function parseBulk(){let blocks=splitBlocks(bulkText.value);items=blocks.map(parseBlock).filter(x=>x.name||x.address);analyze();renderPreview()}function qualityClass(x){if(!x.name||!x.address)return'bad';if(x.warnings.length)return'warn';return''}function renderPreview(){analyze();let ready=items.filter(x=>x.selected&&x.name&&x.address&&!x.warnings.some(w=>/重複|店名なし|住所なし/.test(w))).length,warn=items.filter(x=>x.warnings.length).length,dup=items.filter(x=>x.warnings.some(w=>/重複/.test(w))).length;parseSummary.innerHTML=`<span class="pill good">登録候補 ${items.length}件</span><span class="pill good">そのまま登録可能 ${ready}件</span><span class="pill warn">要確認 ${warn}件</span><span class="pill bad">重複候補 ${dup}件</span>`;preview.innerHTML=items.map((x,i)=>`<div class="preview ${qualityClass(x)}"><div class="checkline"><input type="checkbox" ${x.selected?'checked':''} onchange="items[${i}].selected=this.checked;updateSelected()"><b>${i+1}. ${esc(x.name||'店名未入力')}</b></div><div class="quality">精度目安：<b>${x.quality}%</b> ${x.warnings.length?`<span class="warnText">⚠ ${esc([...new Set(x.warnings)].join(' / '))}</span>`:'<span class="ok">✓ 基本項目OK</span>'}</div><div class="row"><div><label>店名 *</label><input value="${esc(x.name)}" oninput="items[${i}].name=this.value;analyze()"><label>住所 *</label><input value="${esc(x.address)}" oninput="items[${i}].address=this.value;analyze()"><label>ID</label><input value="${esc(x.store_code)}" oninput="items[${i}].store_code=this.value"><label>大分類</label><select onchange="items[${i}].major_category=this.value"><option ${x.major_category==='飲食店'?'selected':''}>飲食店</option><option ${x.major_category!=='飲食店'?'selected':''}>サービス</option></select><label>小分類</label><input value="${esc(x.subcategory)}" oninput="items[${i}].subcategory=this.value"></div><div><label>紹介文</label><textarea oninput="items[${i}].description=this.value">${esc(x.description)}</textarea><label>HP</label><input value="${esc(x.website_url)}" oninput="items[${i}].website_url=this.value"><label>SNS</label><input value="${esc(x.sns_url)}" oninput="items[${i}].sns_url=this.value"><label>Googleマップ</label><input value="${esc(x.google_maps_url)}" oninput="items[${i}].google_maps_url=this.value"><div class="toolbar"><button class="btn ghost" type="button" onclick="openMapSearch(items[${i}].name,items[${i}].address)">Googleマップで確認</button><button class="btn red" type="button" onclick="items.splice(${i},1);renderPreview()">除外</button></div></div></div></div>`).join('');saveBar.classList.toggle('hide',!items.length);updateSelected()}function updateSelected(){let a=items.filter(x=>x.selected),valid=a.filter(x=>x.name.trim()&&x.address.trim()&&!x.warnings.some(w=>/この貼り付け内で重複/.test(w)));selectedSummary.textContent=`選択 ${a.length}件 / 登録可能 ${valid.length}件`;bulkSave.disabled=!valid.length}function selectAll(v){items.forEach(x=>x.selected=v);renderPreview()}function openMapSearch(name,address){let q=[name,address].filter(Boolean).join(' ');if(!q)return;window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q),'_blank')}function saveDraft(){localStorage.setItem(DRAFT,JSON.stringify({text:bulkText.value,items,at:new Date().toISOString()}));bulkMsg.innerHTML='<span class="ok">下書きをこの端末に保存しました。</span>'}function loadDraft(){try{let d=JSON.parse(localStorage.getItem(DRAFT)||'null');if(!d)return bulkMsg.innerHTML='<span class="warnText">下書きはありません。</span>';bulkText.value=d.text||'';items=d.items||[];analyze();renderPreview();bulkMsg.innerHTML='<span class="ok">下書きを戻しました。</span>'}catch{bulkMsg.innerHTML='<span class="err">下書きを読み込めませんでした。</span>'}}function clearAll(){if(items.length&&!confirm('入力内容をクリアしますか？'))return;bulkText.value='';items=[];preview.innerHTML='';parseSummary.innerHTML='';saveBar.classList.add('hide');bulkMsg.textContent=''}async function saveBulk(){analyze();let valid=items.filter(x=>x.selected&&x.name.trim()&&x.address.trim()&&!x.warnings.some(w=>/この貼り付け内で重複/.test(w))).map(({selected,warnings,quality,...x})=>x);if(!valid.length)return bulkMsg.innerHTML='<span class="err">登録できる店舗がありません。</span>';if(!confirm(`${valid.length}店舗を登録します。よろしいですか？`))return;bulkMsg.textContent='一括登録中…';try{let r=await rpc('jm_admin_bulk_create_stores',{p_region:REGION,p_admin_pin:admin,p_items:valid});if(r.ok){bulkMsg.innerHTML=`<span class="ok">✅ ${r.created}店舗を登録しました。</span>　重複 ${r.duplicates}件 / エラー ${r.errors}件`;if(r.created){localStorage.removeItem(DRAFT);items=[];preview.innerHTML='';parseSummary.innerHTML='';saveBar.classList.add('hide')}}else bulkMsg.innerHTML='<span class="err">一括登録できませんでした。</span>'}catch{bulkMsg.innerHTML='<span class="err">一括登録できませんでした。</span>'}}config();</script></body></html>
