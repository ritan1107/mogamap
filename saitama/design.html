<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOGUマップ 埼玉｜デザイン設定</title><style>:root{--o:#f28b25;--g:#278668;--bg:#fffaf2;--ink:#292722;--line:#eadfd2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 60px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:5px}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}input[type=color]{height:48px;padding:4px}.btn{border:0;border-radius:11px;padding:11px 14px;background:var(--o);color:#fff;font-weight:900}.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);text-decoration:none;display:inline-block}.hide{display:none}.preview{height:220px;border-radius:18px;overflow:hidden;position:relative;background:#eee;background-size:cover;background-position:center}.preview video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.preview .sample{position:absolute;inset:20px;display:grid;place-items:center}.sample div{background:#ffffffdd;border-radius:16px;padding:18px;font-weight:900}</style></head><body><main class="wrap"><a class="btn ghost" href="./admin.html">← 一括管理へ</a><h1>🎨 MOGUマップ デザイン設定</h1><section id="login" class="card"><div class="field"><label>管理者PIN</label><input id="pin" type="password" inputmode="numeric"></div><button class="btn" onclick="loginAdmin()">設定を開く</button><p id="loginMsg"></p></section><section id="app" class="card hide"><div class="field"><label>背景タイプ</label><select id="bgType"><option value="color">単色</option><option value="image">画像</option><option value="video">動画</option></select></div><div class="field"><label>背景色</label><input id="bgColor" type="color" value="#fffaf2"></div><div class="field"><label>背景画像URL</label><input id="bgImage" placeholder="https://.../image.jpg"></div><div class="field"><label>背景動画URL（mp4推奨）</label><input id="bgVideo" placeholder="https://.../movie.mp4"></div><div class="field"><label>メインカラー</label><input id="accent" type="color" value="#f28b25"></div><div class="field"><label>サブカラー</label><input id="secondary" type="color" value="#278668"></div><div class="field"><label>文字色</label><input id="textColor" type="color" value="#292722"></div><h3>プレビュー</h3><div id="preview" class="preview"><div class="sample"><div>MOGUマップ 埼玉</div></div></div><br><button class="btn" onclick="saveTheme()">このデザインを保存</button><p id="saveMsg"></p></section></main><script>let SB='',KEY='',admin='';const REGION='埼玉県';async function config(){let t=await fetch('../index.html').then(r=>r.text());SB=(t.match(/const SB='([^']+)'/)||[])[1]||'';KEY=(t.match(/KEY='([^']+)'/)||[])[1]||''}function H(){return{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'}}async function rpc(n,b){let r=await fetch(SB+'/rest/v1/rpc/'+n,{method:'POST',headers:H(),body:JSON.stringify(b)});if(!r.ok)throw Error(await r.text());return r.json()}async function loginAdmin(){admin=pin.value.trim();try{if(!await rpc('jm_verify_region_admin_pin',{p_region:REGION,p_pin:admin}))throw 0;login.classList.add('hide');app.classList.remove('hide');await loadTheme()}catch{loginMsg.textContent='管理者PINが違います。'}}async function loadTheme(){let r=await fetch(SB+'/rest/v1/jm_region_theme_settings_public?region=eq.'+encodeURIComponent(REGION)+'&limit=1',{headers:H()});let s=(await r.json())[0]||{};bgType.value=s.background_type||'color';bgColor.value=s.background_color||'#fffaf2';bgImage.value=s.background_image_url||'';bgVideo.value=s.background_video_url||'';accent.value=s.accent_color||'#f28b25';secondary.value=s.secondary_color||'#278668';textColor.value=s.text_color||'#292722';previewTheme()}function previewTheme(){preview.querySelectorAll('video').forEach(v=>v.remove());preview.style.backgroundColor=bgColor.value;preview.style.backgroundImage='none';if(bgType.value==='image'&&bgImage.value)preview.style.backgroundImage=`url("${bgImage.value.replace(/"/g,'')}")`;if(bgType.value==='video'&&bgVideo.value){let v=document.createElement('video');v.src=bgVideo.value;v.autoplay=v.muted=v.loop=v.playsInline=true;preview.prepend(v)}document.documentElement.style.setProperty('--o',accent.value);document.documentElement.style.setProperty('--ink',textColor.value)}async function saveTheme(){try{let ok=await rpc('jm_admin_update_region_theme',{p_region:REGION,p_admin_pin:admin,p_background_type:bgType.value,p_background_color:bgColor.value,p_background_image_url:bgImage.value,p_background_video_url:bgVideo.value,p_accent_color:accent.value,p_secondary_color:secondary.value,p_text_color:textColor.value});saveMsg.textContent=ok?'✅ 保存しました。公開MOGUマップに反映されます。':'保存できませんでした。'}catch{saveMsg.textContent='保存できませんでした。'}}['bgType','bgColor','bgImage','bgVideo','accent','secondary','textColor'].forEach(id=>document.getElementById(id).addEventListener('input',previewTheme));config();</script></body></html>
