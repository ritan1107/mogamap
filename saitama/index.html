<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MOGUマップ 埼玉</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--o:#f28b25;--g:#278668;--bg:#fffaf2;--ink:#292722;--muted:#756f68;--line:#eadfd2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;padding-bottom:76px}button,input,textarea{font:inherit}.head,main{max-width:980px;margin:auto;padding:11px 14px}header{position:sticky;top:0;z-index:900;background:#fffaf2f2;border-bottom:1px solid var(--line)}.brand{font-size:22px;font-weight:950;color:var(--o)}.muted,.small{font-size:12px;color:var(--muted)}.search{display:flex;margin-top:9px;border:1px solid var(--line);background:#fff;border-radius:999px;overflow:hidden}.search input{width:100%;border:0;outline:0;padding:12px 15px}.chips{display:flex;gap:7px;overflow:auto;padding:9px 0}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 11px;font-weight:850}.chip.on{background:var(--o);color:white}.view{display:none}.view.on{display:block}.panel,.shop{background:#fff;border:1px solid var(--line);border-radius:18px}.panel{overflow:hidden}.shop{padding:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.heading{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}.heading h2{margin:0;font-size:19px}#map{height:min(45vh,420px);min-height:300px}.meta{display:flex;justify-content:space-between;padding:10px 13px}.cat{font-size:12px;font-weight:900;color:var(--g)}.shop h3{margin:5px 0}.badges,.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.badge{font-size:11px;padding:4px 7px;border-radius:99px;background:#f3eee7}.btn{border:0;border-radius:11px;padding:9px 11px;font-weight:900;background:var(--o);color:#fff;text-decoration:none;display:inline-block}.btn.green{background:var(--g)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.bottom{position:fixed;z-index:1000;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fffffff2;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.tab{border:0;background:transparent;padding:8px 1px;font-size:10px;font-weight:850}.tab b{display:block;font-size:20px}.tab.on{color:var(--o)}.modal{position:fixed;z-index:1500;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center}.modal.on{display:flex}.sheet{width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px}.close{float:right;border:0;border-radius:50%;width:36px;height:36px}.field{display:flex;flex-direction:column;gap:4px;margin:8px 0;font-size:12px;font-weight:800}.field input,.field textarea{padding:10px;border:1px solid var(--line);border-radius:10px}.field textarea{min-height:70px}.check{display:flex;gap:8px;align-items:center}.stamp{border:2px dashed #dacdbc;border-radius:14px;padding:12px;margin:8px 0}.stamp.got{border-style:solid;border-color:var(--o);background:#fff2df}@media(max-width:650px){.grid{grid-template-columns:1fr}.bottom{grid-template-columns:repeat(5,1fr)}#map{height:38vh}}</style></head><body><header><div class="head"><div class="brand">📍 MOGUマップ 埼玉</div><div class="muted">埼玉のお店・スタンプラリー・仕事・ボランティア</div><div class="search"><input id="q" placeholder="店名・住所・カテゴリで検索"></div><div class="chips" id="chips"></div></div></header><main><section class="view on" id="mapView"><section class="panel"><div id="map"></div><div class="meta muted"><span id="status">読み込み中…</span><span>正確な位置のみ表示</span></div></section><div class="heading"><h2>埼玉のお店</h2><strong id="count">0件</strong></div><div id="list" class="grid"></div></section><section class="view" id="stampView"><div class="heading"><h2>🎫 スタンプラリー</h2></div><div id="stampList"></div></section><section class="view" id="jobView"><div class="heading"><h2>💼 スポットバイト</h2></div><div id="jobList" class="grid"></div></section><section class="view" id="volView"><div class="heading"><h2>🤝 ボランティア</h2></div><div id="volList" class="grid"></div></section><section class="view" id="moreView"><div class="panel" style="padding:16px"><h2>その他</h2><div class="actions"><a class="btn ghost" href="./admin.html">🔐 管理ページ</a></div></div></section></main><nav class="bottom"><button class="tab on" data-v="mapView"><b>🗺️</b>地図</button><button class="tab" data-v="stampView"><b>🎫</b>スタンプ</button><button class="tab" data-v="jobView"><b>💼</b>バイト</button><button class="tab" data-v="volView"><b>🤝</b>募集</button><button class="tab" data-v="moreView"><b>👤</b>その他</button></nav><div class="modal" id="detailModal"><div class="sheet"><button class="close" onclick="closeM('detailModal')">×</button><div id="detail"></div></div></div><div class="modal" id="editModal"><div class="sheet"><button class="close" onclick="closeM('editModal')">×</button><h2>店舗情報を編集</h2><form id="editForm"></form></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
let SB='',KEY='',stores=[],selected='all',stamps=new Set(JSON.parse(localStorage.getItem('saitamaMoguStamps')||'[]'));const q=document.querySelector('#q'),chips=document.querySelector('#chips'),list=document.querySelector('#list'),count=document.querySelector('#count'),statusEl=document.querySelector('#status');const FILTERS=[['all','すべて'],['food','🍴飲食店'],['service','🛍️サービス'],['sa','⭐SA'],['rally','🔴スタンプ'],['job','🟡バイト'],['vol','🩷ボランティア']];FILTERS.forEach(([k,l])=>{let b=document.createElement('button');b.className='chip'+(k==='all'?' on':'');b.dataset.k=k;b.textContent=l;chips.appendChild(b)});const map=L.map('map').setView([35.857,139.649],9),layer=L.layerGroup().addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);async function config(){let t=await fetch('../index.html').then(r=>r.text());SB=(t.match(/const SB='([^']+)'/)||[])[1]||'';KEY=(t.match(/KEY='([^']+)'/)||[])[1]||''}function H(){return {'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'}}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function mapUrl(s){return s.google_maps_url||('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.address))}function match(s){let t=q.value.trim().toLowerCase();if(t&&!(`${s.name} ${s.address} ${s.major_category} ${s.subcategory||''} ${s.description||''}`.toLowerCase().includes(t)))return false;if(selected==='food'&&s.major_category!=='飲食店')return false;if(selected==='service'&&s.major_category!=='サービス')return false;if(selected==='sa'&&!s.sa_member)return false;if(selected==='rally'&&!s.rally_participant)return false;if(selected==='job'&&!s.job_open)return false;if(selected==='vol'&&!s.volunteer_open)return false;return true}function badges(s){let a=[];if(s.sa_member)a.push('⭐SA');if(s.rally_participant)a.push('🔴スタンプ');if(s.job_open)a.push('🟡バイト');if(s.volunteer_open)a.push('🩷募集');if(s.map_location_status!=='verified')a.push('📍位置確認中');return a.map(x=>`<span class="badge">${x}</span>`).join('')}function render(){let a=stores.filter(match);count.textContent=a.length+'件';layer.clearLayers();list.innerHTML=a.map(s=>`<article class="shop"><div class="cat">${esc(s.major_category)} › ${esc(s.subcategory||'その他')}</div><h3>${esc(s.name)}</h3><div class="small">${esc(s.address)}</div><div class="badges">${badges(s)}</div><div class="actions"><button class="btn" onclick="openDetail('${s.id}')">店舗を見る</button><a class="btn ghost" target="_blank" href="${mapUrl(s)}">Googleマップ</a></div></article>`).join('');let pts=[];a.forEach(s=>{if(s.map_location_status==='verified'&&Number.isFinite(s.lat)&&Number.isFinite(s.lng)){pts.push([s.lat,s.lng]);L.marker([s.lat,s.lng]).addTo(layer).bindPopup(`<b>${esc(s.name)}</b>`)}});statusEl.textContent=`埼玉県：${a.length}店舗`;if(pts.length)map.fitBounds(pts,{padding:[25,25],maxZoom:12});renderJobs();renderVol();renderStamps()}function openDetail(id){let s=stores.find(x=>x.id===id);if(!s)return;let links=[s.website_url&&`<a class="btn ghost" target="_blank" href="${esc(s.website_url)}">HP</a>`,s.community_url&&`<a class="btn" target="_blank" href="${esc(s.community_url)}">店舗ページ</a>`,s.group_page_url&&`<a class="btn green" target="_blank" href="${esc(s.group_page_url)}">グループページ</a>`,`<a class="btn ghost" target="_blank" href="${mapUrl(s)}">Googleマップ</a>`].filter(Boolean).join('');document.querySelector('#detail').innerHTML=`${s.image_url?`<img src="${esc(s.image_url)}" alt="" style="width:100%;border-radius:14px">`:''}<h2>${esc(s.name)}</h2><p>${esc(s.address)}</p><p>${esc(s.description||'')}</p><div class="actions">${links}</div><div class="actions"><button class="btn ghost" onclick="openEdit('${s.id}')">✏️ 店舗情報を編集</button></div>`;openM('detailModal')}function openEdit(id){let s=stores.find(x=>x.id===id);if(!s)return;closeM('detailModal');let f=document.querySelector('#editForm');f.dataset.id=id;f.innerHTML=`<div class="field">店舗PIN<input name="pin" type="password" required></div><div class="field">店名<input name="name" value="${esc(s.name)}"></div><div class="field">住所<input name="address" value="${esc(s.address)}"></div><div class="field">電話<input name="phone" value="${esc(s.phone||'')}"></div><div class="field">紹介文<textarea name="description">${esc(s.description||'')}</textarea></div><div class="field">HP<input name="website_url" value="${esc(s.website_url||'')}"></div><div class="field">SNS<input name="sns_url" value="${esc(s.sns_url||'')}"></div><div class="field">店舗ページURL<input name="community_url" value="${esc(s.community_url||'')}"></div><div class="field">グループページURL<input name="group_page_url" value="${esc(s.group_page_url||'')}"></div><div class="field">GoogleマップURL<input name="google_maps_url" value="${esc(s.google_maps_url||'')}"></div><div class="field">画像URL<input name="image_url" value="${esc(s.image_url||'')}"></div><label class="check"><input type="checkbox" name="rally_participant" ${s.rally_participant?'checked':''}>スタンプラリー参加</label><hr><label class="check"><input type="checkbox" name="job_open" ${s.job_open?'checked':''}>スポットバイト募集</label><div class="field">募集タイトル<input name="job_title" value="${esc(s.job_title||'')}"></div><div class="field">仕事内容<textarea name="job_description">${esc(s.job_description||'')}</textarea></div><div class="field">時給<input name="job_hourly_wage" type="number" value="${s.job_hourly_wage||''}"></div><div class="field">日時<input name="job_schedule" value="${esc(s.job_schedule||'')}"></div><div class="field">支払方法<input name="job_payment_method" value="${esc(s.job_payment_method||'')}"></div><div class="field">連絡先<input name="job_contact" value="${esc(s.job_contact||'')}"></div><hr><label class="check"><input type="checkbox" name="volunteer_open" ${s.volunteer_open?'checked':''}>ボランティア募集</label><div class="field">募集タイトル<input name="volunteer_title" value="${esc(s.volunteer_title||'')}"></div><div class="field">内容<textarea name="volunteer_description">${esc(s.volunteer_description||'')}</textarea></div><div class="field">日時<input name="volunteer_schedule" value="${esc(s.volunteer_schedule||'')}"></div><div class="field">連絡先<input name="volunteer_contact" value="${esc(s.volunteer_contact||'')}"></div><button class="btn" type="submit">保存する</button><div id="editMsg" class="small"></div>`;openM('editModal')}document.querySelector('#editForm').addEventListener('submit',async e=>{e.preventDefault();let f=e.currentTarget,d=Object.fromEntries(new FormData(f));let s=stores.find(x=>x.id===f.dataset.id),body={p_store_id:s.id,p_pin:d.pin,p_name:d.name,p_address:d.address,p_phone:d.phone||'',p_description:d.description||'',p_website_url:d.website_url||'',p_sns_url:d.sns_url||'',p_community_url:d.community_url||'',p_group_page_url:d.group_page_url||'',p_google_maps_url:d.google_maps_url||'',p_image_url:d.image_url||'',p_rally_participant:!!f.rally_participant.checked,p_job_open:!!f.job_open.checked,p_job_title:d.job_title||'',p_job_description:d.job_description||'',p_job_hourly_wage:d.job_hourly_wage?Number(d.job_hourly_wage):null,p_job_schedule:d.job_schedule||'',p_job_payment_method:d.job_payment_method||'',p_job_contact:d.job_contact||'',p_volunteer_open:!!f.volunteer_open.checked,p_volunteer_title:d.volunteer_title||'',p_volunteer_description:d.volunteer_description||'',p_volunteer_schedule:d.volunteer_schedule||'',p_volunteer_contact:d.volunteer_contact||''};let r=await fetch(SB+'/rest/v1/rpc/jm_update_store_with_pin',{method:'POST',headers:H(),body:JSON.stringify(body)});let ok=r.ok&&await r.json();document.querySelector('#editMsg').textContent=ok?'保存しました':'PINが違うか、保存できませんでした';if(ok){await load();setTimeout(()=>closeM('editModal'),500)}});function renderJobs(){let a=stores.filter(s=>s.job_open);document.querySelector('#jobList').innerHTML=a.length?a.map(s=>`<article class="shop"><h3>${esc(s.job_title||s.name)}</h3><div class="small">${esc(s.name)}</div><p>${esc(s.job_description||'')}</p><p>${s.job_hourly_wage?'時給 '+s.job_hourly_wage+'円<br>':''}${esc(s.job_schedule||'')}</p><button class="btn" onclick="openDetail('${s.id}')">店舗を見る</button></article>`).join(''):'<p class="muted">現在募集中の店舗はありません。</p>'}function renderVol(){let a=stores.filter(s=>s.volunteer_open);document.querySelector('#volList').innerHTML=a.length?a.map(s=>`<article class="shop"><h3>${esc(s.volunteer_title||s.name)}</h3><div class="small">${esc(s.name)}</div><p>${esc(s.volunteer_description||'')}</p><p>${esc(s.volunteer_schedule||'')}</p><button class="btn" onclick="openDetail('${s.id}')">店舗を見る</button></article>`).join(''):'<p class="muted">現在募集中の店舗はありません。</p>'}function renderStamps(){let a=stores.filter(s=>s.rally_participant);document.querySelector('#stampList').innerHTML=a.length?a.map(s=>`<div class="stamp ${stamps.has(s.id)?'got':''}"><b>${esc(s.name)}</b> ${stamps.has(s.id)?'✅':''}<div class="actions"><button class="btn" onclick="getStamp('${s.id}')">スタンプを押す</button></div></div>`).join(''):'<p class="muted">現在参加店はありません。</p>'}async function getStamp(id){let pin=prompt('店舗スタッフに店舗PINを入力してもらってください');if(!pin)return;let r=await fetch(SB+'/rest/v1/rpc/jm_verify_store_pin',{method:'POST',headers:H(),body:JSON.stringify({p_store_id:id,p_pin:pin})});let ok=r.ok&&await r.json();if(ok){stamps.add(id);localStorage.setItem('saitamaMoguStamps',JSON.stringify([...stamps]));renderStamps();alert('スタンプGET！')}else alert('店舗PINが違います')}function openM(id){document.getElementById(id).classList.add('on')}function closeM(id){document.getElementById(id).classList.remove('on')}async function load(){await config();let sel='id,store_code,name,address,phone,major_category,subcategory,description,website_url,sns_url,community_url,group_page_url,google_maps_url,image_url,lat,lng,sa_member,rally_participant,job_open,job_title,job_description,job_hourly_wage,job_schedule,job_payment_method,job_contact,volunteer_open,volunteer_title,volunteer_description,volunteer_schedule,volunteer_contact,created_at,map_location_status';let r=await fetch(SB+'/rest/v1/jm_stores?select='+sel+'&status=eq.active&prefecture=eq.'+encodeURIComponent('埼玉県')+'&order=name.asc&limit=200',{headers:H()});stores=await r.json();render()}q.addEventListener('input',render);chips.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;selected=b.dataset.k;[...chips.children].forEach(x=>x.classList.toggle('on',x===b));render()});document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));document.getElementById(b.dataset.v).classList.add('on');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));if(b.dataset.v==='mapView')setTimeout(()=>map.invalidateSize(),50)}));load();
</script></body></html>
