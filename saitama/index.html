<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MOGUマップ 埼玉</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--o:#f28b25;--g:#2f9d68;--bg:#fffaf2;--ink:#292722;--muted:#756f68;--line:#eadfd2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;padding-bottom:76px}button,input{font:inherit}.head,main{max-width:980px;margin:auto;padding:12px 14px}header{position:sticky;top:0;z-index:900;background:#fffaf2f2;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.brand{font-size:23px;font-weight:950;color:var(--o)}.sub,.small{font-size:12px;color:var(--muted)}.search{display:flex;margin-top:10px;border:1px solid var(--line);background:#fff;border-radius:999px;overflow:hidden}.search input{width:100%;border:0;outline:0;padding:13px 15px}.chips{display:flex;gap:7px;overflow:auto;padding:10px 0 2px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 12px;font-weight:850}.chip.on{background:var(--o);color:#fff;border-color:var(--o)}.panel,.shop{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 7px 22px #5b3b1812}.panel{overflow:hidden}#map{height:min(45vh,420px);min-height:300px}.meta{display:flex;justify-content:space-between;gap:8px;padding:10px 13px;font-size:12px;color:var(--muted)}.heading{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}.heading h2{margin:0;font-size:19px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.shop{padding:14px}.shop h3{margin:5px 0}.cat{font-size:12px;font-weight:900;color:var(--g)}.badges{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.badge{font-size:11px;padding:4px 7px;border-radius:99px;background:#f3eee7;font-weight:850}.new{background:#dff7e9}.sa{background:#fff1b8}.rally{background:#ffe1e3}.job{background:#fff0b8}.vol{background:#ffe0ef}.pending{background:#eef1f5}.desc{font-size:13px;line-height:1.55}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:11px;padding:9px 12px;font-weight:900;background:var(--o);color:#fff;text-decoration:none}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.empty{text-align:center;padding:28px;color:var(--muted)}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffffff3;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;z-index:1000;padding-bottom:env(safe-area-inset-bottom)}.bottom a{text-align:center;padding:12px;text-decoration:none;color:var(--ink);font-weight:850}@media(max-width:650px){.grid{grid-template-columns:1fr}#map{height:38vh}}</style></head><body><header><div class="head"><div class="brand">📍 MOGUマップ 埼玉</div><div class="sub">埼玉のお店・スタンプラリー・仕事・ボランティアを見つけよう</div><div class="search"><input id="q" placeholder="店名・住所・カテゴリで検索" aria-label="店舗検索"></div><div class="chips" id="chips"></div></div></header><main><section class="panel"><div id="map"></div><div class="meta"><span id="status">埼玉県の参加店を読み込み中…</span><span>正確な位置のみピン表示</span></div></section><div class="heading"><h2>埼玉のお店を探す</h2><strong id="count">0件</strong></div><div id="list" class="grid"></div></main><nav class="bottom"><a href="./">🗺️ 埼玉マップ</a><a href="./admin.html">🔐 管理ページ</a></nav><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const FILTERS=[['all','すべて'],['food','🍴飲食店'],['service','🛍️サービス'],['sa','⭐ SA'],['new','🟢 NEW'],['rally','🔴スタンプ'],['job','🟡バイト'],['vol','🩷ボランティア']];let SB='',KEY='',stores=[],selected='all';const q=document.querySelector('#q'),chips=document.querySelector('#chips'),list=document.querySelector('#list'),count=document.querySelector('#count'),statusEl=document.querySelector('#status');FILTERS.forEach(([k,l])=>{const b=document.createElement('button');b.className='chip'+(k==='all'?' on':'');b.dataset.k=k;b.textContent=l;chips.appendChild(b)});const map=L.map('map').setView([35.857,139.649],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);const layer=L.layerGroup().addTo(map);
async function config(){const t=await fetch('../index.html').then(r=>r.text());SB=(t.match(/const SB='([^']+)'/)||[])[1]||'';KEY=(t.match(/KEY='([^']+)'/)||[])[1]||'';if(!SB||!KEY)throw Error('config')}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function isNew(s){return Date.now()-new Date(s.created_at).getTime()<=2592000000}function color(s){if(s.rally_participant)return'#dd3f46';if(s.job_open)return'#e5b72f';if(s.volunteer_open)return'#dc6fa2';if(isNew(s))return'#2f9d68';if(s.sa_member)return'#b98a16';return'#2878d0'}function icon(c){return L.divIcon({className:'',html:`<div style="width:22px;height:22px;border-radius:50% 50% 50% 0;background:${c};border:3px solid white;box-shadow:0 2px 7px #0005;transform:rotate(-45deg)"></div>`,iconSize:[22,22],iconAnchor:[11,22]})}function badges(s){const a=[];if(s.sa_member)a.push('<span class="badge sa">SA加盟店</span>');if(isNew(s))a.push('<span class="badge new">NEW</span>');if(s.rally_participant)a.push('<span class="badge rally">スタンプ参加</span>');if(s.job_open)a.push('<span class="badge job">バイト</span>');if(s.volunteer_open)a.push('<span class="badge vol">ボランティア</span>');if(s.map_location_status!=='verified')a.push('<span class="badge pending">位置確認中</span>');return a.join('')}function match(s){const t=q.value.trim().toLowerCase();if(t&&!`${s.name} ${s.address} ${s.major_category} ${s.subcategory||''} ${s.description||''}`.toLowerCase().includes(t))return false;if(selected==='food'&&s.major_category!=='飲食店')return false;if(selected==='service'&&s.major_category!=='サービス')return false;if(selected==='sa'&&!s.sa_member)return false;if(selected==='new'&&!isNew(s))return false;if(selected==='rally'&&!s.rally_participant)return false;if(selected==='job'&&!s.job_open)return false;if(selected==='vol'&&!s.volunteer_open)return false;return true}function render(){const a=stores.filter(match);count.textContent=a.length+'件';layer.clearLayers();list.innerHTML=a.length?'':'<div class="empty">条件に合うお店がありません。</div>';let pts=[];a.forEach(s=>{const e=document.createElement('article');e.className='shop';const links=[s.website_url&&`<a class="btn ghost" target="_blank" rel="noopener" href="${esc(s.website_url)}">HP</a>`,s.community_url&&`<a class="btn" target="_blank" rel="noopener" href="${esc(s.community_url)}">店舗ページ</a>`].filter(Boolean).join('');e.innerHTML=`<div class="cat">${esc(s.major_category)} › ${esc(s.subcategory||'その他')}</div><h3>${esc(s.name)}</h3><div class="small">${esc(s.address)}</div><div class="badges">${badges(s)}</div>${s.description?`<div class="desc">${esc(s.description)}</div>`:''}${links?`<div class="actions">${links}</div>`:''}`;list.appendChild(e);if(s.map_location_status==='verified'&&Number.isFinite(s.lat)&&Number.isFinite(s.lng)){pts.push([s.lat,s.lng]);L.marker([s.lat,s.lng],{icon:icon(color(s))}).addTo(layer).bindPopup(`<b>${esc(s.name)}</b><br>${esc(s.address)}`)}});statusEl.textContent=`埼玉県：${a.length}店舗 / 正確な位置のみ地図表示`;if(pts.length)map.fitBounds(pts,{padding:[25,25],maxZoom:12});else map.setView([35.857,139.649],9)}async function load(){try{await config();const u=SB+'/rest/v1/jm_stores?select=id,store_code,name,address,major_category,subcategory,description,website_url,community_url,lat,lng,sa_member,rally_participant,job_open,volunteer_open,created_at,map_location_status&status=eq.active&prefecture=eq.'+encodeURIComponent('埼玉県')+'&order=name.asc&limit=200';const r=await fetch(u,{headers:{apikey:KEY}});if(!r.ok)throw Error(await r.text());stores=await r.json();render()}catch(e){statusEl.textContent='店舗データの読み込みに失敗しました';list.innerHTML='<div class="empty">再読み込みしてください。</div>'}}q.addEventListener('input',render);chips.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;selected=b.dataset.k;[...chips.children].forEach(x=>x.classList.toggle('on',x===b));render()});load();
</script></body></html>
