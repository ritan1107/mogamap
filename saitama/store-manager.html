<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOGUマップ 埼玉｜店舗管理</title><style>:root{--o:#f28b25;--g:#278668;--bg:#fffaf2;--ink:#292722;--muted:#756f68;--line:#eadfd2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:900px;margin:auto;padding:16px 14px 60px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.head h1{font-size:22px;color:var(--o);margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:14px}input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit}textarea{min-height:90px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:4px}.btn{display:inline-block;border:0;border-radius:11px;padding:10px 13px;background:var(--o);color:#fff;font-weight:850;text-decoration:none}.btn.green{background:var(--g)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.hide{display:none}.muted{font-size:12px;color:var(--muted)}.store{display:grid;grid-template-columns:1fr auto;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.name{font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;gap:8px;align-items:center;margin:9px 0}.check input{width:auto}@media(max-width:650px){.grid,.store{grid-template-columns:1fr}.btn{width:100%;text-align:center;margin-top:5px}}</style></head><body><main class="wrap"><div class="head"><div><h1>🏪 MOGUマップ 埼玉｜店舗管理</h1><div class="muted">編集したい1店舗を選んで開く専用ページ</div></div><a href="./admin.html">← 一括管理</a></div><section id="login" class="card"><h2>管理者ログイン</h2><div class="field"><label>管理者PIN</label><input id="pin" type="password" inputmode="numeric"></div><button class="btn" onclick="loginAdmin()">店舗一覧を開く</button><p id="msg" class="muted"></p></section><div id="app" class="hide"><section id="list" class="card"><h2>編集する店舗を選ぶ</h2><input id="q" placeholder="店名・住所・店舗IDで検索"><div id="count" class="muted" style="margin:10px 0"></div><div id="stores"></div></section><section id="editor" class="card hide"><button class="btn ghost" onclick="backList()">← 店舗一覧に戻る</button><h2 id="title" style="margin-top:15px"></h2><form id="form"></form></section></div></main><script>let SB='',KEY='',admin='',data=[],editing=null;const REGION='埼玉県';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function config(){let t=await fetch('../index.html').then(r=>r.text());SB=(t.match(/const SB='([^']+)'/)||[])[1]||'';KEY=(t.match(/KEY='([^']+)'/)||[])[1]||''}function H(){return{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'}}async function rpc(n,b){let r=await fetch(SB+'/rest/v1/rpc/'+n,{method:'POST',headers:H(),body:JSON.stringify(b)});if(!r.ok)throw Error(await r.text());return r.json()}async function loginAdmin(){admin=pin.value.trim();try{if(!await rpc('jm_verify_region_admin_pin',{p_region:REGION,p_pin:admin}))throw 0;login.classList.add('hide');app.classList.remove('hide');await load()}catch{msg.textContent='管理者PINが違います。'}}async function load(){let s='id,store_code,name,address,phone,description,website_url,sns_url,community_url,group_page_url,google_maps_url,image_url,sa_member,rally_participant,job_open,job_title,job_description,job_hourly_wage,job_schedule,job_payment_method,job_contact,volunteer_open,volunteer_title,volunteer_description,volunteer_schedule,volunteer_contact';let r=await fetch(SB+'/rest/v1/jm_stores?select='+s+'&prefecture=eq.'+encodeURIComponent(REGION)+'&order=name.asc&limit=200',{headers:H()});data=await r.json();render()}function render(){let x=q.value.trim().toLowerCase(),a=data.filter(s=>!x||(`${s.store_code} ${s.name} ${s.address}`).toLowerCase().includes(x));count.textContent=a.length+'店舗';stores.innerHTML=a.map(s=>`<div class="store"><div><div class="name">${esc(s.name)}</div><div class="muted">${esc(s.address)}<br>ID：${esc(s.store_code)}</div></div><button class="btn" onclick="openStore('${s.id}')">この店舗を編集</button></div>`).join('')}function field(label,name,v='',type='text'){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(v)}"></div>`}function openStore(id){editing=data.find(x=>x.id===id);if(!editing)return;list.classList.add('hide');editor.classList.remove('hide');title.textContent='✏️ '+editing.name;form.innerHTML=field('店名','name',editing.name)+field('住所','address',editing.address)+field('電話','phone',editing.phone)+`<div class="field"><label>紹介文</label><textarea name="description">${esc(editing.description||'')}</textarea></div>`+field('ホームページURL','website_url',editing.website_url)+field('SNS URL','sns_url',editing.sns_url)+field('店舗ページURL','community_url',editing.community_url)+field('グループページURL','group_page_url',editing.group_page_url)+field('GoogleマップURL','google_maps_url',editing.google_maps_url)+field('画像URL','image_url',editing.image_url)+`<label class="check"><input name="sa_member" type="checkbox" ${editing.sa_member?'checked':''}>⭐ SA加盟店</label><label class="check"><input name="rally_participant" type="checkbox" ${editing.rally_participant?'checked':''}>🎫 スタンプラリー参加</label><label class="check"><input name="job_open" type="checkbox" ${editing.job_open?'checked':''}>💼 スポットバイト募集</label>`+field('バイトタイトル','job_title',editing.job_title)+`<div class="field"><label>仕事内容</label><textarea name="job_description">${esc(editing.job_description||'')}</textarea></div>`+field('時給','job_hourly_wage',editing.job_hourly_wage||'','number')+field('バイト日時','job_schedule',editing.job_schedule)+field('支払方法','job_payment_method',editing.job_payment_method)+field('バイト連絡先','job_contact',editing.job_contact)+`<label class="check"><input name="volunteer_open" type="checkbox" ${editing.volunteer_open?'checked':''}>🤝 ボランティア募集</label>`+field('募集タイトル','volunteer_title',editing.volunteer_title)+`<div class="field"><label>募集内容</label><textarea name="volunteer_description">${esc(editing.volunteer_description||'')}</textarea></div>`+field('募集日時','volunteer_schedule',editing.volunteer_schedule)+field('募集連絡先','volunteer_contact',editing.volunteer_contact)+`<button class="btn green" type="submit">この店舗を保存</button><a class="btn ghost" href="./?store=${encodeURIComponent(editing.id)}" target="_blank">公開ページを見る</a><p id="saveMsg" class="muted"></p>`;scrollTo(0,0)}function backList(){editor.classList.add('hide');list.classList.remove('hide');editing=null}form.addEventListener('submit',async e=>{e.preventDefault();let f=e.currentTarget,d=Object.fromEntries(new FormData(f));let b={p_region:REGION,p_admin_pin:admin,p_store_id:editing.id,p_name:d.name,p_address:d.address,p_phone:d.phone||'',p_description:d.description||'',p_website_url:d.website_url||'',p_sns_url:d.sns_url||'',p_community_url:d.community_url||'',p_group_page_url:d.group_page_url||'',p_google_maps_url:d.google_maps_url||'',p_image_url:d.image_url||'',p_sa_member:f.sa_member.checked,p_rally_participant:f.rally_participant.checked,p_job_open:f.job_open.checked,p_job_title:d.job_title||'',p_job_description:d.job_description||'',p_job_hourly_wage:d.job_hourly_wage?Number(d.job_hourly_wage):null,p_job_schedule:d.job_schedule||'',p_job_payment_method:d.job_payment_method||'',p_job_contact:d.job_contact||'',p_volunteer_open:f.volunteer_open.checked,p_volunteer_title:d.volunteer_title||'',p_volunteer_description:d.volunteer_description||'',p_volunteer_schedule:d.volunteer_schedule||'',p_volunteer_contact:d.volunteer_contact||''};try{let ok=await rpc('jm_admin_update_store',b);saveMsg.textContent=ok?'✅ 保存しました。公開ページにも反映されます。':'保存できませんでした。';if(ok)await load()}catch{saveMsg.textContent='保存できませんでした。'}});q.addEventListener('input',render);config();</script></body></html>
