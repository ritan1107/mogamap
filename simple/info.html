<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://lgidhjxowpueglduphzp.supabase.co; media-src 'self' blob: data: https:; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://www.instagram.com https://www.tiktok.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#c49a3a">
<title>もぐマップ情報局｜お知らせ・マルシェ・お店紹介</title>
<meta name="description" content="もぐマップのお知らせ、マルシェ・イベント情報、お店紹介、CM動画。">
<link rel="stylesheet" href="core.css?v=5">
<style>
.ihero{position:relative;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 12px 26px rgba(120,90,60,.12)}
.ihero img{display:block;width:100%;height:170px;object-fit:cover;object-position:center 40%}
.ihero div{padding:12px 16px 14px}
.ihero h1{margin:0;font-size:22px;color:var(--ink)}
.ihero p{margin:3px 0 0;color:var(--muted);font-weight:700;font-size:14px}
.kinds{display:flex;gap:6px;overflow-x:auto;margin:14px -2px 4px;padding:2px;scrollbar-width:none}
.kinds::-webkit-scrollbar{display:none}
.kinds button{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-weight:900;font-size:14px;cursor:pointer;color:var(--ink)}
.kinds button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.post{background:#fff;border-radius:22px;margin-top:14px;overflow:hidden;box-shadow:0 8px 20px rgba(120,90,60,.09);border:1.5px solid var(--line)}
.post.pin{border-color:#f3c48f}
.post .pimg{display:block;width:100%;max-height:420px;object-fit:cover;background:#f6f1ea}
.post .pin-l{background:#fff3e6;color:#c26a12;font-weight:900;font-size:12.5px;padding:5px 14px}
.post .in{padding:14px 16px 16px}
.post .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);font-weight:700}
.kt{border-radius:999px;padding:2px 10px;font-weight:900;font-size:12px}
.kt.news{background:#e9f5f4;color:var(--teal)}.kt.event{background:#fde8ef;color:var(--pink)}.kt.shop{background:#fff3e6;color:#c26a12}.kt.video{background:#efeafc;color:#6a4fc2}
.post h2{margin:6px 0 4px;font-size:19px;line-height:1.4;color:var(--ink)}
.post .when{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0;font-weight:900;font-size:14px}
.post .when span{background:#fff8ef;border:1.5px solid #f3dcc0;border-radius:12px;padding:4px 10px}
.post .body{font-size:15px;line-height:1.75;white-space:normal;word-break:break-word;margin-top:6px}
.post .body a{color:var(--teal);word-break:break-all}
.vbox{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;margin-top:10px}
.vbox.tall{aspect-ratio:9/16;max-width:340px;margin-left:auto;margin-right:auto}
.vbox iframe,.vbox video{position:absolute;inset:0;width:100%;height:100%;border:0}
.vlink{display:flex;align-items:center;gap:10px;margin-top:10px;border:1.5px solid var(--line);border-radius:14px;padding:12px;text-decoration:none;color:var(--ink);font-weight:900}
.vlink span{font-size:26px}
.plinks{display:grid;gap:8px;margin-top:12px}
.plinks .btn{margin:0}
.slide{position:relative;display:block;height:200px;border-radius:22px;overflow:hidden;text-decoration:none;color:#fff;background:linear-gradient(135deg,#64c5c6,#ef9aaa)}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide .sh{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.62))}
.slide .sh small{display:inline-block;background:rgba(255,255,255,.92);color:var(--ink);border-radius:999px;padding:2px 9px;font-weight:900;font-size:11.5px}
.slide .sh b{display:block;font-size:18px;line-height:1.35;margin-top:5px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.slide.noimg .sh{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;background:none;padding:20px}
.slide.noimg .em{position:absolute;right:14px;top:10px;font-size:54px;opacity:.35}
#slideWrap{margin-top:14px}
.voice-cta{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;border:2px dashed #f2b8cb;background:#fff;border-radius:20px;padding:13px 15px;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.voice-cta span{font-size:30px}.voice-cta div{flex:1}.voice-cta b{display:block;font-size:16.5px}.voice-cta small{color:var(--muted);font-size:12.5px;font-weight:700}.voice-cta i{font-style:normal;font-size:24px;color:var(--pink)}
.by{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:13px;font-weight:800;color:var(--muted)}
.kt.voice{background:#fff1f6;color:var(--pink)}
.mine{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:6px;font-size:13.5px}
.mine .s{font-size:11.5px;font-weight:900;border-radius:999px;padding:1px 8px;margin-right:4px}.s.pending{background:#fff3e6;color:#c26a12}.s.published{background:#e9f5f4;color:var(--teal)}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="./" style="text-decoration:none;color:inherit"><small>MOGU MAP</small>もぐマップ情報局</a>
    <a class="btn ghost small" href="./" style="width:auto;margin:0">🎯 スタンプへ</a>
  </header>

  <a class="fest-banner" id="festBanner" href="./"></a>
  <div class="ihero fest-glow">
    <img src="img/top.jpg?v=1" alt="もぐマップの街のイラスト" width="1200" height="675">
    <div><h1>📣 お知らせ・マルシェ情報</h1><p>イベントの告知、おすすめのお店、CM動画をお届けします</p></div>
  </div>

  <div id="slideWrap" class="hidden">
    <div class="slider" id="slider"></div>
    <div class="dots" id="dots"></div>
  </div>

  <button class="voice-cta" id="voiceOpen"><span>✍️</span><div><b>体験・おすすめを投稿する</b><small>行ったお店、おいしかったもの、教えてね</small></div><i>›</i></button>

  <div class="kinds" id="kinds">
    <button class="on" data-k="">すべて</button>
    <button data-k="news">📢 お知らせ</button>
    <button data-k="event">🎪 マルシェ・イベント</button>
    <button data-k="shop">🏪 お店から</button>
    <button data-k="voice">💬 みんなの声</button>
    <button data-k="video">🎬 動画</button>
  </div>
  <div id="posts"><div class="empty">読み込み中…</div></div>
</div>
<div class="modal" id="voiceModal"><div class="sheet">
  <div class="sheet-head"><b>✍️ 体験・おすすめを投稿</b><button class="x" data-close="voiceModal">×</button></div>
  <div id="voiceBody"></div>
</div></div>
<div id="toast"></div>

<script src="core.js?v=6"></script>
<script>
const KIND={news:['📢','お知らせ'],event:['🎪','マルシェ・イベント'],shop:['🏪','お店紹介'],video:['🎬','動画'],voice:['💬','みんなの声']};
let posts=[],kind=new URLSearchParams(location.search).get('k')||'';

function safeUrl(v){try{const u=new URL(String(v||'').trim());return u.protocol==='https:'?u:null}catch{return null}}
// 本文：改行とURLだけ反映（HTMLは入れない）
function bodyHtml(t){
  return esc(t||'').replace(/https:\/\/[^\s<]+/g,m=>`<a href="${m}" target="_blank" rel="noopener noreferrer">${m}</a>`).replace(/\n/g,'<br>');
}
// 動画URL → 埋めこみ
function videoHtml(raw){
  const u=safeUrl(raw);if(!u)return '';
  const h=u.hostname.replace(/^www\.|^m\./,''),p=u.pathname;let m;
  if(h==='youtu.be'&&(m=p.match(/^\/([\w-]{6,})/)))return yt(m[1],false);
  if(h.endsWith('youtube.com')){
    if((m=p.match(/^\/shorts\/([\w-]{6,})/)))return yt(m[1],true);
    if((m=p.match(/^\/(?:embed|live)\/([\w-]{6,})/)))return yt(m[1],false);
    const v=u.searchParams.get('v');if(v&&/^[\w-]{6,}$/.test(v))return yt(v,false);
  }
  if(h==='instagram.com'&&(m=p.match(/^\/(p|reel|reels|tv)\/([\w-]+)/)))return `<div class="vbox tall"><iframe src="https://www.instagram.com/${m[1]==='reels'?'reel':m[1]}/${m[2]}/embed" loading="lazy" allowfullscreen title="Instagram"></iframe></div>`;
  if(h==='tiktok.com'&&(m=p.match(/\/video\/(\d+)/)))return `<div class="vbox tall"><iframe src="https://www.tiktok.com/embed/v2/${m[1]}" loading="lazy" allowfullscreen title="TikTok"></iframe></div>`;
  if(h==='vimeo.com'&&(m=p.match(/^\/(\d+)/)))return `<div class="vbox"><iframe src="https://player.vimeo.com/video/${m[1]}" loading="lazy" allow="fullscreen; picture-in-picture" allowfullscreen title="Vimeo"></iframe></div>`;
  if(/\.(mp4|webm|mov)$/i.test(p))return `<div class="vbox"><video src="${esc(u.href)}" controls playsinline preload="metadata"></video></div>`;
  return `<a class="vlink" href="${esc(u.href)}" target="_blank" rel="noopener noreferrer"><span>▶️</span>動画を見る<small class="muted" style="margin-left:auto">${esc(h)}</small></a>`;
}
function yt(id,tall){return `<div class="vbox${tall?' tall':''}"><iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0&playsinline=1" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen title="YouTube"></iframe></div>`}
const fmtDate=d=>{if(!d)return '';const x=new Date(d);return isNaN(x)?'':`${x.getMonth()+1}/${x.getDate()}`};
const fmtEvent=d=>{if(!d)return '';const x=new Date(d+'T00:00:00+09:00');return `${x.getFullYear()}年${x.getMonth()+1}月${x.getDate()}日（${'日月火水木金土'[x.getDay()]}）`};

function render(){
  const rows=posts.filter(p=>!kind||p.kind===kind||(kind==='video'&&p.video_url)||(kind==='shop'&&p.author_type==='shop'));
  document.querySelectorAll('#kinds button').forEach(b=>b.classList.toggle('on',b.dataset.k===kind));
  if(!rows.length){$('posts').innerHTML=`<div class="empty">${kind?'この種類のお知らせは、まだありません':'お知らせは、まだありません'}<br>また見に来てね 🌱</div>`;return}
  $('posts').innerHTML=rows.map(p=>{
    const k=KIND[p.kind]||KIND.news,link=safeUrl(p.link_url);
    return `<article class="post ${p.pinned?'pin':''}" id="p-${esc(p.id)}">
      ${p.pinned?'<div class="pin-l">📌 注目</div>':''}
      ${p.has_image?`<img class="pimg lazy" data-pid="${esc(p.id)}" data-v="${esc(p.v)}" alt="">`:''}
      <div class="in">
        <div class="meta"><span class="kt ${esc(p.kind)}">${k[0]} ${k[1]}</span><span>${fmtDate(p.date)}</span></div>
        <h2>${esc(p.title)}</h2>
        ${p.author_type==='shop'&&p.author_name?`<div class="by">🏪 ${esc(p.author_name)} からのお知らせ</div>`:p.author_type==='guest'?`<div class="by">💬 ${esc(p.author_name||'参加者')} さんの体験${p.shop_name?`（${esc(p.shop_name)}）`:''}</div>`:''}
        ${p.event_date||p.event_place?`<div class="when">${p.event_date?`<span>📅 ${fmtEvent(p.event_date)}</span>`:''}${p.event_place?`<span>📍 ${esc(p.event_place)}</span>`:''}</div>`:''}
        ${p.body?`<div class="body">${bodyHtml(p.body)}</div>`:''}
        ${p.video_url?videoHtml(p.video_url):''}
        <div class="plinks">
          ${p.shop_id&&p.shop_name?`<a class="btn pink" href="./?shop=${encodeURIComponent(p.shop_id)}">🏪 ${esc(p.shop_name)} を見る</a>`:''}
          ${link?`<a class="btn ghost" href="${esc(link.href)}" target="_blank" rel="noopener noreferrer">${esc(p.link_label||'くわしく見る')} ›</a>`:''}
        </div>
      </div>
    </article>`}).join('');
  lazyScan();
}
/* 画像は見える位置に来たときだけ読む＋このスマホに保存（通信量の節約） */
const imgMem={};
function postImage(id,v){const key=`mogu_pimg_${id}_${v}`;return imgMem[key]||(imgMem[key]=fetchPostImage(id,v,key))}
async function fetchPostImage(id,v,key){
  try{const c=localStorage.getItem(key);if(c)return c}catch{}
  const d=await rpc('mogu_post_image',{p_id:id});if(!d||!/^data:image\//.test(d))return '';
  try{Object.keys(localStorage).filter(k=>k.startsWith(`mogu_pimg_${id}_`)).forEach(k=>localStorage.removeItem(k));localStorage.setItem(key,d)}
  catch{try{Object.keys(localStorage).filter(k=>k.startsWith('mogu_pimg_')).slice(0,5).forEach(k=>localStorage.removeItem(k))}catch{}}
  return d;
}
const lazyIO='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;lazyIO.unobserve(e.target);loadImg(e.target)}),{rootMargin:'300px 300px'}):null;
async function loadImg(el){try{const d=await postImage(el.dataset.pid,el.dataset.v);if(d)el.src=d;else el.remove()}catch(e){console.warn(e)}}
function lazyScan(){document.querySelectorAll('img.lazy:not([data-w])').forEach(el=>{el.dataset.w='1';lazyIO?lazyIO.observe(el):loadImg(el)})}
function renderSlides(){
  const pick=[...posts.filter(p=>p.pinned),...posts.filter(p=>!p.pinned&&(p.has_image||p.kind==='event')),...posts.filter(p=>!p.pinned&&!(p.has_image||p.kind==='event'))].slice(0,7);
  if(pick.length<1)return;
  $('slider').innerHTML=pick.map(p=>{const k=KIND[p.kind]||KIND.news,img=!!p.has_image;
    return `<a class="slide ${img?'':'noimg'}" href="#p-${esc(p.id)}" data-id="${esc(p.id)}">${img?`<img class="lazy" data-pid="${esc(p.id)}" data-v="${esc(p.v)}" alt="">`:`<span class="em">${k[0]}</span>`}<div class="sh"><small>${k[0]} ${k[1]}${p.event_date?' ・ '+fmtEvent(p.event_date).replace(/^\d+年/,''):''}</small><b>${esc(p.title)}</b></div></a>`}).join('');
  $('slideWrap').classList.remove('hidden');
  autoSlide($('slider'),$('dots'));lazyScan();
}
$('slider').onclick=e=>{const a=e.target.closest('[data-id]');if(!a)return;e.preventDefault();kind='';render();setTimeout(()=>document.getElementById('p-'+a.dataset.id)?.scrollIntoView({behavior:'smooth'}),50)};

/* ---- 体験・おすすめの投稿（主催者が確認してから載る） ---- */
let vImg=null;
function shrinkImg(file,max=900){return new Promise((ok,ng)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);let q=.8,d=c.toDataURL('image/jpeg',q);while(d.length>220000&&q>.4){q-=.12;d=c.toDataURL('image/jpeg',q)}ok(d)};im.onerror=()=>{URL.revokeObjectURL(u);ng()};im.src=u})}
async function openVoice(){
  const p=participant();$('voiceModal').classList.add('on');
  if(!p){$('voiceBody').innerHTML=`<p>投稿するには、スタンプラリーへの参加（名前を入れるだけ）が必要です。</p><a class="btn pink" href="./">参加する（スタンプラリーへ）</a>`;return}
  let shops=[];try{shops=await api('/rest/v1/shop_public?select=id,name&is_published=eq.true&order=name')}catch{}
  vImg=null;
  $('voiceBody').innerHTML=`<div class="muted" style="font-size:13.5px">主催者が確認してから、みんなに見えるようになります。</div>
    <label class="label" for="vT">ひとことタイトル</label><input id="vT" maxlength="60" placeholder="例）カニ丼が最高でした！">
    <label class="label" for="vShop">どのお店？（任意）</label><select id="vShop"><option value="">（選ばない）</option>${(shops||[]).map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select>
    <label class="label" for="vB">体験・おすすめ</label><textarea id="vB" rows="5" maxlength="1000" placeholder="よかったところ、おすすめポイントなど"></textarea>
    <label class="label">写真（任意・1枚）</label><img id="vPrev" class="hidden" style="width:100%;max-height:200px;object-fit:cover;border-radius:12px" alt=""><label class="btn ghost small" style="width:auto">📷 写真を選ぶ<input type="file" accept="image/*" id="vImg" hidden></label>
    <label class="label" for="vN">表示する名前</label><input id="vN" maxlength="30" value="${esc(p.nickname||'')}">
    <button class="btn pink" id="vSend">投稿する</button><div class="status" id="vSt"></div>
    <div id="vMine"></div>`;
  $('vImg').onchange=async()=>{const f=$('vImg').files?.[0];if(!f)return;try{vImg=await shrinkImg(f);$('vPrev').src=vImg;$('vPrev').classList.remove('hidden')}catch{toast('写真を読みこめませんでした')}};
  $('vSend').onclick=async()=>{const t=$('vT').value.trim(),st=$('vSt');if(!t)return st.textContent='タイトルを入れてください';st.textContent='送信中…';
    try{await rpc('mogu_guest_submit_post',{...auth(p),p_post:{title:t,body:$('vB').value,shop_id:$('vShop').value,author_name:$('vN').value.trim(),image_data:vImg||''}});
      st.textContent='ありがとう！主催者が確認したら載ります 🌸';$('vT').value='';$('vB').value='';vImg=null;$('vPrev').classList.add('hidden');loadMine()}
    catch(e){console.error(e);const m=errText(e);st.textContent=m.includes('多すぎ')?'1日に投稿できる数をこえました。また明日お願いします':/タイトル|本文|写真/.test(m)?m.replace(/^.*?((タイトル|本文|写真)[^"]*).*$/,'$1'):'送れませんでした'}};
  loadMine();
}
async function loadMine(){const p=participant();if(!p||!$('vMine'))return;
  try{const r=await rpc('mogu_guest_my_posts',auth(p))||[];$('vMine').innerHTML=r.length?'<label class="label">あなたの投稿</label>'+r.map(x=>`<div class="mine"><span class="s ${x.status}">${x.status==='published'?'掲載中':'確認待ち'}</span>${esc(x.title)}</div>`).join(''):''}catch(e){console.warn(e)}}
$('voiceOpen').onclick=openVoice;
document.addEventListener('click',e=>{const c=e.target.closest('[data-close]');if(c)$(c.dataset.close).classList.remove('on')});
$('voiceModal').addEventListener('click',e=>{if(e.target===$('voiceModal'))$('voiceModal').classList.remove('on')});

async function loadFestive(){
  try{const t=await rpc('mogu_info_ticker',{});const f=festiveInfo(t);if(!f.on)return;
    $('festBanner').textContent=f.text+(f.kind==='rally'?' スタンプを集めよう ›':'');$('festBanner').href=f.kind==='rally'?'./':'#';startFestive()}catch(e){console.warn(e)}
}

$('kinds').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;kind=b.dataset.k;history.replaceState(null,'',kind?`?k=${kind}`:location.pathname);render()};

(async()=>{
  try{posts=await rpc('mogu_list_posts',{})||[]}catch(e){console.error(e);$('posts').innerHTML='<div class="empty">読み込めませんでした。少し待って開き直してください</div>';return}
  try{localStorage.setItem('mogu_info_seen',String(Date.now()))}catch{}
  render();renderSlides();loadFestive();
  const h=location.hash.slice(1);if(h)setTimeout(()=>document.getElementById(h)?.scrollIntoView({behavior:'smooth'}),200);
})();
</script>
</body>
</html>
